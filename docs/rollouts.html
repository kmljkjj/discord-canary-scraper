<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rollouts — Canary Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>

  <nav class="nav">
    <a class="nav-brand" href="index.html"><span class="nav-logo">◈</span> Canary Lab</a>
    <div class="nav-links">
      <a href="index.html">Experiments</a>
      <a href="shop.html">Boutique</a>
      <a href="status.html">Statut</a>
      <a href="mobile.html">Mobile</a>
      <a class="active" href="rollouts.html">Rollouts</a>
    </div>
  </nav>

  <div class="wrap">
    <header class="header">
      <div class="brand-block">
        <h1>Rollouts</h1>
        <p class="subtitle">Pourcentages de déploiement des expériences Discord</p>
      </div>
      <div class="stats" id="stats">
        <div class="stat"><span class="stat-val" id="stat-total">—</span><span class="stat-label">Total</span></div>
        <div class="stat"><span class="stat-val" id="stat-pct">—</span><span class="stat-label">Avec %</span></div>
        <div class="stat"><span class="stat-val" id="stat-full">—</span><span class="stat-label">Full rollout</span></div>
        <div class="stat"><span class="stat-val" id="stat-fp">—</span><span class="stat-label">FP échantillonnés</span></div>
      </div>
    </header>

    <section class="toolbar">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Rechercher un experiment…" autocomplete="off" />
      </div>
      <div class="filters">
        <button class="chip active" data-filter="all">Tous</button>
        <button class="chip" data-filter="with-pct">Avec %</button>
        <button class="chip" data-filter="guild">Guild</button>
        <button class="chip" data-filter="user">User</button>
        <button class="chip" data-filter="fp">Fingerprint</button>
      </div>
      <div class="meta" id="meta">Chargement…</div>
    </section>

    <section class="sources" id="sources"></section>

    <main class="grid" id="grid">
      <div class="empty">Chargement…</div>
    </main>

    <footer class="footer">
      <span>Data · <a href="https://github.com/kmljkjj/discord-canary-scraper" target="_blank" rel="noopener">discord-canary-scraper</a></span>
      <span id="updated"></span>
    </footer>
  </div>

  <script src="rollouts.js"></script>
</body>
</html>
