<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Discord Experiments — Canary</title>
  <meta name="description" content="Galerie stylée des experiments Discord Canary" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>

  <header class="header">
    <div class="brand">
      <div class="logo">◈</div>
      <div>
        <h1>Experiments</h1>
        <p class="subtitle">Discord Canary · live from your scraper</p>
      </div>
    </div>
    <div class="stats" id="stats">
      <div class="stat"><span class="stat-val" id="stat-total">—</span><span class="stat-label">Total</span></div>
      <div class="stat"><span class="stat-val" id="stat-user">—</span><span class="stat-label">User</span></div>
      <div class="stat"><span class="stat-val" id="stat-guild">—</span><span class="stat-label">Guild</span></div>
      <div class="stat"><span class="stat-val" id="stat-apex">—</span><span class="stat-label">Apex</span></div>
    </div>
  </header>

  <section class="toolbar">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Rechercher un experiment…" autocomplete="off" />
    </div>
    <div class="filters">
      <button class="chip active" data-filter="all">Tous</button>
      <button class="chip" data-filter="user">User</button>
      <button class="chip" data-filter="guild">Guild</button>
      <button class="chip" data-filter="apex">Apex</button>
    </div>
    <div class="meta" id="meta">Chargement…</div>
  </section>

  <main class="grid" id="grid"></main>

  <footer class="footer">
    <span>Data · <a href="https://github.com/kmljkjj/discord-canary-scraper" target="_blank" rel="noopener">discord-canary-scraper</a></span>
    <span id="updated"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
