<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Boutique Discord — Canary Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>

  <nav class="nav">
    <a class="nav-brand" href="index.html"><span class="nav-logo">◈</span> Canary Lab</a>
    <div class="nav-links">
      <a href="index.html">Experiments</a>
      <a class="active" href="shop.html">Boutique</a>
      <a href="status.html">Statut</a>
    </div>
  </nav>

  <div class="wrap">
    <header class="header">
      <div class="brand-block">
        <h1>Boutique Discord</h1>
        <p class="subtitle">Avatar decorations, effets de profil, nameplates…</p>
      </div>
      <div class="stats">
        <div class="stat"><span class="stat-val" id="stat-items">—</span><span class="stat-label">Items</span></div>
        <div class="stat"><span class="stat-val" id="stat-cats">—</span><span class="stat-label">Catégories</span></div>
      </div>
    </header>

    <section class="toolbar">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Rechercher un item…" autocomplete="off" />
      </div>
      <div class="filters" id="filters">
        <button class="chip active" data-filter="all">Tous</button>
        <button class="chip" data-filter="avatar_decoration">Avatars</button>
        <button class="chip" data-filter="profile_effect">Effets</button>
        <button class="chip" data-filter="nameplate">Nameplates</button>
        <button class="chip" data-filter="bundle">Bundles</button>
      </div>
      <div class="meta" id="meta">Chargement…</div>
    </section>

    <main class="grid grid-shop" id="grid"></main>

    <footer class="footer">
      <span>Aperçu boutique · CDN Discord</span>
      <span id="updated"></span>
    </footer>
  </div>

  <script src="shop.js"></script>
</body>
</html>
