name: Wire Percentages
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Wire + test
        run: |
          set -euo pipefail
          python3 scripts/wire_percentages.py
          node --check src/lib/experiment_state.js
          node --check src/lib/experiment_percentages.js
          node --check src/lib/notify.js
          node --check src/lib/extract.js
          npm test
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/experiment_state.js src/lib/notify.js src/lib/extract.js \
            src/lib/experiment_percentages.js test/experiment_percentages.test.js scripts/wire_percentages.py package.json
          if git diff --staged --quiet; then echo nothing; exit 0; fi
          git commit -m "feat(experiments): attach guild/user percentages with provenance"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
