name: Patch apex user experiments
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_apex_user_exp.py'
      - '.github/workflows/patch-apex-user.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply user-exp patch
        run: |
          set -euo pipefail
          python3 scripts/patch_apex_user_exp.py
          node --check src/apex_rollouts.js
          grep -n "fromUserAssignment\|user assignments\|Types: user\|v4.1" src/apex_rollouts.js | head -20
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/apex_rollouts.js
          git commit -m "feat(apex): user experiments assignments + global % from workers" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
