name: Patch anti-double part2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-anti-double-p2.yml'
      - 'scripts/patch_anti_double_notify_index.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch notify+index
        run: |
          set -euo pipefail
          python3 scripts/patch_anti_double_notify_index.py
          node --check src/index.js
          node --check src/lib/notify.js
          grep -n "COOLDOWN\|expbatch\|claimPosted\|v11.6" src/index.js src/lib/notify.js | head -15
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.js src/lib/notify.js
          git commit -m "fix: cooldown + batch claim anti-double (v11.6)" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
