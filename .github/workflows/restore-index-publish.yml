name: Restore Index Publish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Restore from 7987da3 + wire + Contents API put
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git checkout 7987da3b32a7 -- src/index.js
          wc -c src/index.js
          head -2 src/index.js
          test $(wc -c < src/index.js) -gt 10000
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          python3 scripts/wire_publish.py
          node --check src/index.js
          node --check src/lib/publish_data.js
          npm test
          export SHA=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/src/index.js?ref=main" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['sha'])")
          echo "current blob sha $SHA"
          python3 - <<'PY'
import base64, json, os, urllib.request
with open("src/index.js", "rb") as f:
    content = base64.b64encode(f.read()).decode()
sha = os.environ["SHA"]
token = os.environ["GH_TOKEN"]
repo = os.environ["GITHUB_REPOSITORY"]
body = json.dumps({
    "message": "feat(data): restore index + atomic multi-file publish after notify",
    "content": content,
    "sha": sha,
    "branch": "main",
}).encode()
req = urllib.request.Request(
    f"https://api.github.com/repos/{repo}/contents/src/index.js",
    data=body,
    method="PUT",
    headers={
        "Authorization": f"Bearer {token}",
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json",
    },
)
with urllib.request.urlopen(req) as resp:
    data = json.load(resp)
    print("ok", data.get("content", {}).get("path"), data.get("commit", {}).get("sha"))
PY
