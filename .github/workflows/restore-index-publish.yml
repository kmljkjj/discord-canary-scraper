name: Restore Index Publish
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 40
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore + wire + test + push
        run: |
          set -euo pipefail
          git log --oneline -15 -- src/index.js
          # Prefer parent of SEE_FILE commit
          if grep -q 'SEE_FILE' src/index.js 2>/dev/null; then
            echo CORRUPT detected
            git show 'HEAD~1:src/index.js' > src/index.js || git show 'HEAD~2:src/index.js' > src/index.js
          fi
          wc -c src/index.js
          head -2 src/index.js
          test $(wc -c < src/index.js) -gt 1000
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          python3 scripts/wire_publish.py
          python3 scripts/update_publish_meta.py || true
          node --check src/index.js
          node --check src/lib/publish_data.js
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.js package.json .github/workflows/scrape.yml
          git status
          git commit -m "feat(data): restore index + atomic publish after notify" || true
          for i in $(seq 1 15); do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo OK; exit 0
            fi
            sleep 4
          done
          exit 1
