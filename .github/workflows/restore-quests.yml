name: Restore quests.js
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/quests_part1.b64'
      - 'scripts/quests_part2.b64'
      - '.github/workflows/restore-quests.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble quests.js
        run: |
          set -euo pipefail
          cat scripts/quests_part1.b64 scripts/quests_part2.b64 | base64 -d > src/quests.js
          node --check src/quests.js
          grep -n "videoLabel\|accent_color: 0\|0x000000\|Vidéo de présentation\|Vidéo à regarder" src/quests.js | head -15
          wc -c src/quests.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/quests.js
          git commit -m "feat(quests): photo haut, une vidéo, embed noir" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
