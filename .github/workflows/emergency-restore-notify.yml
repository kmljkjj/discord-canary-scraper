name: Emergency Restore Notify

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Restore notify.js from known-good commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git show 9ae99457fa:src/lib/notify.js > src/lib/notify.js
          test -s src/lib/notify.js
          grep -q 'notifyUrgent' src/lib/notify.js
          grep -qv 'PLACEHOLDER' src/lib/notify.js
          node --check src/lib/notify.js
          SHA=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/src/lib/notify.js?ref=main" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))")
          python3 - "$SHA" <<'PY'
          import base64, json, os, sys, urllib.request
          sha = sys.argv[1]
          content = open('src/lib/notify.js', 'rb').read()
          body = {
            'message': 'fix: emergency restore notify.js from 9ae99457fa',
            'content': base64.b64encode(content).decode(),
            'branch': 'main',
          }
          if sha:
            body['sha'] = sha
          data = json.dumps(body).encode()
          req = urllib.request.Request(
            f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/src/lib/notify.js",
            data=data, method='PUT',
            headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
            },
          )
          with urllib.request.urlopen(req, timeout=60) as r:
            print('put', r.status, len(content))
          PY
