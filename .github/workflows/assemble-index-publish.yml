name: Assemble Index Publish
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Assemble index from parts OR wire script
        run: |
          set -euo pipefail
          if [ -f scripts/index_pub_parts/part0.b64 ]; then
            cat scripts/index_pub_parts/part*.b64 | base64 -d > src/index.js
          else
            python3 scripts/wire_publish.py
          fi
          node --check src/index.js
          node --check src/lib/publish_data.js
          npm test
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            if(!p.scripts.check.includes('publish_data'))
              p.scripts.check += ' && node --check src/lib/publish_data.js';
            if(!p.scripts.test.includes('publish_data'))
              p.scripts.test += ' test/publish_data.test.js';
            fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
          "
          if ! grep -q 'data/generation.json' .github/workflows/scrape.yml; then
            sed -i 's|data/meta.json \\\\|data/meta.json \\\\\n            data/generation.json \\\\|' .github/workflows/scrape.yml || true
            # safer python edit
            python3 - <<'PY'
from pathlib import Path
p=Path('.github/workflows/scrape.yml')
t=p.read_text()
if 'generation.json' not in t:
    t=t.replace('            data/meta.json \\\n', '            data/meta.json \\\n            data/generation.json \\\n')
    p.write_text(t)
    print('scrape whitelist updated')
PY
          fi
      - name: Commit with token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.js package.json .github/workflows/scrape.yml src/lib/publish_data.js test/publish_data.test.js || true
          if git diff --staged --quiet; then echo nothing; exit 0; fi
          git commit -m "feat(data): atomic multi-file publish after notify success"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
