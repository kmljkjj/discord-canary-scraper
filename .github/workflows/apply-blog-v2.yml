name: Apply Blog V2 Messages
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Assemble + put blog_tracker.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, pathlib
          b64 = ''.join(pathlib.Path(f'scripts/blog_v2/p{i}.b64').read_text() for i in range(4))
          data = base64.b64decode(b64)
          pathlib.Path('src/blog_tracker.js').write_bytes(data)
          print('wrote', len(data))
          PY
          node --check src/blog_tracker.js
          grep -q 'buildBlogMessage' src/blog_tracker.js
          grep -q 'IS_COMPONENTS_V2' src/blog_tracker.js
          grep -qv "emoji:" src/blog_tracker.js || true
          SHA=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/src/blog_tracker.js?ref=main" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))")
          python3 - "$SHA" <<'PY'
          import base64, json, os, sys, urllib.request
          sha = sys.argv[1]
          content = open('src/blog_tracker.js', 'rb').read()
          body = {
            'message': 'feat(blog): Components V2 — image top, linked title, short excerpt, no emoji',
            'content': base64.b64encode(content).decode(),
            'branch': 'main',
          }
          if sha:
            body['sha'] = sha
          data = json.dumps(body).encode()
          req = urllib.request.Request(
            f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/src/blog_tracker.js",
            data=data, method='PUT',
            headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
            },
          )
          with urllib.request.urlopen(req, timeout=60) as r:
            print('put', r.status, len(content))
          PY
