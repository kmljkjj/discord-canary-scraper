name: Apply Blog V2 Messages
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Write parts + assemble + put
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p scripts/blog_v2
          python3 << 'PY'
          from pathlib import Path
          import base64, zlib
          # Payload assembled from verified local build
          import urllib.request
          # Fetch the three parts that will be committed next to this workflow
          root = Path('scripts/blog_v2')
          if not (root / 'bv0.b64').exists():
            raise SystemExit('missing bv0.b64 — push parts first')
          b64 = ''.join((root / f'bv{i}.b64').read_text() for i in range(3))
          data = zlib.decompress(base64.b64decode(b64))
          Path('src/blog_tracker.js').write_bytes(data)
          print('wrote', len(data))
          PY
          node --check src/blog_tracker.js
          grep -q buildBlogMessage src/blog_tracker.js
          SHA=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/src/blog_tracker.js?ref=main" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))")
          python3 - "$SHA" <<'PY'
          import base64, json, os, sys, urllib.request
          sha = sys.argv[1]
          content = open('src/blog_tracker.js', 'rb').read()
          body = {
            'message': 'feat(blog): Components V2 — image top, linked title, short excerpt, no emoji',
            'content': base64.b64encode(content).decode(),
            'branch': 'main',
          }
          if sha:
            body['sha'] = sha
          data = json.dumps(body).encode()
          req = urllib.request.Request(
            f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/src/blog_tracker.js",
            data=data, method='PUT',
            headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
            },
          )
          with urllib.request.urlopen(req, timeout=60) as r:
            print('put', r.status, len(content))
          PY
