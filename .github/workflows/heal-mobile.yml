name: Heal Mobile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply transactional mobile patches
        run: |
          set -euo pipefail
          python3 scripts/patch_mobile_tx.py
          node --check src/mobile_from_files.js
          node --check src/mobile_versions.js
          grep -n 'NOTIFY_FAIL\|MOBILE_FILES_DEGRADED\|return false' src/mobile_from_files.js | head
          grep -n 'NOTIFY_FAIL\|return false' src/mobile_versions.js | head
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/mobile_from_files.js src/mobile_versions.js
          git commit -m "fix: mobile transactional notify + degraded guard + robust webhook"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
