name: Heal Mobile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Opt-in PAUSED default
        run: |
          set -euo pipefail
          python3 scripts/patch_paused_optin.py
          grep -n "MOBILE_VERSIONS_PAUSED" src/mobile_versions.js | head -5
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/mobile_versions.js
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "fix: MOBILE_VERSIONS_PAUSED opt-in (only 1/true pauses)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
