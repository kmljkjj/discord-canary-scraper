name: Wire Atomic Publish
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Wire + test
        run: |
          set -euo pipefail
          python3 scripts/wire_publish.py
          node --check src/index.js
          node --check src/lib/publish_data.js
          npm test
      - name: Update package + scrape whitelist
        run: |
          set -euo pipefail
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            if(!p.scripts.check.includes('publish_data'))
              p.scripts.check += ' && node --check src/lib/publish_data.js';
            if(!p.scripts.test.includes('publish_data'))
              p.scripts.test += ' test/publish_data.test.js';
            fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
          "
          if ! grep -q 'data/generation.json' .github/workflows/scrape.yml; then
            sed -i 's|data/meta.json \\|data/meta.json \\\n            data/generation.json \\|' .github/workflows/scrape.yml
          fi
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.js src/lib/publish_data.js test/publish_data.test.js \
            scripts/wire_publish.py scripts/publish_success_block.js \
            package.json .github/workflows/scrape.yml
          if git diff --staged --quiet; then echo nothing; exit 0; fi
          git commit -m "feat(data): atomic multi-file publish after notify success"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
