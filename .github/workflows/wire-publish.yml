name: Wire Atomic Publish

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wire-publish
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Wire + test
        run: |
          set -euo pipefail
          python3 scripts/wire_publish.py
          node --check src/index.js
          node --check src/lib/publish_data.js
          npm test

      - name: Update package + scrape whitelist
        run: python3 scripts/update_publish_meta.py

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.js package.json .github/workflows/scrape.yml
          git status
          if git diff --staged --quiet; then echo nothing to commit; exit 0; fi
          git commit -m "feat(data): atomic multi-file publish after notify success"
          for i in $(seq 1 10); do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo pushed
              exit 0
            fi
            echo "retry $i"
            sleep 5
          done
          exit 1
