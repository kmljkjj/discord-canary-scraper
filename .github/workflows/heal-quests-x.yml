name: Heal Quests X TX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply transactional patches
        run: |
          set -euo pipefail
          python3 scripts/patch_quests_x_tx.py
          node --check src/quests.js
          node --check src/x_watch.js
          grep -n 'NOTIFY_FAIL\|still pending\|return ok' src/quests.js src/x_watch.js | head -20
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/quests.js src/x_watch.js
          git commit -m "fix: transactional notify for quests + x_watch (no state advance on webhook fail)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
