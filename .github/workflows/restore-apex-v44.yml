name: Restore Apex v4.4
on:
  workflow_dispatch:
  push:
    paths:
      - 'patches/apex.gz.b64.*'
      - '.github/workflows/restore-apex-v44.yml'
permissions:
  contents: write
concurrency:
  group: restore-apex-v44
  cancel-in-progress: true
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble from GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, gzip, json, os, urllib.request
          token = os.environ.get('GH_TOKEN', '')
          parts = []
          for i in range(8):
              url = f'https://api.github.com/repos/{os.environ.get("GITHUB_REPOSITORY", "kmljkjj/discord-canary-scraper")}/contents/patches/apex.gz.b64.{i}?ref=main'
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'restore-apex',
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
              })
              with urllib.request.urlopen(req) as r:
                  d = json.load(r)
              c = base64.b64decode(d['content']).decode()
              parts.append(c)
              print(i, len(c), c[:12])
          raw = gzip.decompress(base64.b64decode(''.join(parts)))
          open('src/apex_rollouts.js', 'wb').write(raw)
          print('wrote', len(raw))
          PY
          node --check src/apex_rollouts.js
          head -6 src/apex_rollouts.js
      - name: Commit JS only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/apex_rollouts.js
          if git diff --staged --quiet; then echo no changes; exit 0; fi
          git commit -m "fix(apex): v4.4 multi-token + anti-spam"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
