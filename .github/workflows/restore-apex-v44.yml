name: Restore Apex v4.4
on:
  workflow_dispatch:
  push:
    paths:
      - 'patches/apex.gz.b64.*'
permissions:
  contents: write
concurrency:
  group: restore-apex-v44
  cancel-in-progress: true
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode gzip payload and commit
        run: |
          set -euo pipefail
          cat patches/apex.gz.b64.0 patches/apex.gz.b64.1 patches/apex.gz.b64.2 patches/apex.gz.b64.3 patches/apex.gz.b64.4 patches/apex.gz.b64.5 patches/apex.gz.b64.6 patches/apex.gz.b64.7 | base64 -d | gzip -d > src/apex_rollouts.js
          node --check src/apex_rollouts.js
          test -f patches/apex-rollouts.yml && cp patches/apex-rollouts.yml .github/workflows/apex-rollouts.yml
          head -6 src/apex_rollouts.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/apex_rollouts.js .github/workflows/apex-rollouts.yml
          git commit -m "fix(apex): v4.4 multi-token + anti-spam" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true
