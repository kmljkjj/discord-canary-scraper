name: Security Inline Patches
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reliability patches (dedupe lock, quests V2, shop pending)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/lib/webhook_dedupe.js')
          t = p.read_text()
          if 'withDedupeLock' not in t:
              needle = "const CLAIM_STALE_MS = 5 * 60 * 1000;\n"
              insert = needle + "const LOCK_FILE = DEDUPE_FILE + '.lock';\nconst LOCK_WAIT_MS = 8000;\n\nasync function withDedupeLock(fn) {\n  const start = Date.now();\n  while (Date.now() - start < LOCK_WAIT_MS) {\n    let fd = null;\n    try {\n      fd = await fs.open(LOCK_FILE, 'wx');\n      try { return await fn(); }\n      finally {\n        try { await fd.close(); } catch {}\n        try { await fs.unlink(LOCK_FILE); } catch {}\n      }\n    } catch (e) {\n      if (e && e.code === 'EEXIST') {\n        await new Promise((r) => setTimeout(r, 15 + Math.floor(Math.random() * 40)));\n        continue;\n      }\n      console.warn('dedupe lock unavailable', e.message);\n      return fn();\n    }\n  }\n  console.warn('dedupe lock timeout');\n  return fn();\n}\n\n"
              if needle not in t: raise SystemExit('CLAIM_STALE missing')
              t = t.replace(needle, insert, 1)
              for name, old, new in [
                ('claimPosted',
                 "async function claimPosted(fp) {\n  try {\n    const d = await load();\n    const v = d.fps[fp];\n    if (v) {\n      const age = Date.now() - entryTs(v);\n      const st = entryStatus(v);\n      if (st === 'sent' && age < WINDOW_MS) return false;\n      if (st === 'pending' && age < CLAIM_STALE_MS) return false;\n    }\n    d.fps[fp] = { ts: Date.now(), status: 'pending' };\n    await save(d);\n    return true;\n  } catch (e) {\n    console.warn('claimPosted fail (allow send)', e.message);\n    return true;\n  }\n}",
                 "async function claimPosted(fp) {\n  try {\n    return await withDedupeLock(async () => {\n      const d = await load();\n      const v = d.fps[fp];\n      if (v) {\n        const age = Date.now() - entryTs(v);\n        const st = entryStatus(v);\n        if (st === 'sent' && age < WINDOW_MS) return false;\n        if (st === 'pending' && age < CLAIM_STALE_MS) return false;\n      }\n      d.fps[fp] = { ts: Date.now(), status: 'pending' };\n      await save(d);\n      return true;\n    });\n  } catch (e) {\n    console.warn('claimPosted fail (allow send)', e.message);\n    return true;\n  }\n}"),
                ('markPosted',
                 "async function markPosted(fp) {\n  try {\n    const d = await load();\n    d.fps[fp] = { ts: Date.now(), status: 'sent' };\n    await save(d);\n  } catch (e) {\n    console.warn('markPosted fail', e.message);\n  }\n}",
                 "async function markPosted(fp) {\n  try {\n    await withDedupeLock(async () => {\n      const d = await load();\n      d.fps[fp] = { ts: Date.now(), status: 'sent' };\n      await save(d);\n    });\n  } catch (e) {\n    console.warn('markPosted fail', e.message);\n  }\n}"),
                ('markFailed',
                 "async function markFailed(fp, error) {\n  try {\n    const d = await load();\n    d.fps[fp] = {\n      ts: Date.now(),\n      status: 'failed',\n      error: String(error || '').slice(0, 500),\n    };\n    await save(d);\n  } catch (e) {\n    console.warn('markFailed fail', e.message);\n  }\n}",
                 "async function markFailed(fp, error) {\n  try {\n    await withDedupeLock(async () => {\n      const d = await load();\n      d.fps[fp] = {\n        ts: Date.now(),\n        status: 'failed',\n        error: String(error || '').slice(0, 500),\n      };\n      await save(d);\n    });\n  } catch (e) {\n    console.warn('markFailed fail', e.message);\n  }\n}"),
              ]:
                  if old not in t: raise SystemExit(name + ' missing')
                  t = t.replace(old, new, 1)
              p.write_text(t)
              print('dedupe OK')
          else:
              print('dedupe already')

          p = Path('src/quests.js')
          t = p.read_text()
          t = t.replace("const { sendEmbeds } = require('./lib/webhook');", "const { sendEmbeds, sendWebhook } = require('./lib/webhook');", 1)
          old = "async function postWebhook(url, body) {\n  if (!url) return { ok: false, status: 0, text: 'no webhook' };\n  const embeds = body.embeds || [];\n  const base = { username: body.username || BOT_NAME, avatar_url: body.avatar_url || AVATAR };\n  return sendEmbeds(url, base, embeds, { label: 'quests', withDismiss: true });\n}"
          new = "async function postWebhook(url, body) {\n  if (!url) return { ok: false, status: 0, text: 'no webhook' };\n  if (body && Array.isArray(body.components) && body.components.length) {\n    return sendWebhook(url, body, { label: 'quests-v2' });\n  }\n  const embeds = body.embeds || [];\n  const base = { username: body.username || BOT_NAME, avatar_url: body.avatar_url || AVATAR };\n  return sendEmbeds(url, base, embeds, { label: 'quests', withDismiss: true });\n}"
          if old in t:
              t = t.replace(old, new, 1)
              p.write_text(t)
              print('quests OK')
          else:
              print('quests skip')

          p = Path('src/shop.js')
          t = p.read_text()
          marker = 'const toNotify = newItems.slice(0, 15);'
          if 'pendingNew' not in t and marker in t:
              # replace from marker through end of main success write
              start = t.index(marker)
              end = t.index("console.log('\u2705 Shop done", start)
              end = t.index('\n}', end) + 2
              new_block = '''let remaining = newItems.slice();
  const announced = { ...(prev.announced || {}) };
  const notified = [];
  while (remaining.length) {
    const batch = remaining.slice(0, 15);
    remaining = remaining.slice(15);
    const sent = await postWebhook(batch.map(buildEmbed));
    console.log('Webhook batch', batch.length, sent.status, sent.ok ? 'OK' : sent.text);
    if (!sent.ok) {
      console.warn('NOTIFY_FAIL shop — remaining will retry');
      process.exitCode = 2;
      remaining = batch.concat(remaining);
      break;
    }
    const ts = new Date().toISOString();
    for (const it of batch) {
      announced[it.id] = ts;
      notified.push(it.id);
    }
  }
  const knownIds = new Set([...(prev.ids || []), ...Object.keys(announced)]);
  const nextIds = allIds.filter((id) => knownIds.has(id));
  await writeJsonAtomic(STATE, {
    scrapedAt: new Date().toISOString(),
    count: items.length,
    ids: nextIds,
    items: items.map((i) => ({ id: i.id, name: i.name, type: i.type, image: i.image })),
    announced,
    lastNew: notified,
    pendingNew: remaining.map((i) => i.id),
  }, 2);
  console.log('\u2705 Shop done — announced', notified.length, 'pending', remaining.length);
}'''
              t = t[:start] + new_block + t[end:]
              p.write_text(t)
              print('shop OK')
          else:
              print('shop skip')
          print('done')
          PY
          grep -q withDedupeLock src/lib/webhook_dedupe.js && echo dedupe_ok
          grep -q quests-v2 src/quests.js && echo quests_ok
          grep -q pendingNew src/shop.js && echo shop_ok
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/webhook_dedupe.js src/quests.js src/shop.js
          git commit -m "fix: dedupe lock, quests V2 send path, shop pending batches" || exit 0
          git pull --rebase origin main || git pull --rebase --autostash origin main
          git push
