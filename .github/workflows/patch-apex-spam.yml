name: Patch apex anti-spam
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_apex_spam.py'
      - '.github/workflows/patch-apex-spam.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          set -euo pipefail
          python3 scripts/patch_apex_spam.py
          node --check src/apex_rollouts.js
          node --check src/lib/guild_decode.js || true
          echo '--- markers ---'
          grep -n "pctKey\|isLiveGuild\|filter ID ranges\|v4.3\|f:" src/apex_rollouts.js src/lib/guild_decode.js 2>/dev/null | head -25 || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/apex_rollouts.js src/lib/guild_decode.js
          git commit -m "fix(apex): stable guild % fingerprint — stop same-% spam" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
