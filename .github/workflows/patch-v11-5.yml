name: Patch v11.5 improvements
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_v11_5_improvements.py'
      - '.github/workflows/patch-v11-5.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply v11.5
        run: |
          set -euo pipefail
          python3 scripts/patch_v11_5_improvements.py
          node --check src/index.js
          node --check src/lib/extract.js
          node --check src/lib/notify.js
          head -3 src/index.js
          grep -n "apex_experiments\|extractDefaultConfigNear\|Endpoints\|v11.5\|system" src/index.js src/lib/extract.js src/lib/notify.js | head -25
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.js src/lib/extract.js src/lib/notify.js
          git commit -m "feat: v11.5 apex/legacy · defaultConfig · richer routes · snapshots" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
