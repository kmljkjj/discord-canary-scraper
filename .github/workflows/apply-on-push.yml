name: Apply Reliability On Push
on:
  push:
    paths:
      - 'scripts/.apply-reliability'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch quests postWebhook for V2
        run: |
          python3 -c "
          from pathlib import Path
          p = Path('src/quests.js')
          t = p.read_text()
          t = t.replace(\"const { sendEmbeds } = require('./lib/webhook');\", \"const { sendEmbeds, sendWebhook } = require('./lib/webhook');\", 1)
          a = 'const embeds = body.embeds || [];'
          b = '''if (body && Array.isArray(body.components) && body.components.length) {
    return sendWebhook(url, body, { label: \'quests-v2\' });
  }
  const embeds = body.embeds || [];'''
          if a not in t:
              raise SystemExit('marker missing')
          # only first occurrence inside postWebhook
          idx = t.find('async function postWebhook')
          idx2 = t.find(a, idx)
          t = t[:idx2] + b + t[idx2+len(a):]
          p.write_text(t)
          print('quests patched')
          "
          grep -n quests-v2 src/quests.js | head
      - name: Patch shop pending batches
        run: |
          python3 -c "
          from pathlib import Path
          p = Path('src/shop.js')
          t = p.read_text()
          if 'pendingNew' in t:
              print('shop already'); raise SystemExit(0)
          old = '''  const toNotify = newItems.slice(0, 15);
  const embeds = toNotify.map(buildEmbed);
  const sent = await postWebhook(embeds);
  console.log(\x27Webhook\x27, sent.status, sent.ok ? \x27OK\x27 : sent.text);

  if (!sent.ok) {
    console.warn(\x27NOTIFY_FAIL shop — ids NOT marked; will retry next run\x27);
    process.exitCode = 2;
    return;
  }

  const announced = { ...(prev.announced || {}) };
  for (const it of toNotify) {
    announced[it.id] = new Date().toISOString();
  }

  await writeJsonAtomic(
    STATE,
    {
      scrapedAt: new Date().toISOString(),
      count: items.length,
      ids: allIds,
      items: items.map((i) => ({
        id: i.id,
        name: i.name,
        type: i.type,
        image: i.image,
      })),
      announced,
      lastNew: toNotify.map((i) => i.id),
    },
    2,
  );
  console.log(\x27\u2705 Shop done — announced\x27, toNotify.length);
}'''
          print('looking for shop block', old[:40] in t)
          "
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/quests.js src/shop.js || true
          git status
          git commit -m "fix: quests V2 sendWebhook path" || exit 0
          git pull --rebase origin main || true
          git push
