name: Heal Notify MarkFailed
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          set -euo pipefail
          python3 scripts/patch_notify_markfailed.py
          node --check src/lib/notify.js
          node --check src/lib/webhook_dedupe.js
          grep -n markFailed src/lib/notify.js src/lib/webhook_dedupe.js | head
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/notify.js scripts/patch_notify_markfailed.py
          if git diff --staged --quiet; then echo nothing; exit 0; fi
          git commit -m "fix(notify): markFailed on webhook failure so pending is not stuck"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
