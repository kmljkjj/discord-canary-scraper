name: Set avatar URL defaults
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/datamining-avatar.svg'
      - 'scripts/set_avatar_url.py'
      - '.github/workflows/set-avatar-url.yml'
jobs:
  set:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/set_avatar_url.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: point ORBIT_AVATAR_URL to yellow list icon" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
