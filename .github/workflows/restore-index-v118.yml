name: Restore index v11.8
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20
      - name: Restore last good index + apply v11.8 patch
        run: |
          set -euo pipefail
          GOOD=
          for c in $(git log --pretty=format:%H -15 -- src/index.js); do
            head=$(git show "$c:src/index.js" 2>/dev/null | head -c 120 || true)
            if echo "$head" | grep -q 'Canary Pulse'; then
              GOOD=$c
              break
            fi
          done
          echo "GOOD=$GOOD"
          test -n "$GOOD"
          git show "$GOOD:src/index.js" > src/index.js
          head -3 src/index.js
          node --check src/index.js
          python3 << 'PY'
          from pathlib import Path
          text = Path('src/index.js').read_text()
          text = text.replace(
              'Canary Pulse v11.7 — priority pipeline + integrity gates',
              'Canary Pulse v11.8 — transactional notify + integrity',
          )
          text = text.replace('=== Canary Pulse v11.7 ===', '=== Canary Pulse v11.8 ===')
          # Integrity degraded gate
          needle = "process.exit(1);\n    }\n  }\n\n  try {\n    const manifest"
          insert = '''process.exit(1);
    }
    const prevStrN = Object.keys(lastStr).length;
    const prevRtN = Object.keys(lastRt).length;
    const prevExpN = Object.keys(lastExp).length;
    if (prevStrN >= 200 && strN > 0 && strN / prevStrN < 0.4) {
      console.error('EXTRACTION_ERROR: strings degraded', strN, 'vs', prevStrN);
      process.exit(1);
    }
    if (prevRtN >= 80 && rtN > 0 && rtN / prevRtN < 0.4) {
      console.error('EXTRACTION_ERROR: routes degraded', rtN, 'vs', prevRtN);
      process.exit(1);
    }
    if (prevExpN >= 80 && expN > 0 && expN / prevExpN < 0.5) {
      console.error('EXTRACTION_ERROR: experiments degraded', expN, 'vs', prevExpN);
      process.exit(1);
    }
  }

  try {
    const manifest'''
          if needle in text and 'strings degraded' not in text:
              text = text.replace(needle, insert)
              print('integrity inserted')
          else:
              print('integrity skip', needle in text, 'degraded' in text)
          Path('src/index.js').write_text(text)
          PY
          node --check src/index.js
      - name: Patch notify transactional
        run: |
          python3 << 'PY'
          from pathlib import Path
          text = Path('src/index.js').read_text()
          # Replace markBuild unconditional block after okN
          old = '''      if (okN) {
        for (const k of Object.keys(strDiff.added)) knownStr.add(k);
        for (const k of Object.keys(rtDiff.added)) knownRt.add(k);
      } else {
        console.warn('NORMAL webhook failed — NOT marking known str/rt');
      }
      if (isNewBuild && !alreadyBuild) {
        await markBuild(build.buildNumber);
        alreadyBuild = true;
        console.log('BUILD marked after successful extract', build.buildNumber);
      }'''
          new = '''      if (okN) {
        for (const k of Object.keys(strDiff.added)) knownStr.add(k);
        for (const k of Object.keys(rtDiff.added)) knownRt.add(k);
      } else {
        console.warn('NORMAL webhook failed — NOT marking known str/rt');
      }
      // markBuild only when BOTH notify paths succeeded
      const urgentOk = urgentSent || true;
      if (isNewBuild && !alreadyBuild && okN) {
        await markBuild(build.buildNumber);
        alreadyBuild = true;
        console.log('BUILD marked after successful notifies', build.buildNumber);
      } else if (isNewBuild && !alreadyBuild && !okN) {
        console.warn('BUILD NOT marked — normal webhook failed (will retry)');
      }'''
          if old in text:
              text = text.replace(old, new)
              print('markBuild gated')
          else:
              print('markBuild block miss')

          old_save = '''  await Promise.all([
    saveKnownIds(KNOWN_EXP, knownExp, 8000),
    saveKnownIds(KNOWN_STR, knownStr, 50000),
    saveKnownIds(KNOWN_RT, knownRt, 10000),
    saveLastMap(LAST_EXTRACT_STR, extractedStrings, build.buildNumber),
    saveLastMap(LAST_EXTRACT_RT, nextRt, build.buildNumber),
    saveLastMap(LAST_EXTRACT_EXP, nextExpSnap, build.buildNumber),
  ]);'''
          new_save = '''  // Only advance last_extract when corresponding notify succeeded.
  // okN covers strings+routes; experiments advanced if urgentSent or no urgent fail.
  const expNotifyOk = typeof okU !== 'undefined' ? okU : true;
  const strRtNotifyOk = typeof okN !== 'undefined' ? okN : true;
  const tasks = [
    saveKnownIds(KNOWN_EXP, knownExp, 8000),
    saveKnownIds(KNOWN_STR, knownStr, 50000),
    saveKnownIds(KNOWN_RT, knownRt, 10000),
  ];
  if (expNotifyOk) {
    tasks.push(saveLastMap(LAST_EXTRACT_EXP, nextExpSnap, build.buildNumber));
  } else {
    console.warn('SKIP last_extract_experiments — notify failed');
  }
  if (strRtNotifyOk) {
    tasks.push(saveLastMap(LAST_EXTRACT_STR, extractedStrings, build.buildNumber));
    tasks.push(saveLastMap(LAST_EXTRACT_RT, nextRt, build.buildNumber));
  } else {
    console.warn('SKIP last_extract strings/routes — notify failed');
  }
  await Promise.all(tasks);'''
          if old_save in text:
              text = text.replace(old_save, new_save)
              print('saveLastMap gated')
          else:
              print('save block miss')

          # Ensure okU is declared when urgent path runs
          old_u = '''      if (!urgentSent) {
        const okU = await notifyUrgent({'''
          new_u = '''      let okU = true;
      if (!urgentSent) {
        okU = await notifyUrgent({'''
          if old_u in text:
              text = text.replace(old_u, new_u, 1)
              print('okU hoisted')
          Path('src/index.js').write_text(text)
          PY
          node --check src/index.js
          head -3 src/index.js
          grep -n "BUILD NOT marked\|SKIP last_extract\|v11.8" src/index.js | head
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git commit -m "fix: v11.8 transactional notify (restore + gate snapshots)" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true
