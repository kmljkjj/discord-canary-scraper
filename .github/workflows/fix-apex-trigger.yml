name: Fix Apex Trigger Bugs
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fix-apex-announce.js"
      - ".github/workflows/fix-apex-trigger.yml"
permissions:
  contents: write
concurrency:
  group: fix-apex-trigger
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Apply announce + delta fixes
        run: |
          set -e
          test -f scripts/fix-apex-announce.js
          node scripts/fix-apex-announce.js src/apex_rollouts.js
          node --check src/apex_rollouts.js
          head -5 src/apex_rollouts.js
          grep -n "not marking announced" src/apex_rollouts.js
      - name: Commit
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/apex_rollouts.js
          if git diff --staged --quiet; then
            echo "already fixed"
            exit 0
          fi
          git commit -m "fix(apex): safe announce + stable pctKey for trigger-apex-rollouts"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
