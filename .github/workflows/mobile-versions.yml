name: Mobile Versions + Files

on:
  schedule:
    # Hourly — versions move slower than Canary web but OTA can land anytime
    - cron: '15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-mobile-versions]

permissions:
  contents: write

concurrency:
  group: mobile-scrape
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: nm-mobile-${{ runner.os }}-node22-${{ hashFiles('package.json') }}
          restore-keys: |
            nm-mobile-${{ runner.os }}-node22-

      - name: Install dependencies
        run: |
          if [ ! -d node_modules/node-fetch ]; then
            npm install --no-audit --no-fund --no-package-lock
          else
            echo "cache hit"
          fi
          rm -f package-lock.json

      - name: Mobile versions (store + OTA)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ORBIT_BOT_NAME: Datamining
        run: node src/mobile_versions.js
        continue-on-error: true

      - name: Mobile experiments from real files
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MOBILE_DATAMINE_REPO: https://github.com/Wumpus-Central/discord-mobile-datamining.git
          ORBIT_BOT_NAME: Datamining
        run: node src/mobile_from_files.js
        continue-on-error: true

      - name: Commit state
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/mobile_versions.json data/mobile_experiments.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No mobile state changes"
            exit 0
          fi
          VER=$(node -e "try{const d=require('./data/mobile_versions.json');const c=(d.channels||[]).filter(x=>x.version).map(x=>x.platform+':'+x.version).slice(0,4).join(' ');console.log(c||'state')}catch(e){console.log('state')}")
          git commit -m "mobile: ${VER}" || exit 0
          for i in 1 2 3 4; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pushed mobile OK"
              exit 0
            fi
            sleep 2
          done
          echo "::warning::mobile push failed"
          exit 0
