name: Upgrade quests fast
on:
  workflow_dispatch:
jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Patch quests.js for speed + rich info
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path('src/quests.js')
          src = p.read_text()
          if 'QUEST_TOKENS' in src and 'newest snowflake' in src:
              print('already fast')
              raise SystemExit(0)

          old_token = '''const DISCORD_TOKEN =
  process.env.DISCORD_TOKEN ||
  process.env.DISCORD_USER_TOKEN ||
  process.env.DISCORD_USER_TOKEN_1 ||
  null;'''
          new_token = '''function loadQuestTokens() {
  const out = [];
  const seen = new Set();
  const push = (t) => {
    const s = String(t || '').trim();
    if (!s || seen.has(s)) return;
    seen.add(s);
    out.push(s);
  };
  push(process.env.DISCORD_TOKEN);
  push(process.env.DISCORD_USER_TOKEN);
  for (let i = 1; i <= 8; i++) {
    push(process.env['DISCORD_USER_TOKEN_' + i]);
    push(process.env['DISCORD_USER_TOKENS' + i]);
  }
  const multi = process.env.DISCORD_USER_TOKENS || '';
  if (multi) multi.split(/[,\\n;]+/).forEach(push);
  return out;
}
const QUEST_TOKENS = loadQuestTokens();
const DISCORD_TOKEN = QUEST_TOKENS[0] || null;'''
          if old_token in src:
              src = src.replace(old_token, new_token, 1)
              print('tokens OK')
          else:
              print('tokens miss')

          old_main = '''  let quests = [];
  let official = [];
  let publicList = [];

  if (DISCORD_TOKEN) {
    try {
      official = await fetchOfficialQuests();
    } catch (e) {
      console.warn('Qu\u00eates officielles:', String(e.message || e).slice(0, 120));
    }
  } else {
    console.log('Tip: set secret DISCORD_TOKEN (user token) for faster official quest detection');
  }

  try {
    publicList = await fetchPublicQuests();
    console.log('API publique:', publicList.length, 'qu\u00eates');
  } catch (e) {
    console.error('API publique \u00e9chou\u00e9e:', e.message);
    if (!official.length) process.exitCode = 1;
  }'''
          # Try with actual French chars from file
          import re
          m = re.search(r"  let quests = \[\];\n  let official = \[\];\n  let publicList = \[\];\n\n  if \(DISCORD_TOKEN\)[\s\S]*?if \(!official\.length\) process\.exitCode = 1;\n  \}", src)
          if m:
              new_main = '''  let quests = [];
  let official = [];
  let publicList = [];

  console.log('Tokens quest:', QUEST_TOKENS.length);
  if (!QUEST_TOKENS.length) {
    console.log('Tip: set DISCORD_USER_TOKEN for faster official detection');
  }

  const [officialRes, publicRes] = await Promise.all([
    QUEST_TOKENS.length
      ? fetchOfficialQuests().catch((e) => {
          console.warn('Quetes officielles:', String(e.message || e).slice(0, 120));
          return [];
        })
      : Promise.resolve([]),
    fetchPublicQuests().catch((e) => {
      console.error('API publique echouee:', e.message);
      return [];
    }),
  ]);
  official = officialRes || [];
  publicList = publicRes || [];
  console.log('API publique:', publicList.length, 'quetes');
  if (!official.length && !publicList.length) process.exitCode = 1;'''
              src = src[:m.start()] + new_main + src[m.end():]
              print('parallel OK')
          else:
              print('parallel miss')

          # official multi-token via regex replace of function body start
          if 'for (const token of QUEST_TOKENS' not in src:
              m2 = re.search(r'async function fetchOfficialQuests\(\) \{[\s\S]*?\n\}\n\nasync function main', src)
              if m2:
                  new_off = '''async function fetchOfficialQuests() {
  if (!QUEST_TOKENS.length) {
    console.log('No DISCORD_TOKEN / DISCORD_USER_TOKEN \u2014 official quests skipped');
    return [];
  }
  const endpoints = [
    'https://canary.discord.com/api/v10/quests/@me',
    'https://discord.com/api/v10/quests/@me',
  ];
  const byId = new Map();
  let lastStatus = 0;
  for (const token of QUEST_TOKENS.slice(0, 5)) {
    for (const url of endpoints) {
      try {
        const res = await fetch(url, {
          headers: { Authorization: token, 'User-Agent': UA, Accept: 'application/json' },
          timeout: 20000,
        });
        lastStatus = res.status;
        if (res.status === 401 || res.status === 403) {
          console.warn('official quests auth failed HTTP', res.status);
          break;
        }
        if (res.status === 429) {
          const ra = Number(res.headers.get('retry-after') || 2);
          console.warn('official quests 429 \u2014 wait', ra, 's');
          await new Promise((r) => setTimeout(r, Math.min(8, ra) * 1000));
          continue;
        }
        if (!res.ok) {
          console.warn('official quests HTTP', res.status, url.includes('canary') ? 'canary' : 'stable');
          continue;
        }
        const data = await res.json();
        const list = Array.isArray(data) ? data : data.quests || data.data || [];
        for (const raw of list) {
          const q = normalizeQuest(raw);
          if (q && q.id) byId.set(q.id, q);
        }
        console.log('Official quests:', list.length, url.includes('canary') ? '(canary)' : '(stable)', 'unique', byId.size);
        break;
      } catch (e) {
        console.warn('official quests error:', String(e.message || e).slice(0, 120));
      }
    }
  }
  if (!byId.size && lastStatus) console.warn('official quests gave up, last HTTP', lastStatus);
  return [...byId.values()];
}

async function main'''
                  src = src[:m2.start()] + new_off + src[m2.end():]
                  print('official multi OK')
              else:
                  print('official miss')

          # newest first
          old_nq = '  const newQuests = isFirstRun ? [] : active.filter((q) => !prevIds.has(q.id));'
          new_nq = '''  const newQuests = isFirstRun
    ? []
    : active
        .filter((q) => !prevIds.has(q.id))
        .sort((a, b) => {
          try {
            const ia = BigInt(String(a.id).replace(/\\D/g, '') || '0');
            const ib = BigInt(String(b.id).replace(/\\D/g, '') || '0');
            if (ib > ia) return 1;
            if (ib < ia) return -1;
          } catch (_) {}
          return 0;
        });'''
          if old_nq in src:
              src = src.replace(old_nq, new_nq, 1)
              print('newest-first OK')

          if 'pending.slice(0, 15)' in src:
              src = src.replace('pending.slice(0, 15)', 'pending.slice(0, 25)', 1)
              print('batch 25 OK')

          # lag log
          old_log = "  console.log('Nouvelles quetes:', pending.length, '| notify batch:', batch.length);"
          # try both encodings
          for ol in [
              "  console.log('Nouvelles quetes:', pending.length, '| notify batch:', batch.length);",
              "  console.log('Nouvelles qu\u00eates:', pending.length, '| notify batch:', batch.length);",
          ]:
              pass
          m3 = re.search(r"  console\.log\('Nouvelles qu.{0,3}tes:', pending\.length, '\| notify batch:', batch\.length\);", src)
          if m3:
              lag = '''  console.log('Nouvelles quetes:', pending.length, '| notify batch:', batch.length);
  if (batch[0]) {
    const q0 = batch[0];
    const lagMs = q0.startsAt ? Date.now() - Date.parse(q0.startsAt) : null;
    console.log(
      'Fastest pending:',
      q0.id,
      q0.name,
      '| startsAt',
      q0.startsAt || '?',
      '| lag_h',
      lagMs != null ? (lagMs / 3600000).toFixed(2) : '?',
      '| src',
      q0.source || '?',
    );
  }'''
              src = src[:m3.start()] + lag + src[m3.end():]
              print('lag log OK')

          p.write_text(src)
          print('wrote', len(src))
          PY
          node --check src/quests.js
          grep -n "QUEST_TOKENS\|Promise.all\|newest\|slice(0, 25)\|Fastest pending" src/quests.js | head -20
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/quests.js
          git commit -m "feat(quests): faster parallel multi-token + newest-first notify" || true
          for i in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo PUSH_OK
              exit 0
            fi
            sleep $((i * 2))
          done
          exit 1
