name: P0 fix libs

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore webhook and publish_data
        run: |
          set -euo pipefail
          GOOD=3a15523067ee34baef55fb8a8fbe733cefb7b763
          git show "$GOOD:src/lib/webhook.js" > src/lib/webhook.js
          git show "$GOOD:src/lib/publish_data.js" > src/lib/publish_data.js
          sed -i 's/sent += components.length;/sent += 1;/' src/lib/webhook.js
          node --check src/lib/webhook.js
          node --check src/lib/publish_data.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/webhook.js src/lib/publish_data.js
          git commit -m "fix(p0): restore webhook/publish_data (undo placeholder)" || true
          git pull --rebase origin main || true
          git push origin main
