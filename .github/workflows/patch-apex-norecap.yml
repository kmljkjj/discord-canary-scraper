name: Patch apex no-recap
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_apex_norecap.py'
      - '.github/workflows/patch-apex-norecap.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          set -euo pipefail
          python3 scripts/patch_apex_norecap.py
          node --check src/apex_rollouts.js
          echo '--- markers ---'
          grep -n "pctFingerprint\|hasNumericPct\|Mise à jour\|No embeddable\|v4.2" src/apex_rollouts.js | head -20 || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/apex_rollouts.js
          git commit -m "fix(apex): no recap, only real % changes, less spam" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
