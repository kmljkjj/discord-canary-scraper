name: Patch Dismissible Content
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Wire extract.js + index.js
        run: |
          python3 << 'PY'
          from pathlib import Path

          ep = Path("src/lib/extract.js")
          et = ep.read_text()
          if "extractDismissibleContent" in et and "dismissibleContent" in et:
              print("extract.js already wired")
          else:
              if "dismissible_content" not in et:
                  needle = "const { inferType } = require('./infer_type');"
                  if needle in et:
                      et = et.replace(needle, needle + "\nconst { extractDismissibleContent } = require('./dismissible_content');", 1)
                  else:
                      et = "const { extractDismissibleContent } = require('./dismissible_content');\n" + et

              if "const dismissibleContent" not in et:
                  old = "  const strings = {};\n  const routes = {};\n  const expSet = new Map();"
                  new = "  const strings = {};\n  const routes = {};\n  const expSet = new Map();\n  const dismissibleContent = {};"
                  if old not in et:
                      raise SystemExit("strings/routes init not found")
                  et = et.replace(old, new, 1)

              if "extractDismissibleContent(webContent" not in et:
                  old = "      await extractCoreParallel(webContent, { routes, expSet, strings });"
                  if old in et:
                      et = et.replace(old, old + "\n      extractDismissibleContent(webContent, dismissibleContent);", 1)

              if "extractDismissibleContent(item.content" not in et:
                  old = "      if (item.size < 500_000) extractStrings(item.content, strings);"
                  if old in et:
                      et = et.replace(old, old + "\n      extractDismissibleContent(item.content, dismissibleContent);", 1)

              if "dismissible:" not in et:
                  old = """  console.log('Extract totals', {
    strings: Object.keys(strings).length,
    routes: Object.keys(routes).length,
    experiments: expSet.size,"""
                  new = """  console.log('Extract totals', {
    strings: Object.keys(strings).length,
    routes: Object.keys(routes).length,
    dismissible: Object.keys(dismissibleContent).length,
    experiments: expSet.size,"""
                  if old in et:
                      et = et.replace(old, new, 1)

              if "dismissibleContent," not in et:
                  old = "    strings,\n    routes,\n    css: cssInventory,"
                  new = "    strings,\n    routes,\n    dismissibleContent,\n    css: cssInventory,"
                  if old in et:
                      et = et.replace(old, new, 1)

              if "extractDismissibleContent," not in et:
                  old = "module.exports = {"
                  if old in et:
                      et = et.replace(old, "module.exports = {\n  extractDismissibleContent,", 1)

              ep.write_text(et)
              print("extract.js patched")

          ip = Path("src/index.js")
          it = ip.read_text()
          if "processDismissibleContent" in it:
              print("index.js already wired")
          else:
              if "require('./lib/dismissible_content')" not in it:
                  lines = it.split("\n")
                  insert_at = 10
                  for i, line in enumerate(lines[:40]):
                      if "require('./lib/" in line:
                          insert_at = i + 1
                  lines.insert(insert_at, "const { processDismissibleContent } = require('./lib/dismissible_content');")
                  it = "\n".join(lines)

              block = """
  // --- Dismissible Content enum (added / removed) ---
  try {
    const dismissible = findings.dismissibleContent || {};
    const dcCount = Object.keys(dismissible).length;
    const isDcSeed = !(await fs.pathExists(path.join(DATA, 'dismissible_content.json')));
    await processDismissibleContent({
      dataDir: DATA,
      current: dismissible,
      buildNumber: build.buildNumber,
      webhookUrl: process.env.DISCORD_WEBHOOK_URL,
      isSeed: isDcSeed,
    });
    console.log('Dismissible Content done', dcCount);
  } catch (e) {
    console.warn('Dismissible Content failed:', String(e.message || e).slice(0, 160));
  }
"""
              marker = "console.log('Notify done'"
              if marker in it:
                  idx = it.find(marker)
                  line_end = it.find("\n", idx)
                  it = it[: line_end + 1] + block + it[line_end + 1 :]
                  print("index.js patched after Notify done")
              else:
                  raise SystemExit("Notify done anchor not found")
              ip.write_text(it)

          print("OK")
          PY
          node --check src/lib/dismissible_content.js
          node --check src/lib/extract.js
          node --check src/index.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/extract.js src/index.js src/lib/dismissible_content.js .github/workflows/scrape.yml
          git status
          git commit -m "feat: wire Dismissible Content extraction + notifications" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push origin HEAD:main
