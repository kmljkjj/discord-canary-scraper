name: Patch Dismissible Content
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: |
          python3 scripts/patch_dismissible.py
          node --check src/lib/dismissible_content.js
          node --check src/lib/extract.js
          node --check src/index.js
          echo "--- extract dismissible refs ---"
          grep -n dismissible src/lib/extract.js | head -20
          echo "--- index dismissible refs ---"
          grep -n dismissible src/index.js | head -20
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/dismissible_content.js src/lib/extract.js src/index.js .github/workflows/scrape.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: track Dismissible Content adds/removes and notify"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "retry $i"
            sleep 2
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash origin main || true
          done
          git push origin HEAD:main --force-with-lease
