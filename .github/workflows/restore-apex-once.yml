name: Restore apex once
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore apex_rollouts.js from last good commit
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/kmljkjj/discord-canary-scraper/477463ae84eab403851c898cc6cf4422d2ae03b2/src/apex_rollouts.js" -o src/apex_rollouts.js
          # Yellow document avatar
          sed -i "s|https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/72x72/1f4ca.png|https://cdn.jsdelivr.net/gh/kmljkjj/discord-canary-scraper@main/assets/datamining-avatar.svg|g" src/apex_rollouts.js
          wc -c src/apex_rollouts.js
          head -c 100 src/apex_rollouts.js; echo
          grep -n ORBIT_AVATAR src/apex_rollouts.js | head -1
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/apex_rollouts.js
          git commit -m "fix: restore apex_rollouts.js + yellow document avatar" || exit 0
          git push origin HEAD:main
