name: Apply quests enrich patch
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply enrichment patch
        run: |
          set -e
          patch -p1 --forward -i scripts/quests_enrich.patch
          node --check src/quests.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/quests.js
          git commit -m "feat(quests): countdown, status, Nitro orbs, feature labels, marketing" || true
          git pull --rebase origin main || git pull --rebase --autostash origin main
          git push origin main
