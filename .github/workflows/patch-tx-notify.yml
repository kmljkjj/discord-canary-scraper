name: Patch TX Notify

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Patch index.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/index.js')
          text = p.read_text()
          assert len(text) > 15000 and 'Canary Pulse' in text

          text = text.replace('=== Canary Pulse v11.7 ===', '=== Canary Pulse v11.8 ===')
          text = text.replace(
            'priority pipeline + integrity gates',
            'transactional notify + integrity',
          )

          # Gate markBuild on okN
          text2, n = re.subn(
            r"(if \(okN\) \{[\s\S]*?NOT marking known str/rt[^\n]*\n      \}\n)"
            r"      if \(isNewBuild && !alreadyBuild\) \{\n"
            r"        await markBuild\(build\.buildNumber\);\n"
            r"        alreadyBuild = true;\n"
            r"        console\.log\('BUILD marked after successful extract', build\.buildNumber\);\n"
            r"      }",
            r"\1      if (isNewBuild && !alreadyBuild && okN) {\n"
            r"        await markBuild(build.buildNumber);\n"
            r"        alreadyBuild = true;\n"
            r"        console.log('BUILD marked after successful notifies', build.buildNumber);\n"
            r"      } else if (isNewBuild && !alreadyBuild && !okN) {\n"
            r"        console.warn('BUILD NOT marked - normal webhook failed (will retry)');\n"
            r"      }",
            text,
            count=1,
          )
          print('markBuild', n)
          text = text2

          old = '''  await Promise.all([
    saveKnownIds(KNOWN_EXP, knownExp, 8000),
    saveKnownIds(KNOWN_STR, knownStr, 50000),
    saveKnownIds(KNOWN_RT, knownRt, 10000),
    saveLastMap(LAST_EXTRACT_STR, extractedStrings, build.buildNumber),
    saveLastMap(LAST_EXTRACT_RT, nextRt, build.buildNumber),
    saveLastMap(LAST_EXTRACT_EXP, nextExpSnap, build.buildNumber),
  ]);'''
          new = '''  const strRtOk = typeof okN === 'undefined' ? true : okN;
  const tasks = [
    saveKnownIds(KNOWN_EXP, knownExp, 8000),
    saveKnownIds(KNOWN_STR, knownStr, 50000),
    saveKnownIds(KNOWN_RT, knownRt, 10000),
    saveLastMap(LAST_EXTRACT_EXP, nextExpSnap, build.buildNumber),
  ];
  if (strRtOk) {
    tasks.push(saveLastMap(LAST_EXTRACT_STR, extractedStrings, build.buildNumber));
    tasks.push(saveLastMap(LAST_EXTRACT_RT, nextRt, build.buildNumber));
  } else {
    console.warn('SKIP last_extract strings/routes - notify failed (retry next run)');
  }
  await Promise.all(tasks);'''
          if old in text:
            text = text.replace(old, new)
            print('last_extract gated')
          else:
            print('save block miss')

          if 'const okN = await notifyNormal' in text:
            text = text.replace('const okN = await notifyNormal', 'okN = await notifyNormal', 1)
            text = text.replace(
              'if (process.env.DISCORD_WEBHOOK_URL) {\n    try {',
              'let okN = true;\n  if (process.env.DISCORD_WEBHOOK_URL) {\n    try {',
              1,
            )
            print('okN hoisted')

          p.write_text(text)
          print('bytes', len(text))
          PY
          node --check src/index.js
          head -3 src/index.js
          grep -n 'BUILD NOT marked\|SKIP last_extract\|successful notifies\|strRtOk' src/index.js || true

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git commit -m "fix: transactional notify gates (markBuild + last_extract)" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true
