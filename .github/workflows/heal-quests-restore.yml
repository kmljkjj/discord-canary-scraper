name: Heal Restore Quests
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore from git history
        run: |
          set -euo pipefail
          python3 scripts/restore_quests_dedupe.py
          node --check src/quests.js
          test $(wc -c < src/quests.js) -gt 15000
          ! grep -q PLACEHOLDER src/quests.js
          grep -n "normalizeQuest\|String(q.id)\|prevIds" src/quests.js | head -15
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/quests.js data/quests.json scripts/restore_quests_dedupe.py
          if git diff --staged --quiet; then echo nothing; exit 0; fi
          git commit -m "fix(quests): restore full quests.js + mark sent IDs (no duplicate notifies)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
