name: Fix double notify
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-double-notify.yml'
      - 'scripts/anti_double_notify.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply anti-double patches
        run: python3 scripts/anti_double_notify.py
      - name: Syntax check
        run: |
          node --check src/index.js
          node --check src/lib/notify.js
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.js src/lib/notify.js .github/workflows/scrape.yml
          if git diff --staged --quiet; then
            echo "Already patched"
            exit 0
          fi
          git commit -m "fix: anti-double Datamining notify (claim + dedupe)"
          git push origin HEAD:main
