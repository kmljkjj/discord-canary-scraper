name: Fix double notify
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply anti-double patches
        run: python3 scripts/anti_double_notify.py
      - name: Syntax check
        run: |
          node --check src/index.js
          node --check src/lib/notify.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.js src/lib/notify.js .github/workflows/scrape.yml scripts/anti_double_notify.py
          git commit -m "fix: anti-double Datamining notify (claim + dedupe)" || exit 0
          git push origin HEAD:main
