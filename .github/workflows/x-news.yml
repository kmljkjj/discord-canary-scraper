name: X News · DiscordNEW8r

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-x-news]

permissions:
  contents: write

concurrency:
  group: x-posts  # partagé : les deux écrivent data/seen_x_posts.json
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup

      - name: Setup x-cli (timeline guest — aucun compte X requis)
        env:
          X_CLI_VERSION: 'v0.5.0'
        run: |
          set -e
          curl -fsSL -o /tmp/x.tar.gz \
            "https://github.com/tamnd/x-cli/releases/download/${X_CLI_VERSION}/x_${X_CLI_VERSION#v}_linux_amd64.tar.gz"
          mkdir -p bin /tmp/xcli
          tar -xzf /tmp/x.tar.gz -C /tmp/xcli
          BIN=$(find /tmp/xcli -maxdepth 2 -type f -name x | head -n1)
          install -m 755 "$BIN" bin/x
      - name: Watch @DiscordNEW8r
        env:
          X_NEWS_WEBHOOK_URL: ${{ secrets.X_NEWS_WEBHOOK_URL }}
          X_CLI_BIN: ${{ github.workspace }}/bin/x
          X_WEBHOOK_URL: ${{ secrets.X_WEBHOOK_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          # Preferred free auth: full browser Cookie header
          X_COOKIE: ${{ secrets.X_COOKIE }}
          X_SCREEN_NAME: DiscordNEW8r
          X_USER_ID: '2073982489836584960'
        run: node src/x_news.js

      - name: Debug surfaces X (diagnostic)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          X_CLI_BIN: ${{ github.workspace }}/bin/x
        run: |
          echo '--- matrice UA x handle (qui recoit les tweets ?) ---'
          for UA in 'x-cli/dev (+https://github.com/tamnd/x-cli)' 'curl/8.5.0' 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36'; do
            for H in DiscordNEW8r jack; do
              OUT=/tmp/syn_$H.html
              curl -sS -o "$OUT" -w "UA ${UA%% *} · $H: HTTP %{http_code} · %{size_download}B " \
                -A "$UA" "https://syndication.twitter.com/srv/timeline-profile/screen-name/$H" || true
              grep -c '"id_str"' "$OUT" 2>/dev/null || echo 'no tweets'
              rm -f "$OUT"
            done
          done
          echo '--- x doctor (sonde des 8 surfaces) ---'
          "${X_CLI_BIN}" doctor || true

      - name: Save seen ids
        if: always()
        env:
          COMMIT_SOFT_FAIL: '1'
        run: |
          scripts/commit-state.sh "x-news: seen" data/seen_x_posts.json
