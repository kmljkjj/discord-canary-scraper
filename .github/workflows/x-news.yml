name: X News · DiscordNEW8r

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-x-news]

permissions:
  contents: write

concurrency:
  group: x-news-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package.json') }}
          restore-keys: |
            nm-${{ runner.os }}-node22-

      - name: Install dependencies
        run: |
          if [ ! -d node_modules/node-fetch ] || [ ! -d node_modules/fs-extra ]; then
            npm install --no-audit --no-fund --no-package-lock
          fi
          rm -f package-lock.json

      - name: Watch @DiscordNEW8r
        env:
          X_NEWS_WEBHOOK_URL: ${{ secrets.X_NEWS_WEBHOOK_URL }}
          X_WEBHOOK_URL: ${{ secrets.X_WEBHOOK_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          # Preferred free auth: full browser Cookie header
          X_COOKIE: ${{ secrets.X_COOKIE }}
          X_SCREEN_NAME: DiscordNEW8r
          X_USER_ID: '2073982489836584960'
        run: node src/x_news.js

      - name: Save seen ids
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f package-lock.json
          git add -f data/seen_x_posts.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No seen-file changes"
            exit 0
          fi
          git commit -m "📌 x-news seen $(date -u +%Y-%m-%dT%H:%MZ)" || true
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pushed seen OK"
              exit 0
            fi
            git stash push -u -m "noise-$i" || true
            sleep 2
          done
          exit 0
