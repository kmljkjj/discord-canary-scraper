name: Restore rollouts JS only
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore user_rollouts.js + apex_rollouts.js from ed8b614
        run: |
          set -euo pipefail
          git show ed8b6140bac97007d665b15c3e65818aeb9f4683:src/user_rollouts.js > src/user_rollouts.js
          git show ed8b6140bac97007d665b15c3e65818aeb9f4683:src/apex_rollouts.js > src/apex_rollouts.js
          node --check src/user_rollouts.js
          node --check src/apex_rollouts.js
          wc -c src/user_rollouts.js src/apex_rollouts.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/user_rollouts.js src/apex_rollouts.js
          git commit -m "restore: user_rollouts.js + apex_rollouts.js from ed8b614" || true
          for i in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo PUSH_OK
              exit 0
            fi
            echo retry $i
            sleep $((i * 2))
          done
          exit 1
