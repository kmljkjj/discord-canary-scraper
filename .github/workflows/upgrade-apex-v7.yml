name: Upgrade apex v7
on:
  workflow_dispatch:
jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply v7 upgrades to apex_rollouts.js
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path('src/apex_rollouts.js')
          src = p.read_text()
          if 'Apex rollouts v7' in src and 'decodeStructured' in src:
              print('already v7')
              raise SystemExit(0)

          # 1) Header version bump + YEAR_MIN default 2025
          src = src.replace(
              'Apex rollouts v6 — EXACT guild % (Discord wire) + optional advaith cache',
              'Apex rollouts v7 — EXACT multi-source (Discord wire + workers) + rich ranges/filters',
              1,
          )
          src = src.replace(
              "process.env.APEX_RECENT_YEAR || '2024'",
              "process.env.APEX_RECENT_YEAR || '2025'",
              1,
          )

          # 2) Inject helper functions after rangesToPct
          helpers = r'''
function formatRanges(ranges) {
  if (!Array.isArray(ranges) || !ranges.length) return '';
  const parts = [];
  for (const r of ranges) {
    let a, b;
    if (r && typeof r === 'object' && !Array.isArray(r)) {
      a = Number(r.s ?? r.start);
      b = Number(r.e ?? r.end);
    } else if (Array.isArray(r) && r.length >= 2) {
      a = Number(r[0]);
      b = Number(r[1]);
    } else continue;
    if (!Number.isFinite(a) || !Number.isFinite(b)) continue;
    parts.push('(' + a + ' - ' + b + ')');
  }
  return parts.join(' ');
}

function formatFilters(filters) {
  if (!Array.isArray(filters) || !filters.length) return [];
  const lines = [];
  for (const f of filters) {
    if (!f || typeof f !== 'object') continue;
    const type = String(f.type || '').toLowerCase();
    if (type === 'platform' || type === 'client_os' || type === 'os') {
      const vals = f.platforms || f.values || f.os || f.clients || [];
      if (vals.length) lines.push('Platform must be one of these: ' + vals.join(', '));
    } else if (type === 'feature' || type === 'guild_feature') {
      const feats = f.features || f.values || [];
      if (feats.length) lines.push('Feature: ' + feats.join(', '));
    } else if (type === 'member_count' || type === 'guild_size') {
      const min = f.min_count ?? f.min;
      const max = f.max_count ?? f.max;
      if (min != null || max != null) lines.push('Member count: ' + (min ?? '?') + ' – ' + (max ?? '?'));
    }
  }
  return lines;
}

function decodeStructured(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const id = String(raw.id || raw.name || '').trim();
  if (!id) return null;
  const type = String(raw.type || raw.kind || 'guild').toLowerCase();
  const title = String(raw.title || raw.label || id);
  const rollout = raw.rollout || (raw.data && raw.data.rollout) || null;
  if (!rollout || typeof rollout !== 'object') return null;
  const populations = rollout.populations || [];
  const treatmentsMap = new Map();
  const filterLines = [];
  function ingest(posList, filters) {
    const fLines = formatFilters(filters || []);
    for (const fl of fLines) if (!filterLines.includes(fl)) filterLines.push(fl);
    for (const pos of posList || []) {
      if (!pos) continue;
      const bucket = Number(pos.bucket);
      const label = (pos.treatment && String(pos.treatment).trim()) || tLabel(bucket);
      const rollouts = pos.rollouts || pos.ranges || [];
      const ranges = [];
      for (const ro of rollouts) {
        if (!ro) continue;
        if (typeof ro === 'object' && !Array.isArray(ro))
          ranges.push({ s: Number(ro.start ?? ro.s), e: Number(ro.end ?? ro.e) });
        else if (Array.isArray(ro) && ro.length >= 2)
          ranges.push({ s: Number(ro[0]), e: Number(ro[1]) });
      }
      if (!treatmentsMap.has(bucket))
        treatmentsMap.set(bucket, { bucket, label, ranges: [] });
      const t = treatmentsMap.get(bucket);
      t.ranges.push(...ranges);
      if (label && !/^Variant|^None|^Control/i.test(label)) t.label = label;
    }
  }
  for (const pop of populations) ingest(pop.position || pop.positions || [], pop.filters || []);
  if (!treatmentsMap.size && Array.isArray(rollout.overrides_formatted)) {
    for (const ov of rollout.overrides_formatted) ingest(ov.position || [], ov.filters || []);
  }
  const treatments = [...treatmentsMap.values()]
    .map((t) => ({
      bucket: t.bucket,
      label: t.label,
      pct: rangesToPct(t.ranges),
      ranges: t.ranges.map((r) => [r.s, r.e]),
      rangeText: formatRanges(t.ranges),
    }))
    .sort((a, b) => (a.bucket ?? 9999) - (b.bucket ?? 9999));
  if (!treatments.length) return null;
  return {
    id,
    type: type === 'user' ? 'user' : 'guild',
    quality: 'exact',
    title,
    treatments,
    filterLines,
    populationCount: populations.length,
    fingerprint: treatments.map((t) => t.bucket + ':' + Number(t.pct).toFixed(1)).join('|'),
    revision: rollout.revision,
    hash: raw.hash != null ? Number(raw.hash) : murmur3(id),
    recent: isRecent(id),
    source: 'workers',
    hasGlobalPct: treatments.some((t) => t.pct != null && Number.isFinite(t.pct)),
  };
}

async function fetchWorkersStructured() {
  const out = [];
  for (const url of [WORKERS_URL, DEFS_URL]) {
    try {
      const res = await fetch(url, {
        headers: { 'User-Agent': UA, Accept: 'application/json' },
        timeout: 25000,
      });
      if (!res.ok) continue;
      const data = await res.json();
      const list = Array.isArray(data) ? data : data.experiments || [];
      let n = 0;
      for (const raw of list) {
        const e = decodeStructured(raw);
        if (e && e.hasGlobalPct && !String(e.id).startsWith('hash:')) {
          out.push(e);
          n++;
        }
      }
      console.log('Structured', url.split('/').slice(-2).join('/'), 'decoded', n, '/', list.length);
    } catch (e) {
      console.warn('Structured fail', e.message);
    }
  }
  return out;
}

'''
          marker = 'function decodeGuildWire(tuple, hashMap) {'
          if 'function decodeStructured' not in src:
              if marker not in src:
                  raise SystemExit('marker decodeGuildWire missing')
              src = src.replace(marker, helpers + marker, 1)

          # 3) Enrich decodeGuildWire treatments with ranges + rangeText
          old_map = '''  const treatments = [...byBucket.values()]
    .map((t) => ({
      bucket: t.bucket,
      label: t.label,
      pct: rangesToPct(t.intervals.map(([a, b]) => ({ s: a, e: b }))),
    }))
    .sort((a, b) => (a.bucket ?? 9999) - (b.bucket ?? 9999));'''
          new_map = '''  const treatments = [...byBucket.values()]
    .map((t) => {
      const rangeObjs = t.intervals.map(([a, b]) => ({ s: a, e: b }));
      return {
        bucket: t.bucket,
        label: t.label,
        pct: rangesToPct(rangeObjs),
        ranges: t.intervals,
        rangeText: formatRanges(rangeObjs),
      };
    })
    .sort((a, b) => (a.bucket ?? 9999) - (b.bucket ?? 9999));'''
          if old_map in src:
              src = src.replace(old_map, new_map, 1)

          # Add filterLines: [] to wire return
          if 'filterLines,' not in src and 'overrideIdCount: ovCount,' in src:
              src = src.replace(
                  'overrideIdCount: ovCount,',
                  'filterLines: [],\n    overrideIdCount: ovCount,',
                  1,
              )

          # 4) Rich embeds
          old_fmt = '''function fmtTreat(ts, max = 12) {
  const lines = (ts || [])
    .slice(0, max)
    .map((t) => '• **' + (t.label || 'Bucket ' + t.bucket) + '** · `' + t.pct + '%`');
  if ((ts || []).length > max) lines.push('_+' + (ts.length - max) + '_');
  return lines.join('\\n') || '_—_';
}'''
          # try flexible
          import re
          src2, n = re.subn(
              r"function fmtTreat\(ts, max = 12\) \{[\s\S]*?return lines\.join\('\\n'\) \|\| '_—_';\n\}",
              '''function fmtTreat(ts, max = 12) {
  const lines = [];
  for (const t of (ts || []).slice(0, max)) {
    const pct = t.pct != null ? t.pct + '%' : '?%';
    const ranges = t.rangeText ? '\\n' + t.rangeText : '';
    lines.push('**' + (t.label || 'Bucket ' + t.bucket) + '** | `' + pct + '`' + ranges);
  }
  if ((ts || []).length > max) lines.push('_+' + ((ts || []).length - max) + '_');
  return lines.join('\\n\\n') || '_—_';
}''',
              src,
              count=1,
          )
          if n:
              src = src2
              print('fmtTreat upgraded')
          else:
              print('fmtTreat pattern miss — leave')

          # buildEmbeds richer for added/changed
          old_added = "title: '+ ' + e.id,"
          if old_added in src:
              src = src.replace(old_added, "title: e.title || e.id,", 1)
          # description for added — inject population lines
          old_desc_added = "description: ['**' + e.title + '**', 'Type · `guild` · **EXACT**', '', fmtTreat(e.treatments)]"
          new_desc_added = "description: [((e.filterLines||[]).length?('**Population**\\n'+(e.filterLines||[]).slice(0,4).join('\\n')+'\\n\\n'):'') + fmtTreat(e.treatments) + '\\n\\n`' + e.id + '`']"
          if old_desc_added in src:
              src = src.replace(old_desc_added, new_desc_added, 1)
              print('added embed upgraded')

          old_desc_chg = "description: ['**' + e.title + '**', 'Type · `guild` · **EXACT**', '', lines.join('\\n')]"
          new_desc_chg = "description: [((e.filterLines||[]).length?('**Population**\\n'+(e.filterLines||[]).slice(0,4).join('\\n')+'\\n\\n'):'') + lines.join('\\n\\n') + '\\n\\n`' + e.id + '`']"
          if old_desc_chg in src:
              src = src.replace(old_desc_chg, new_desc_chg, 1)
              print('changed embed upgraded')

          # delta lines include ranges
          old_delta = "'• **' +\n        (d.label || 'bucket') +\n        '** · `' +\n        d.from +\n        '%` → `' +\n        d.to +\n        '%` (`' +\n        (d.delta > 0 ? '+' : '') +\n        d.delta +\n        '`),"
          new_delta = "'**' + (d.label || 'bucket') + '** | `' + d.from + '%` → `' + d.to + '%`' + (d.rangeText ? '\\n' + d.rangeText : ''),"
          if old_delta in src:
              src = src.replace(old_delta, new_delta, 1)
              print('delta line upgraded')

          # 5) main(): merge structured sources
          old_main_log = "console.log('📊 Apex rollouts v6 (EXACT guild % + stronger name map)');"
          new_main_log = "console.log('📊 Apex rollouts v7 (EXACT multi-source + rich ranges/filters)');"
          src = src.replace(old_main_log, new_main_log, 1)

          old_fetch = '''  const hashMap = await buildHashMap();
  const fromDiscord = await fetchDiscordGuild(hashMap);
  const fromCache = await loadAdvaithCache(hashMap);
  const byId = new Map();
  for (const e of [...fromCache, ...fromDiscord]) {
    if (!e || !e.id || !e.hasGlobalPct) continue;
    if (String(e.id).startsWith('hash:')) continue;
    byId.set(e.id, e);
  }
  const experiments = [...byId.values()];
  console.log('Live exact:', experiments.length, {
    discord: fromDiscord.length,
    advaith: fromCache.length,
  });'''

          new_fetch = '''  const hashMap = await buildHashMap();
  const structured = await fetchWorkersStructured();
  for (const e of structured) {
    if (e && e.id) {
      hashMap.set(e.hash, e.id);
      hashMap.set(String(e.hash), e.id);
    }
  }
  const fromDiscord = await fetchDiscordGuild(hashMap);
  const fromCache = await loadAdvaithCache(hashMap);
  const byId = new Map();
  for (const e of structured) {
    if (!e || !e.id || !e.hasGlobalPct) continue;
    if (String(e.id).startsWith('hash:')) continue;
    byId.set(e.id, e);
  }
  for (const e of fromCache) {
    if (!e || !e.id || !e.hasGlobalPct) continue;
    byId.set(e.id, e);
  }
  for (const e of fromDiscord) {
    if (!e || !e.id || !e.hasGlobalPct) continue;
    const prev = byId.get(e.id);
    if (prev && prev.filterLines && prev.filterLines.length && !(e.filterLines && e.filterLines.length)) {
      e.filterLines = prev.filterLines;
    }
    if (prev && prev.title && prev.title !== prev.id && e.title === e.id) e.title = prev.title;
    byId.set(e.id, e);
  }
  const experiments = [...byId.values()];
  console.log('Live exact:', experiments.length, {
    guild: experiments.filter((x) => x.type === 'guild').length,
    userExact: experiments.filter((x) => x.type === 'user').length,
    recent: experiments.filter((x) => x.recent).length,
    discord: fromDiscord.length,
    structured: structured.length,
    advaith: fromCache.length,
  });'''

          if old_fetch in src:
              src = src.replace(old_fetch, new_fetch, 1)
              print('main merge upgraded')
          else:
              print('main merge pattern miss')

          # Soften degrade threshold (structured adds many)
          src = src.replace(
              'prev.length >= 20 && experiments.length < Math.max(5, prev.length * 0.4)',
              'prev.length >= 40 && experiments.length < Math.max(8, prev.length * 0.2)',
              1,
          )

          # compact: keep ranges + filterLines
          old_compact_t = '.map((t) => ({ bucket: t.bucket, label: t.label, pct: Math.round(Number(t.pct) * 10) / 10 })),'
          new_compact_t = '.map((t) => ({ bucket: t.bucket, label: t.label, pct: Math.round(Number(t.pct) * 10) / 10, ranges: t.ranges || null, rangeText: t.rangeText || \'\' })),\n    filterLines: e.filterLines || [],'
          if old_compact_t in src:
              src = src.replace(old_compact_t, new_compact_t, 1)
              print('compact upgraded')

          # delta push include rangeText
          old_dpush = 'deltas.push({ label: t.label, bucket: t.bucket, from, to, delta: d });'
          new_dpush = "deltas.push({ label: t.label, bucket: t.bucket, from, to, delta: d, rangeText: t.rangeText || '', ranges: t.ranges || null });"
          if old_dpush in src:
              src = src.replace(old_dpush, new_dpush, 1)
              print('delta push upgraded')

          p.write_text(src)
          print('wrote', len(src), 'bytes')
          PY
          node --check src/apex_rollouts.js
          grep -n "v7\|decodeStructured\|fetchWorkersStructured\|formatRanges" src/apex_rollouts.js | head -20
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/apex_rollouts.js
          git commit -m "feat(apex): v7 multi-source exact % + rich ranges/filters" || true
          for i in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo PUSH_OK
              exit 0
            fi
            echo retry $i
            sleep $((i * 2))
          done
          exit 1
