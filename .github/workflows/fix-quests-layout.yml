name: Fix quests layout
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-quests-layout.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - name: Restore + patch
        run: |
          set -euo pipefail
          # Restore last good quests.js (before PLACEHOLDER)
          if [ "$(wc -c < src/quests.js)" -lt 500 ]; then
            echo "quests.js broken — restore from history"
            git log --oneline -- src/quests.js | head -10
            GOOD=$(git rev-list -n 1 --before="2026-09-15 18:00" HEAD -- src/quests.js || true)
            if [ -z "$GOOD" ]; then
              GOOD=$(git log --all --pretty=format:%H -- src/quests.js | while read c; do
                sz=$(git show "$c:src/quests.js" 2>/dev/null | wc -c)
                if [ "$sz" -gt 10000 ]; then echo "$c"; break; fi
              done)
            fi
            echo "GOOD=$GOOD"
            git show "$GOOD:src/quests.js" > src/quests.js
            wc -c src/quests.js
          fi
          node --check src/quests.js
          python3 <<'PY'
          from pathlib import Path
          t = Path('src/quests.js').read_text()
          if 'videoLabel' in t and 'accent_color: 0' in t:
              print('already patched')
              raise SystemExit(0)

          old_vid = """  let videoUrl = null;
          for (const key of ['hero_video', 'quest_bar_hero_video', 'video', 'preview_video']) {
            if (assets[key]) {
              videoUrl = assetUrl(id, assets[key]);
              break;
            }
          }
          const taskVideos = extractTaskVideos(root, id);
          if (!videoUrl && taskVideos.length) videoUrl = taskVideos[0];

          return {
            id,
            name:"""
          # fix indent - match file (2 spaces)
          old_vid = """  let videoUrl = null;
  for (const key of ['hero_video', 'quest_bar_hero_video', 'video', 'preview_video']) {
    if (assets[key]) {
      videoUrl = assetUrl(id, assets[key]);
      break;
    }
  }
  const taskVideos = extractTaskVideos(root, id);
  if (!videoUrl && taskVideos.length) videoUrl = taskVideos[0];

  return {
    id,
    name:"""

          new_vid = """  // Une seule vidéo : tâche (à regarder) prioritaire, sinon présentation
  const taskVideos = extractTaskVideos(root, id);
  let videoUrl = null;
  let videoKind = null;
  let videoLabel = null;
  if (taskVideos.length) {
    videoUrl = taskVideos[0];
    videoKind = 'task';
    videoLabel = 'Vidéo à regarder';
  } else {
    for (const key of [
      'hero_video',
      'quest_bar_hero_video',
      'preview_video',
      'video',
    ]) {
      if (assets[key]) {
        videoUrl = assetUrl(id, assets[key]);
        videoKind = 'presentation';
        videoLabel = 'Vidéo de présentation';
        break;
      }
    }
  }

  return {
    id,
    name:"""

          if old_vid not in t:
              print('video block miss')
              raise SystemExit(1)
          t = t.replace(old_vid, new_vid, 1)

          old_ret = """    videoUrl,
    taskVideos,
    primaryColor: colors.primary || null,"""
          new_ret = """    videoUrl,
    videoKind,
    videoLabel,
    taskVideos: videoUrl && videoKind === 'task' ? [videoUrl] : [],
    primaryColor: colors.primary || null,"""
          if old_ret not in t:
              print('ret miss')
              raise SystemExit(1)
          t = t.replace(old_ret, new_ret, 1)

          start = t.find('  const blocks = [];')
          end = t.find('  // Link buttons (style 5)')
          if start < 0 or end < 0:
              print('blocks miss', start, end)
              raise SystemExit(1)

          new_blocks = '''  const blocks = [];

  // 1) Photo en haut — une seule image (hero)
  if (quest.heroImage && isImageUrl(quest.heroImage)) {
    blocks.push({
      type: 12,
      items: [
        {
          media: { url: quest.heroImage },
          description: String(quest.name).slice(0, 100),
        },
      ],
    });
  }

  // 2) Texte
  blocks.push({ type: 10, content: header.join('\\n').slice(0, 4000) });
  blocks.push({ type: 14, divider: true, spacing: 1 });
  blocks.push({ type: 10, content: info.join('\\n').slice(0, 4000) });

  if (quest.tasksText) {
    blocks.push({ type: 14, divider: true, spacing: 1 });
    blocks.push({
      type: 10,
      content: ('**Tâches**\\n' + quest.tasksText).slice(0, 4000),
    });
  }

  const rewards = quest.rewards || [];
  if (rewards.length) {
    const rLines = [];
    for (const r of rewards.slice(0, 8)) {
      let line = '• **' + r.typeLabel + '**';
      if (r.name) line += ' — ' + r.name;
      if (r.orbQuantity != null) line += ' · **' + r.orbQuantity + ' orbes**';
      if (r.skuId) line += '\\n　SKU `' + r.skuId + '`;
      rLines.push(line);
    }
    blocks.push({ type: 14, divider: true, spacing: 1 });
    blocks.push({
      type: 10,
      content: ('**Récompenses**\\n' + rLines.join('\\n')).slice(0, 4000),
    });
  }

  blocks.push({ type: 14, divider: true, spacing: 1 });
  blocks.push({
    type: 10,
    content: '**ID** · `' + quest.id + '`' ,
  });

  // 3) Vidéo en bas — une seule (tâche ou présentation)
  if (quest.videoUrl && isVideoUrl(quest.videoUrl)) {
    const vLabel = quest.videoLabel || 'Vidéo';
    blocks.push({ type: 14, divider: true, spacing: 1 });
    blocks.push({
      type: 10,
      content: '**' + vLabel + '**',
    });
    blocks.push({
      type: 12,
      items: [
        {
          media: { url: quest.videoUrl },
          description: vLabel.slice(0, 100),
        },
      ],
    });
  }

'''
          # Fix accidental double-escaping of newlines in content strings
          new_blocks = new_blocks.replace('\\n', '\\n')  # keep as JS \n in source
          # Actually we need JS source to contain \n as two chars backslash-n in join...
          # In the triple-quoted string above I used \\\\n which is wrong.
          raise SystemExit('use external script')
          PY
          echo fail
