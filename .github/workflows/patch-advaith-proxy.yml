name: Patch advaith proxy
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_advaith_proxy.py'
      - '.github/workflows/patch-advaith-proxy.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 scripts/patch_advaith_proxy.py
          node --check src/apex_rollouts.js
          grep -n "allorigins\|APEX_ADVAITH_MIRROR\|profile-read-state\|advaith try" src/apex_rollouts.js | head -15
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/apex_rollouts.js
          git commit -m "fix(apex): fetch advaith via proxies for live guild %" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
