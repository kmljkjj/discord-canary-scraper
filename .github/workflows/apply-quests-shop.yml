name: Apply Quests Shop
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run patch script
        run: python3 scripts/apply_quests_shop.py
      - name: Remove broken temp workflows
        run: |
          for f in apply-on-push.yml fix-quests-shop.yml reliability-pending.yml security-inline.yml; do
            p=".github/workflows/$f"
            [ -f "$p" ] && git rm -f "$p" && echo removed $f || true
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/quests.js src/shop.js scripts/apply_quests_shop.py
          git add -u .github/workflows || true
          git status
          git commit -m "fix: quests V2 sendWebhook; shop pending batches; remove broken temp workflows" || exit 0
          git pull --rebase origin main || git pull --rebase --autostash origin main
          git push
