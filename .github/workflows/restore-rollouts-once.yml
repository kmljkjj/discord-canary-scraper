name: Restore rollouts once
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore good rollouts from ed8b614
        run: |
          set -euo pipefail
          git show ed8b6140bac97007d665b15c3e65818aeb9f4683:src/user_rollouts.js > src/user_rollouts.js
          git show ed8b6140bac97007d665b15c3e65818aeb9f4683:src/apex_rollouts.js > src/apex_rollouts.js
          git show ed8b6140bac97007d665b15c3e65818aeb9f4683:.github/workflows/user-rollouts.yml > .github/workflows/user-rollouts.yml
          node --check src/user_rollouts.js
          node --check src/apex_rollouts.js
          wc -c src/user_rollouts.js src/apex_rollouts.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/user_rollouts.js src/apex_rollouts.js .github/workflows/user-rollouts.yml
          git commit -m "restore: rollouts files from pre-break commit ed8b614" || exit 0
          git push origin HEAD:main
