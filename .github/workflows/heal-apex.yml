name: Heal Apex

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Restore and patch apex_rollouts.js
        run: |
          set -euo pipefail
          GOOD=""
          for c in $(git log --pretty=format:%H -50 -- src/apex_rollouts.js); do
            csz=$(git show "$c:src/apex_rollouts.js" 2>/dev/null | wc -c || echo 0)
            echo "try $c size=$csz"
            if [ "$csz" -gt 10000 ]; then
              GOOD=$c
              break
            fi
          done
          echo "GOOD=$GOOD"
          test -n "$GOOD"
          git show "$GOOD:src/apex_rollouts.js" > /tmp/apex.js
          python3 scripts/patch_apex_tx.py /tmp/apex.js src/apex_rollouts.js
          node --check src/apex_rollouts.js
          wc -c src/apex_rollouts.js
          head -5 src/apex_rollouts.js
          grep -n 'APEX_DEGRADED\|announced NOT advanced' src/apex_rollouts.js || true

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/apex_rollouts.js
          git commit -m "fix: restore apex_rollouts.js (transactional + APEX_DEGRADED)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
