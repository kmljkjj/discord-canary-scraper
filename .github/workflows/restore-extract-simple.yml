name: Restore extract simple

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50

      - name: Restore extract.js from 9b938bc
        run: |
          set -euo pipefail
          git show 9b938bcb1e550cc52d22a162e2e1a385d0ce798d:src/lib/extract.js > src/lib/extract.js
          wc -c src/lib/extract.js
          node --check src/lib/extract.js

      - name: Apply string/route quality patches
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path('src/lib/extract.js')
          t = p.read_text()

          t = t.replace(
          """      extractRoutes(item.content, routes);
      extractExperiments(item.content, expSet);
      if (item.size < 500_000) extractStrings(item.content, strings);
      extractDismissibleContent(item.content, dismissibleContent);""",
          """      extractRoutes(item.content, routes);
      extractExperiments(item.content, expSet);
      // Strings only from en-US locales (avoid false positives from random JS)
      extractDismissibleContent(item.content, dismissibleContent);""",
          1,
          )

          t = t.replace(
          """async function extractCoreParallel(webContent, { routes, expSet, strings }) {
  await Promise.all([
    Promise.resolve().then(() => extractRoutes(webContent, routes)),
    Promise.resolve().then(() => extractExperiments(webContent, expSet)),
    Promise.resolve().then(() => extractStrings(webContent, strings)),
  ]);
}""",
          """async function extractCoreParallel(webContent, { routes, expSet, strings }) {
  await Promise.all([
    Promise.resolve().then(() => extractRoutes(webContent, routes)),
    Promise.resolve().then(() => extractExperiments(webContent, expSet)),
  ]);
}""",
          1,
          )

          t = t.replace(
          """function isGoodStringKey(k) {
  if (typeof k !== 'string' || k.length !== 6) return false;
  if (!/^[A-Za-z0-9+/_-]{6}$/.test(k)) return false;
  if (/^[0-9a-f]{6}$/i.test(k)) return false;
  return true;
}""",
          """function isGoodStringKey(k) {
  if (typeof k !== 'string' || k.length !== 6) return false;
  if (!/^[A-Za-z0-9+/_-]{6}$/.test(k)) return false;
  if (/^[0-9a-f]{6}$/i.test(k)) return false;
  if (/^[0-9]{6}$/.test(k)) return false;
  if (!/[A-Za-z]/.test(k)) return false;
  return true;
}""",
          1,
          )

          t = t.replace(
          """function isGoodStringVal(s) {
  if (typeof s !== 'string') return false;
  if (s.length < 1 || s.length > 800) return false;
  if (/^discord_web-/i.test(s) || /^release:/i.test(s)) return false;
  return true;
}""",
          """function isGoodStringVal(s) {
  if (typeof s !== 'string') return false;
  if (s.length < 2 || s.length > 800) return false;
  if (/^discord_web-/i.test(s) || /^release:/i.test(s)) return false;
  if (!/[A-Za-z\u00C0-\u024F]/.test(s)) return false;
  if (s.length < 12 && !/\s/.test(s) && /^[a-z][a-zA-Z0-9]*$/.test(s)) return false;
  if (/^(function|undefined|object|string|number|boolean|null|true|false)$/i.test(s)) return false;
  if (/\.(js|css|map|json|png|jpg|webp|svg)(\?|$)/i.test(s)) return false;
  if (/^data:image\//i.test(s)) return false;
  if (/^[0-9a-f]{8,}$/i.test(s)) return false;
  return true;
}""",
          1,
          )

          old = """function normalizePath(raw) {
  if (typeof raw !== 'string') return null;
  let p = raw.trim();
  if (!p.startsWith('/')) return null;
  if (p.length < 2 || p.length > 300) return null;
  p = p.replace(/\$\{[^}]+\}/g, ':param');
  if (/\.(js|css|map|png|jpg|webp|svg|woff2?)$/i.test(p)) return null;
  if (p.startsWith('/assets/')) return null;
  return p;
}"""
          new = """function normalizePath(raw) {
  if (typeof raw !== 'string') return null;
  let p = raw.trim();
  if (!p.startsWith('/')) return null;
  if (p.length < 2 || p.length > 300) return null;
  p = p.replace(/\$\{[^}]+\}/g, ':param');
  if (/\.(js|css|map|png|jpg|webp|svg|woff2?)$/i.test(p)) return null;
  if (p.startsWith('/assets/') || p.startsWith('/static/')) return null;
  if (!isLikelyApiPath(p)) return null;
  return p;
}

function isLikelyApiPath(p) {
  if (!p || p === '/') return false;
  if (/^\/(api|users|guilds|channels|auth|oauth2|applications|webhooks|store|partners|discoverable|activities|quests|hypesquad|science|track|metrics|gateway|voice|attachments|emojis|stickers|interactions|billing|entitlements|stage-instances|scheduled-events|soundboard|unfurler|collectibles|presences|read-states|notifications|gifs|remote-auth|handoff)/i.test(p)) return true;
  if ((p.match(/\//g) || []).length >= 2 && p.length >= 6) return true;
  return false;
}"""
          if old not in t:
              raise SystemExit('normalizePath not found')
          t = t.replace(old, new, 1)

          import re
          m = re.search(r'function extractRoutes\(content, out\) \{[\s\S]*?\n\}\n\nfunction extractExperiments', t)
          if not m:
              raise SystemExit('extractRoutes not found')
          replacement = r'''function extractRoutes(content, out) {
  const add = (key, pathRaw) => {
    const p = normalizePath(pathRaw);
    if (isValidRouteKey(key) && p) out[key] = p;
  };
  let m;
  const re = /\b([A-Z][A-Z0-9_]{2,100})\s*:\s*["'`](\/[^"'`;\n]{1,250})["'`]/g;
  while ((m = re.exec(content)) !== null) add(m[1], m[2]);
  const re2 = /["']([A-Z][A-Z0-9_]{2,100})["']\s*:\s*["'`](\/[^"'`;\n]{1,250})["'`]/g;
  while ((m = re2.exec(content)) !== null) add(m[1], m[2]);
  const re3 = /\.([A-Z][A-Z0-9_]{2,100})\s*=\s*["'`](\/[^"'`;\n]{1,250})["'`]/g;
  while ((m = re3.exec(content)) !== null) add(m[1], m[2]);
  const re4 = /(?:Endpoints|Routes|API_ENDPOINTS|APIRoutes)\s*(?:\.|\[)\s*["']?([A-Z][A-Z0-9_]{2,100})["']?\s*(?:\])?\s*=\s*["'`](\/[^"'`;\n]{1,250})["'`]/g;
  while ((m = re4.exec(content)) !== null) add(m[1], m[2]);
  const re5 = /\b([A-Z][A-Z0-9_]{2,100})\s*:\s*(?:\([^)]*\)\s*=>\s*)?["'`](\/[^"'`;\n]{1,250})["'`]/g;
  while ((m = re5.exec(content)) !== null) add(m[1], m[2]);
  const re6 = /\b([A-Z][A-Z0-9_]{2,100})\s*=\s*(?:\([^)]*\)\s*=>\s*)?["'`](\/[^"'`;\n]{1,250})["'`]/g;
  while ((m = re6.exec(content)) !== null) add(m[1], m[2]);
}

function extractExperiments'''
          t = t[:m.start()] + replacement + t[m.end():]

          if 'isLikelyApiPath' in t and 'normalizePath,' in t:
              t = t.replace('  normalizePath,\n', '  normalizePath,\n  isLikelyApiPath,\n', 1)

          p.write_text(t)
          print('OK', p.stat().st_size)
          assert 'extractStrings(item.content, strings)' not in t
          assert 'isLikelyApiPath' in t
          PY
          node --check src/lib/extract.js

      - name: Commit and cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/extract.js
          git commit -m "fix(extract): fewer false strings + more reliable routes"
          rm -f .github/workflows/restore-extract-simple.yml .github/workflows/restore-extract-now.yml .github/workflows/fix-extract-str-rt.yml
          rm -rf scripts/_extract_b64
          git add -A .github/workflows scripts || true
          git commit -m "chore: remove extract restore helpers" || true
          git push
