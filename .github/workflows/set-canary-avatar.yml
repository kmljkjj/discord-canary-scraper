name: Set Canary Webhook Avatar
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/set-canary-avatar.yml"
permissions:
  contents: write
jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write avatar + update notify
        run: |
          python3 << 'PY'
          import base64, pathlib, re
          b64 = ""
          pathlib.Path("assets").mkdir(exist_ok=True)
          pathlib.Path("assets/datamining-avatar.jpg").write_bytes(base64.b64decode(b64))
          print("jpg", pathlib.Path("assets/datamining-avatar.jpg").stat().st_size)
          url = "https://cdn.jsdelivr.net/gh/kmljkjj/discord-canary-scraper@main/assets/datamining-avatar.jpg"
          p = pathlib.Path("src/lib/notify.js")
          t = p.read_text()
          t2, n = re.subn(r"https://cdn\\.jsdelivr\\.net/gh/jdecked/twemoji[^'\\s]+", url, t, count=1)
          t2 = t2.replace(
              "https://cdn.jsdelivr.net/gh/kmljkjj/discord-canary-scraper@main/assets/datamining-avatar.svg",
              url,
          )
          t2 = t2.replace(
              "https://cdn.jsdelivr.net/gh/kmljkjj/discord-canary-scraper@main/assets/datamining-avatar.png",
              url,
          )
          p.write_text(t2)
          print("notify replacements", n)
          sp = pathlib.Path(".github/workflows/scrape.yml")
          st = sp.read_text()
          if "ORBIT_AVATAR_URL" in st:
              st = re.sub(r"ORBIT_AVATAR_URL:.*", "ORBIT_AVATAR_URL: " + url, st)
          else:
              lines = st.splitlines()
              out = []
              inserted = False
              for line in lines:
                  out.append(line)
                  if (not inserted) and "DISCORD_WEBHOOK_URL:" in line:
                      indent = line[: len(line) - len(line.lstrip())]
                      out.append(indent + "ORBIT_AVATAR_URL: " + url)
                      inserted = True
              st = "\n".join(out) + "\n"
          sp.write_text(st)
          print("scrape ok")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/datamining-avatar.jpg src/lib/notify.js .github/workflows/scrape.yml
          if git diff --staged --quiet; then echo no changes; exit 0; fi
          git commit -m "style: canary webhook avatar = yellow document icon"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
