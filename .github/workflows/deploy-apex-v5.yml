name: Deploy Apex v5
on:
  workflow_dispatch:
  push:
    paths:
      - "patches/apex-v5.gz.b64.*"
      - ".github/workflows/deploy-apex-v5.yml"
permissions:
  contents: write
concurrency:
  group: deploy-apex-v5
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Assemble apex_rollouts.js v5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, gzip, json, os, urllib.request
          token = os.environ.get('GH_TOKEN', '')
          repo = os.environ.get('GITHUB_REPOSITORY', 'kmljkjj/discord-canary-scraper')
          parts = []
          for i in range(4):
              url = f'https://api.github.com/repos/{repo}/contents/patches/apex-v5.gz.b64.{i}?ref=main'
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'deploy-apex-v5',
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
              })
              with urllib.request.urlopen(req) as r:
                  d = json.load(r)
              c = base64.b64decode(d['content']).decode()
              parts.append(c)
              print(i, len(c))
          raw = gzip.decompress(base64.b64decode(''.join(parts)))
          open('src/apex_rollouts.js', 'wb').write(raw)
          print('wrote', len(raw))
          PY
          node --check src/apex_rollouts.js
          head -10 src/apex_rollouts.js
      - name: Write sync_advaith.py
        run: |
          mkdir -p scripts
          cat > scripts/sync_advaith.py << 'EOF'
          #!/usr/bin/env python3
          """Sync api.rollouts.advaith.io -> data/advaith_cache.json (run on PC/bot host)."""
          from __future__ import annotations
          import json, urllib.request
          from pathlib import Path
          ROOT = Path(__file__).resolve().parents[1]
          OUT = ROOT / "data" / "advaith_cache.json"
          URL = "https://api.rollouts.advaith.io/"
          def main():
              req = urllib.request.Request(URL, headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json",
                  "Referer": "https://rollouts.advaith.io/",
                  "Origin": "https://rollouts.advaith.io",
              })
              with urllib.request.urlopen(req, timeout=60) as res:
                  data = json.loads(res.read().decode())
              if not isinstance(data, list):
                  raise SystemExit("bad shape")
              OUT.parent.mkdir(parents=True, exist_ok=True)
              OUT.write_text(json.dumps(data, indent=2), encoding="utf-8")
              print(f"Wrote {len(data)} -> {OUT}")
          if __name__ == "__main__":
              main()
          EOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/apex_rollouts.js scripts/sync_advaith.py
          if git diff --staged --quiet; then echo no changes; exit 0; fi
          git commit -m "fix(apex): v5 exact Discord guild % + advaith_cache"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
