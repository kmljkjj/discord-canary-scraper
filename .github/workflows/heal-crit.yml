name: Heal Critical Hardening
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          set -euo pipefail
          python3 scripts/patch_crit_hardening.py
          node --check src/lib/download.js
          node --check src/index.js
          node --check src/lib/canary.js
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/download.js src/index.js
          if git diff --staged --quiet; then echo nothing; exit 0; fi
          git commit -m "fix: JS min download size + defensive mergeExp"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
