name: Apply TX gates
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore good index + degraded guard
        run: |
          set -euo pipefail
          git show b9f73795016ef6600639cc216865207b80294cd9:src/index.js > src/index.js
          wc -c src/index.js
          head -3 src/index.js
          python3 << 'PY'
          from pathlib import Path
          src = Path('src/index.js').read_text()
          assert 'v11.9' in src and len(src) > 15000
          src = src.replace(
            ' * Canary Pulse v11.9 \u2014 full transactional notify (no state advance on webhook fail)\n',
            ' * Canary Pulse v11.10 \u2014 transactional notify + degraded extract guard\n',
          )
          # also try literal em-dash variants
          src = src.replace('v11.9', 'v11.10')
          src = src.replace('full transactional notify (no state advance on webhook fail)', 'transactional notify + degraded extract guard')
          marker = "console.log('Integrity check', { expN, strN, rtN, downloadStats: ds });"
          if marker not in src:
              raise SystemExit('marker missing')
          insert = '''
    const baseExp = Object.keys(lastExp).length;
    const baseStr = Object.keys(lastStr).length;
    const baseRt = Object.keys(lastRt).length;
    console.log('Integrity check', {
      expN,
      strN,
      rtN,
      baseExp,
      baseStr,
      baseRt,
      downloadStats: ds,
    });

    if (expN === 0 && strN < 50 && baseExp > 40) {
      try {
        await fs.writeJson(LAST_RUN_META, {
          schemaVersion: 1,
          buildNumber: String(build.buildNumber),
          ts: Date.now(),
          status: 'failed',
          ok: false,
          reason: 'EXTRACTION_EMPTY',
          downloadStats: ds,
        });
      } catch {}
      console.error('EXTRACTION_ERROR: empty extract vs non-empty baseline');
      process.exit(1);
    }

    const solidBaseline = baseExp >= 80 && baseStr >= 200;
    if (solidBaseline) {
      const ratioExp = expN / Math.max(baseExp, 1);
      const ratioStr = strN / Math.max(baseStr, 1);
      const degraded =
        (ratioExp < 0.55 && ratioStr < 0.7) ||
        (ratioStr < 0.55 && ratioExp < 0.7) ||
        ratioExp < 0.45 ||
        ratioStr < 0.45;
      if (degraded) {
        try {
          await fs.writeJson(LAST_RUN_META, {
            schemaVersion: 1,
            buildNumber: String(build.buildNumber),
            ts: Date.now(),
            status: 'failed',
            ok: false,
            reason: 'EXTRACTION_DEGRADED',
            ratios: { exp: ratioExp, str: ratioStr },
            counts: { expN, strN, baseExp, baseStr },
            downloadStats: ds,
          });
        } catch {}
        console.error('EXTRACTION_ERROR: degraded extract', { ratioExp, ratioStr, expN, strN, baseExp, baseStr });
        process.exit(1);
      }
    }
'''
          # Replace the simple integrity block with the expanded one
          old_block_start = src.find("  {\n    const expN = (findings.experiments || []).length;")
          old_block_end = src.find('  try {\n    const manifest = await archiveBuildChunks', old_block_start)
          if old_block_start < 0 or old_block_end < 0:
              raise SystemExit(f'block bounds {old_block_start} {old_block_end}')
          new_block = '''  {
    const expN = (findings.experiments || []).length;
    const strN = Object.keys(findings.strings || {}).length;
    const rtN = Object.keys(findings.routes || {}).length;
    const ds = findings.downloadStats || {};
''' + insert + '''  }

'''
          src = src[:old_block_start] + new_block + src[old_block_end:]
          src = src.replace(
            "console.warn('empty extract');\n    process.exit(0);",
            "console.warn('empty extract — abort');\n    process.exit(1);",
          )
          Path('src/index.js').write_text(src)
          print('ok', len(src), 'DEGRADED', 'EXTRACTION_DEGRADED' in src)
          PY
          node --check src/index.js
          grep -n "v11.10\|EXTRACTION_DEGRADED\|process.exit(1)" src/index.js | head -15
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git commit -m "fix: restore index v11.10 + EXTRACTION_DEGRADED guard"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
