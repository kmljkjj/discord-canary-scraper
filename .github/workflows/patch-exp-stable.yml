name: Patch experiments stable
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_exp_stable.py'
      - '.github/workflows/patch-exp-stable.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply experiment stability patches
        run: |
          python3 scripts/patch_exp_stable.py
          node --check src/index.js
          node --check src/lib/extract.js
          head -3 src/index.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.js src/lib/extract.js
          if git diff --staged --quiet; then
            echo "Already patched"
            exit 0
          fi
          git commit -m "fix: stable experiments v11.3 (meaningful modified + variations)"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
