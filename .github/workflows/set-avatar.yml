name: Set Datamining avatar
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/set-avatar.yml'
jobs:
  set:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install pillow & write avatar from attached pattern
        run: |
          set -euo pipefail
          pip3 install --user Pillow -q
          python3 << 'PY'
          from pathlib import Path
          import base64, re, urllib.request

          # Prefer committed JPG if we write it; generate solid yellow icon if missing
          try:
              from PIL import Image, ImageDraw
              # Recreate the yellow document icon style (512x512)
              size = 512
              im = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              # rounded yellow page
              margin = 40
              d.rounded_rectangle([margin, margin, size-margin, size-margin], radius=60, fill=(255, 196, 0, 255))
              # folded corner
              d.polygon([(size-margin-80, margin), (size-margin, margin), (size-margin, margin+80)], fill=(255, 214, 80, 255))
              d.polygon([(size-margin-80, margin), (size-margin-80, margin+80), (size-margin, margin+80)], fill=(230, 160, 0, 255))
              # white bars (list)
              bar_x0, bar_x1 = 200, 400
              for i, y in enumerate([170, 250, 330]):
                  d.rounded_rectangle([bar_x0, y, bar_x1, y+40], radius=12, fill=(255, 255, 255, 255))
              # + ~ ? symbols
              d.text((95, 160), "+", fill=(255, 255, 255, 255))
              d.text((95, 245), "~", fill=(255, 255, 255, 255))
              d.text((100, 330), "?", fill=(255, 255, 255, 255))
              out = Path('assets')
              out.mkdir(exist_ok=True)
              im.convert('RGB').save(out / 'datamining-avatar.jpg', quality=90, optimize=True)
              print('generated', (out / 'datamining-avatar.jpg').stat().st_size)
          except Exception as e:
              print('gen fail', e)
              raise

          AVATAR_URL = 'https://cdn.jsdelivr.net/gh/kmljkjj/discord-canary-scraper@main/assets/datamining-avatar.jpg'
          RAW_URL = 'https://raw.githubusercontent.com/kmljkjj/discord-canary-scraper/main/assets/datamining-avatar.jpg'
          repls = [
              ('https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/72x72/1f4ca.png', AVATAR_URL),
              ('https://cdn.jsdelivr.net/gh/kmljkjj/discord-canary-scraper@main/assets/datamining-avatar.svg', AVATAR_URL),
          ]
          for path in list(Path('src').rglob('*.js')) + list(Path('.github').rglob('*.yml')):
              try:
                  t = path.read_text()
              except Exception:
                  continue
              orig = t
              for a, b in repls:
                  t = t.replace(a, b)
              # force ORBIT_AVATAR_URL default
              if 'ORBIT_AVATAR_URL' in t and AVATAR_URL not in t:
                  t = re.sub(
                      r"(process\.env\.ORBIT_AVATAR_URL\s*\|\|\s*)([^\n;]+)",
                      lambda m: m.group(1) + "'" + AVATAR_URL + "'",
                      t,
                      count=1,
                  )
              if t != orig:
                  path.write_text(t)
                  print('updated', path)
          print('done')
          PY
      - name: Commit avatar + code defaults
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/datamining-avatar.jpg src .github || true
          git commit -m "assets: Datamining webhook avatar (yellow list icon)" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
