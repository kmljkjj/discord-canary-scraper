name: P0 assemble experiment_state

on:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assemble experiment_state and patch index
        run: |
          set -euo pipefail
          python3 scripts/p0_assemble_es.py
          node --check src/lib/experiment_state.js
          python3 scripts/p0_patch_index.py
          node --check src/index.js

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/experiment_state.js src/index.js
          git commit -m "fix(p0): unified experiment model, multi-signal coverage, confirmed removals" || true
          git pull --rebase origin main || true
          git push origin main
