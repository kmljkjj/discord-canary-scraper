name: Assemble Apex v6
on:
  workflow_dispatch:
  push:
    paths:
      - "patches/apex_half1.js"
      - "patches/apex_half2.js"
      - ".github/workflows/assemble-apex-v6.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate halves
        run: |
          cat patches/apex_half1.js patches/apex_half2.js > src/apex_rollouts.js
          node --check src/apex_rollouts.js
          wc -c src/apex_rollouts.js
          python3 - <<'PY'
          from pathlib import Path
          for rel in [".github/workflows/user-rollouts.yml", ".github/workflows/apex-rollouts.yml"]:
            p = Path(rel)
            if not p.exists():
              continue
            t = p.read_text()
            t = t.replace("USER_ROLLOUT_SAMPLES: '40'", "USER_ROLLOUT_SAMPLES: '80'")
            t = t.replace("APEX_MIN_PCT_DELTA: '2'", "APEX_MIN_PCT_DELTA: '3'")
            t = t.replace("datamining-avatar.svg", "datamining-avatar.jpg")
            p.write_text(t)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/apex_rollouts.js .github/workflows/*.yml
          if git diff --staged --quiet; then echo no changes; exit 0; fi
          git commit -m "fix: apex_rollouts v6 assembled — EXACT guild % + name map"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
