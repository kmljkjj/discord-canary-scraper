name: Patch Apex Crowd Method
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/patch-apex-crowd.yml"
      - "scripts/apply-apex-crowd-patch.js"
permissions:
  contents: write
concurrency:
  group: patch-apex-crowd
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Apply crowd method patch
        run: |
          node scripts/apply-apex-crowd-patch.js src/apex_rollouts.js
          node --check src/apex_rollouts.js
          head -5 src/apex_rollouts.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/apex_rollouts.js
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "feat(apex): crowd hash_result method like Escoteiros/Wumpus research"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true
