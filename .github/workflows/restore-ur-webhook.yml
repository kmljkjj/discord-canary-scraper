name: Restore UR webhook patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20

      - name: Restore user_rollouts.js from last good commit + short secret
        run: |
          set -euo pipefail
          git show 1fe53da1d829:src/user_rollouts.js > src/user_rollouts.js
          python3 << 'PY'
          from pathlib import Path
          p = Path('src/user_rollouts.js')
          js = p.read_text()
          old = """const WEBHOOK_CANDIDATES = [
            ['USER_ROLLOUT_WEBHOOK_URL', process.env.USER_ROLLOUT_WEBHOOK_URL],
            ['APEX_WEBHOOK_URL', process.env.APEX_WEBHOOK_URL],
            ['ROLLOUT_WEBHOOK_URL', process.env.ROLLOUT_WEBHOOK_URL],
            ['DISCORD_WEBHOOK_URL', process.env.DISCORD_WEBHOOK_URL],
          ];""".replace('          ', '')
          # normalize spacing from git show
          old = """const WEBHOOK_CANDIDATES = [
            ['USER_ROLLOUT_WEBHOOK_URL', process.env.USER_ROLLOUT_WEBHOOK_URL],
            ['APEX_WEBHOOK_URL', process.env.APEX_WEBHOOK_URL],
            ['ROLLOUT_WEBHOOK_URL', process.env.ROLLOUT_WEBHOOK_URL],
            ['DISCORD_WEBHOOK_URL', process.env.DISCORD_WEBHOOK_URL],
          ];"""
          # Fix: use exact content from file
          import re
          m = re.search(r"const WEBHOOK_CANDIDATES = \[[\s\S]*?\];", js)
          if not m:
              raise SystemExit('WEBHOOK_CANDIDATES not found')
          new = """const WEBHOOK_CANDIDATES = [
            // Nom court pour secret GitHub (limite UI) ; ancien nom gardé en fallback
            ['UR_WEBHOOK', process.env.UR_WEBHOOK],
            ['USER_ROLLOUT_WEBHOOK_URL', process.env.USER_ROLLOUT_WEBHOOK_URL],
            ['APEX_WEBHOOK_URL', process.env.APEX_WEBHOOK_URL],
            ['ROLLOUT_WEBHOOK_URL', process.env.ROLLOUT_WEBHOOK_URL],
            ['DISCORD_WEBHOOK_URL', process.env.DISCORD_WEBHOOK_URL],
          ];"""
          # unindent new to match file style (2 spaces)
          new = """const WEBHOOK_CANDIDATES = [
            // Nom court pour secret GitHub (limite UI) ; ancien nom gardé en fallback
            ['UR_WEBHOOK', process.env.UR_WEBHOOK],
            ['USER_ROLLOUT_WEBHOOK_URL', process.env.USER_ROLLOUT_WEBHOOK_URL],
            ['APEX_WEBHOOK_URL', process.env.APEX_WEBHOOK_URL],
            ['ROLLOUT_WEBHOOK_URL', process.env.ROLLOUT_WEBHOOK_URL],
            ['DISCORD_WEBHOOK_URL', process.env.DISCORD_WEBHOOK_URL],
          ];""".replace('\n            ', '\n  ').replace('[\n  //', '[\n  //')
          new = """const WEBHOOK_CANDIDATES = [
            // Nom court pour secret GitHub (limite UI) ; ancien nom gardé en fallback
            ['UR_WEBHOOK', process.env.UR_WEBHOOK],
            ['USER_ROLLOUT_WEBHOOK_URL', process.env.USER_ROLLOUT_WEBHOOK_URL],
            ['APEX_WEBHOOK_URL', process.env.APEX_WEBHOOK_URL],
            ['ROLLOUT_WEBHOOK_URL', process.env.ROLLOUT_WEBHOOK_URL],
            ['DISCORD_WEBHOOK_URL', process.env.DISCORD_WEBHOOK_URL],
          ];"""
          # build with 2-space indent properly
          new = (
              "const WEBHOOK_CANDIDATES = [\n"
              "  // Nom court pour secret GitHub (limite UI) ; ancien nom garde en fallback\n"
              "  ['UR_WEBHOOK', process.env.UR_WEBHOOK],\n"
              "  ['USER_ROLLOUT_WEBHOOK_URL', process.env.USER_ROLLOUT_WEBHOOK_URL],\n"
              "  ['APEX_WEBHOOK_URL', process.env.APEX_WEBHOOK_URL],\n"
              "  ['ROLLOUT_WEBHOOK_URL', process.env.ROLLOUT_WEBHOOK_URL],\n"
              "  ['DISCORD_WEBHOOK_URL', process.env.DISCORD_WEBHOOK_URL],\n"
              "];"
          )
          js2 = js[:m.start()] + new + js[m.end():]
          js2 = js2.replace(
              'la première var définie gagne (USER_ROLLOUT_WEBHOOK_URL',
              'la première var définie gagne (UR_WEBHOOK',
              1,
          )
          js2 = js2.replace(
              'USER_ROLLOUT_WEBHOOK_URL | APEX_WEBHOOK_URL | ROLLOUT_WEBHOOK_URL | DISCORD_WEBHOOK_URL',
              'UR_WEBHOOK | USER_ROLLOUT_WEBHOOK_URL | APEX_WEBHOOK_URL | ROLLOUT_WEBHOOK_URL | DISCORD_WEBHOOK_URL',
              1,
          )
          js2 = js2.replace(
              '// Ordre : salon dédié (USER_ROLLOUT_WEBHOOK_URL) → APEX → ROLLOUT → DISCORD.',
              '// Ordre : salon dédié (UR_WEBHOOK) → USER_ROLLOUT_WEBHOOK_URL → APEX → ROLLOUT → DISCORD.',
              1,
          )
          p.write_text(js2)
          print('restored size', p.stat().st_size)
          assert b'UR_WEBHOOK' in p.read_bytes()
          PY
          node --check src/user_rollouts.js
          echo "syntax OK"

      - name: Commit restore
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/user_rollouts.js
          git commit -m "fix: restore user_rollouts.js + short secret UR_WEBHOOK" || echo "no change"
          git push

      - name: Remove this one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/restore-ur-webhook.yml
          git add -A .github/workflows/restore-ur-webhook.yml
          git commit -m "chore: remove one-shot restore-ur-webhook workflow" || true
          git push || true
