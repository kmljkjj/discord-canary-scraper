name: User Rollouts %
on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-user-rollouts, trigger-apex-rollouts]
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: user-rollouts
  cancel-in-progress: false

jobs:
  user-rollouts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Sample user rollouts
        env:
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
          APEX_WEBHOOK_URL: ${{ secrets.APEX_WEBHOOK_URL }}
          ROLLOUT_WEBHOOK_URL: ${{ secrets.ROLLOUT_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          USER_ROLLOUT_SAMPLES: '150'
          USER_ROLLOUT_CONCURRENCY: '6'
          APEX_MIN_PCT_DELTA: '2'
          ORBIT_BOT_NAME: Datamining
          ORBIT_AVATAR_URL: https://cdn.jsdelivr.net/gh/kmljkjj/discord-canary-scraper@main/assets/datamining-avatar.svg
        run: node src/user_rollouts.js

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/user_rollouts.json || true
          git commit -m "data: user rollouts sample $(date -u +%Y-%m-%dT%H%MZ)" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true
