name: User Rollouts %

on:
  # Schedule remplacé par rollouts-watch.yml : passes de mesure pendant
  # ~19 min toutes les 20 min (fenêtre glissante, % binomial k/n).
  # Ce workflow reste disponible en manuel / dispatch (le cog, apex…).
  # schedule:
  #   - cron: "*/2 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-user-rollouts, trigger-apex-rollouts]

permissions:
  contents: write

concurrency:
  group: user-rollouts
  cancel-in-progress: false

jobs:
  user-rollouts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # Setup = Node 22 + cache npm + npm ci --omit=dev (les deps runtime)
      # Inutile de refaire un npm ci complet ici : plus rapide à chaque run.
      - uses: ./.github/actions/setup

      - name: Unit tests (rollout math)
        run: node --test test/rollout_math.test.js

      - name: Sample user rollouts
        id: rollouts
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_USER_TOKENS: ${{ secrets.DISCORD_USER_TOKENS }}
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
          DISCORD_USER_TOKEN_1: ${{ secrets.DISCORD_USER_TOKEN_1 }}
          DISCORD_USER_TOKEN_2: ${{ secrets.DISCORD_USER_TOKEN_2 }}
          DISCORD_USER_TOKEN_3: ${{ secrets.DISCORD_USER_TOKEN_3 }}
          DISCORD_USER_TOKEN_4: ${{ secrets.DISCORD_USER_TOKEN_4 }}
          DISCORD_USER_TOKEN_5: ${{ secrets.DISCORD_USER_TOKEN_5 }}
          DISCORD_USER_TOKEN_6: ${{ secrets.DISCORD_USER_TOKEN_6 }}
          DISCORD_USER_TOKEN_7: ${{ secrets.DISCORD_USER_TOKEN_7 }}
          DISCORD_USER_TOKEN_8: ${{ secrets.DISCORD_USER_TOKEN_8 }}
          DISCORD_USER_TOKEN_9: ${{ secrets.DISCORD_USER_TOKEN_9 }}
          DISCORD_USER_TOKEN_10: ${{ secrets.DISCORD_USER_TOKEN_10 }}
          UR_WEBHOOK: ${{ secrets.UR_WEBHOOK }}
          USER_ROLLOUT_WEBHOOK_URL: ${{ secrets.USER_ROLLOUT_WEBHOOK_URL }}
          APEX_WEBHOOK_URL: ${{ secrets.APEX_WEBHOOK_URL }}
          ROLLOUT_WEBHOOK_URL: ${{ secrets.ROLLOUT_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # V13 mesure propre : 150 échantillons par passe, chaque passe
          # enrichit la fenêtre glissante (4 h) → n cumulé vers plusieurs
          # milliers, % binomial k/n à 2 décimales.
          USER_ROLLOUT_SAMPLES: "150"
          USER_ROLLOUT_CONCURRENCY: "2"
          USER_ROLLOUT_DELAY_MS: "150"
          USER_ROLLOUT_MIN_OK: "30"
          USER_ROLLOUT_MAX_MS: "75000"
          USER_ROLLOUT_PLATEAU: "30"
          USER_ROLLOUT_WINDOW_H: "4"
          USER_ROLLOUT_NOTIFY_HASH: "0"
          APEX_MIN_PCT_DELTA: "1"
          ORBIT_BOT_NAME: Datamining
          ORBIT_AVATAR_URL: ${{ vars.ORBIT_AVATAR_URL || format('https://cdn.jsdelivr.net/gh/{0}@main/media/datamining-avatar.png', github.repository) }}
        run: node src/user_rollouts.js

      - name: Commit state
        if: always() && steps.rollouts.outcome != 'cancelled'
        run: |
          scripts/commit-state.sh "data: user rollouts" data/user_rollouts.json

      - name: Fail if rollouts failed
        if: always() && steps.rollouts.outcome == 'failure'
        run: exit 1

