name: User Rollouts %
on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-user-rollouts, trigger-apex-rollouts]
  schedule:
    - cron: '*/20 * * * *'

concurrency:
  group: user-rollouts
  cancel-in-progress: false

jobs:
  user-rollouts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package.json') }}
          restore-keys: |
            nm-${{ runner.os }}-node22-

      - name: Install
        run: |
          if [ ! -d node_modules/node-fetch ]; then
            npm install --no-audit --no-fund --no-package-lock
          fi
          rm -f package-lock.json

      - name: Sample user rollouts
        env:
          DISCORD_USER_TOKENS: ${{ secrets.DISCORD_USER_TOKENS }}
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
          DISCORD_USER_TOKEN_1: ${{ secrets.DISCORD_USER_TOKEN_1 }}
          DISCORD_USER_TOKEN_2: ${{ secrets.DISCORD_USER_TOKEN_2 }}
          DISCORD_USER_TOKEN_3: ${{ secrets.DISCORD_USER_TOKEN_3 }}
          APEX_WEBHOOK_URL: ${{ secrets.APEX_WEBHOOK_URL }}
          ROLLOUT_WEBHOOK_URL: ${{ secrets.ROLLOUT_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          USER_ROLLOUT_SAMPLES: '80'
          USER_ROLLOUT_CONCURRENCY: '2'
          USER_ROLLOUT_DELAY_MS: '300'
          USER_ROLLOUT_MIN_OK: '25'
          USER_ROLLOUT_NOTIFY_HASH: '0'
          APEX_MIN_PCT_DELTA: '3'
          ORBIT_BOT_NAME: Datamining
          ORBIT_AVATAR_URL: https://cdn.jsdelivr.net/gh/kmljkjj/discord-canary-scraper@main/assets/datamining-avatar.jpg
        run: node src/user_rollouts.js

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/user_rollouts.json || true
          git commit -m "data: user rollouts sample $(date -u +%Y-%m-%dT%H%MZ)" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true
