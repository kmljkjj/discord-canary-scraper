name: Heal User Rollouts
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch user_rollouts v8
        run: |
          set -euo pipefail
          python3 scripts/patch_user_rollouts_v8.py
          node --check src/user_rollouts.js
          node --check src/lib/rollout_math.js
          node test/rollout_math.test.js
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/user_rollouts.js
          if git diff --staged --quiet; then echo nothing; exit 0; fi
          git commit -m "feat(user_rollouts): v8 wire rollout_math, 1% delta, history, redacted errors"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
