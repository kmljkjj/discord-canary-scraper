name: Heal User Rollouts
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 30
      - name: Restore base then apply v7 interval-union
        run: |
          set -euo pipefail
          # Restore last known good transactional file
          git show 4d74711535486560f16e9606f07bbc83eec70fa8:src/user_rollouts.js > src/user_rollouts.js
          test -s src/user_rollouts.js
          python3 scripts/patch_user_rollouts_v7.py
          node --check src/user_rollouts.js
          grep -n "mergeIntervals\|NOTIFY_FAIL\|status: 'estimated'\|pointsToIntervals" src/user_rollouts.js | head -25
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/user_rollouts.js
          if git diff --staged --quiet; then echo nothing; exit 0; fi
          git commit -m "feat(user_rollouts): v7 interval-union estimates (keep transactional announced)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
