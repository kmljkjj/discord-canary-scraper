name: Wire Experiment State
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          set -euo pipefail
          python3 scripts/wire_experiment_state.py
          node --check src/index.js
          node --check src/lib/experiment_state.js
          test -f src/lib/experiment_state.js
          grep -q experiment_state src/index.js
          grep -q 'EXP_STATE written' src/index.js
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          if git diff --staged --quiet; then echo nothing; exit 0; fi
          git commit -m "refactor(experiments): wire current/known/removed state + fingerprint mods"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
