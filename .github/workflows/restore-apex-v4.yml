name: Restore apex v4
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apex_restore/**'
      - '.github/workflows/restore-apex-v4.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and restore apex_rollouts.js
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          parts = sorted(Path('scripts/apex_restore').glob('part*.b64'))
          assert parts, 'no parts'
          b64 = ''.join(p.read_text().strip() for p in parts)
          data = gzip.decompress(base64.b64decode(b64))
          Path('src/apex_rollouts.js').write_bytes(data)
          print('restored', len(data), 'bytes')
          PY
          node --check src/apex_rollouts.js
          head -3 src/apex_rollouts.js
          grep -n "Apex rollouts v4\|Variant \|formatFilters\|humanizeId" src/apex_rollouts.js | head
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/apex_rollouts.js
          git commit -m "fix: restore apex_rollouts.js v4 (live % + filters)" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
