name: Restore apex v4
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-apex-v4.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore apex_rollouts.js
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/kmljkjj/discord-canary-scraper/477463ae84eab403851c898cc6cf4422d2ae03b2/src/apex_rollouts.js" -o src/apex_rollouts.js
          # Avatar Datamining
          sed -i 's|https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/72x72/1f4ca.png|https://cdn.jsdelivr.net/gh/kmljkjj/discord-canary-scraper@main/assets/datamining-avatar.svg|g' src/apex_rollouts.js
          # Soften: notify discord/advaith % changes even if id not year-tagged recent
          sed -i "s|if (!n.recent && !p.recent && maxAbs < 5) continue;|if (!n.recent \&\& !p.recent \&\& n.source !== 'discord' \&\& n.source !== 'advaith' \&\& maxAbs < 5) continue;|g" src/apex_rollouts.js
          # Version banner
          sed -i 's|Apex rollouts v3 — live Discord + advaith (2024/2025/2026 %)|Apex rollouts v3.1 — Discord live % (restored)|g' src/apex_rollouts.js
          # Expand hash map: also last_extract_experiments.json
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/apex_rollouts.js')
          t = p.read_text()
          needle = """  try {
    if (await fs.pathExists(KNOWN_EXP)) {
      const data = await fs.readJson(KNOWN_EXP);
      const list = Array.isArray(data) ? data : data.ids || data.experiments || [];
      for (const x of list) addId(typeof x === 'string' ? x : x && x.id ? String(x.id) : null);
    }
  } catch (e) {
    console.warn('Hash map known:', e.message);
  }
  console.log('Hash map:', map.size / 2, 'ids');"""
          insert = """  try {
    if (await fs.pathExists(KNOWN_EXP)) {
      const data = await fs.readJson(KNOWN_EXP);
      const list = Array.isArray(data) ? data : data.ids || data.experiments || [];
      for (const x of list) addId(typeof x === 'string' ? x : x && x.id ? String(x.id) : null);
    }
  } catch (e) {
    console.warn('Hash map known:', e.message);
  }
  try {
    const lastExp = path.join(DATA_DIR, 'last_extract_experiments.json');
    if (await fs.pathExists(lastExp)) {
      const data = await fs.readJson(lastExp);
      const obj = data.data || data.experiments || data;
      if (obj && typeof obj === 'object' && !Array.isArray(obj)) {
        for (const k of Object.keys(obj)) addId(k);
      } else if (Array.isArray(obj)) {
        for (const x of obj) addId(typeof x === 'string' ? x : x && x.id ? String(x.id) : null);
      }
    }
  } catch (e) {
    console.warn('Hash map last_extract:', e.message);
  }
  console.log('Hash map:', map.size / 2, 'ids');"""
          if needle not in t:
              raise SystemExit('hash map needle missing')
          p.write_text(t.replace(needle, insert, 1))
          print('hash map expanded')
          PY
          wc -c src/apex_rollouts.js
          node --check src/apex_rollouts.js
          head -3 src/apex_rollouts.js
          # must not be placeholder
          if grep -q RESTORED_FROM_LOCAL src/apex_rollouts.js; then
            echo 'still placeholder' >&2
            exit 1
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/apex_rollouts.js
          git commit -m "fix: restore apex_rollouts.js (was RESTORED_FROM_LOCAL placeholder)" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
