name: Restore apex v4
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-apex-v4.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore apex_rollouts.js
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/kmljkjj/discord-canary-scraper/477463ae84eab403851c898cc6cf4422d2ae03b2/src/apex_rollouts.js" -o src/apex_rollouts.js
          wc -c src/apex_rollouts.js
          head -5 src/apex_rollouts.js
          node --check src/apex_rollouts.js
          grep -q RESTORED_FROM_LOCAL src/apex_rollouts.js && exit 1 || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/apex_rollouts.js
          git status
          git commit -m "fix: restore apex_rollouts.js from 477463ae" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
