name: Restore apex v4
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-apex-v4.yml'
      - 'scripts/patch_apex_v4.py'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore + patch apex_rollouts.js
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/kmljkjj/discord-canary-scraper/477463ae84eab403851c898cc6cf4422d2ae03b2/src/apex_rollouts.js" -o src/apex_rollouts.js
          wc -c src/apex_rollouts.js
          python3 scripts/patch_apex_v4.py
          node --check src/apex_rollouts.js
          head -3 src/apex_rollouts.js
          grep -n "Apex rollouts v4\|formatFilters\|humanizeId\|Variant " src/apex_rollouts.js | head
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/apex_rollouts.js
          git commit -m "fix: restore apex_rollouts.js v4 (live % + filters)" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
