name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync experiments into docs
        run: |
          mkdir -p docs/data
          if [ -f data/experiments.json ]; then
            cp data/experiments.json docs/data/experiments.json
            cp data/experiments.json docs/data/findings.json
            echo "Synced experiments.json"
          elif [ -f data/findings.json ]; then
            cp data/findings.json docs/data/findings.json
            cp data/findings.json docs/data/experiments.json
            echo "Synced findings.json"
          else
            echo '{"experiments":[],"scrapedAt":null}' > docs/data/experiments.json
            cp docs/data/experiments.json docs/data/findings.json
            echo "Placeholder experiments.json"
          fi
          [ -f data/routes.json ] && cp data/routes.json docs/data/routes.json || true
          [ -f data/build.json ] && cp data/build.json docs/data/build.json || true

      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Pages not enabled
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages not configured. Enable: Settings → Pages → Source: GitHub Actions"
          exit 0

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
