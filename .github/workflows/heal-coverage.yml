name: Heal Coverage Metrics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply coverage patch
        run: |
          set -euo pipefail
          python3 scripts/patch_coverage.py
          node --check src/lib/extract.js
          node --check src/index.js
          grep -n "coverage\|WEB_BUNDLE_NOT_FOUND\|EXTRACTION_COVERAGE" src/lib/extract.js src/index.js | head -40
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/extract.js src/index.js
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "fix: chunk coverage metrics + EXTRACTION_COVERAGE_DEGRADED (no silent web.* fallback)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
