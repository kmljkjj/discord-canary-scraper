name: Patch no build notify
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_no_build_notify.py'
      - '.github/workflows/patch-no-build-notify.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          set -euo pipefail
          python3 scripts/patch_no_build_notify.py
          node --check src/index.js
          node --check src/lib/notify.js
          head -3 src/index.js
          grep -n "no flash webhook\|isNewBuild: false\|Build/catalog webhook disabled\|v11.4" src/index.js src/lib/notify.js || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.js src/lib/notify.js
          git commit -m "feat: no build webhooks — experiments, strings, routes only (v11.4)" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
