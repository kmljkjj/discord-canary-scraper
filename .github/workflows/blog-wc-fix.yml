name: Blog WC Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch blog_tracker.js
        run: |
          set -euo pipefail
          python3 -c '
          import base64, pathlib, re
          path = pathlib.Path("src/blog_tracker.js")
          text = path.read_text()
          new = base64.b64decode("").decode()
          pat = re.compile(
              r"/\*\*\n \* Post webhook payload\.[\s\S]*?\nasync function postWebhook\(payload\) \{[\s\S]*?\n\}\n(?=\nasync function notifyAll)",
          )
          m = pat.search(text)
          if not m:
              i = text.find("async function postWebhook")
              print("FAIL", i)
              print(repr(text[max(0,i-100):i+350]))
              raise SystemExit(1)
          text2 = text[: m.start()] + new.rstrip() + "\n" + text[m.end() :]
          path.write_text(text2)
          assert "webhookUrlWithComponents" in path.read_text()
          print("patched ok", len(text2))
          '
          node --check src/blog_tracker.js
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/blog_tracker.js
          git diff --cached --stat
          git commit -m "fix(blog): require ?with_components=true for Components V2 webhooks"
          git push
