name: Generate package-lock
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore apex from last good commit + transactional patch
        run: |
          set -euo pipefail
          # Find last good apex_rollouts.js
          GOOD=""
          for c in $(git log --pretty=format:%H -30 -- src/apex_rollouts.js); do
            sz=$(git show "$c:src/apex_rollouts.js" 2>/dev/null | wc -c || echo 0)
            if [ "$sz" -gt 10000 ]; then
              GOOD=$c
              break
            fi
          done
          echo "GOOD apex=$GOOD size=$(git show $GOOD:src/apex_rollouts.js | wc -c)"
          test -n "$GOOD"
          git show "$GOOD:src/apex_rollouts.js" > src/apex_rollouts.js
          python3 << 'PY'
          from pathlib import Path
          src = Path('src/apex_rollouts.js').read_text()
          assert len(src) > 10000

          old_prev = """  const announced =
    previous.announced && typeof previous.announced === 'object' ? { ...previous.announced } : {};
  const prev = previous.experiments || [];
  const isFirst = !prev.length;

  let diff = diffExperiments(prev, experiments);
"""
          new_prev = """  const announced =
    previous.announced && typeof previous.announced === 'object' ? { ...previous.announced } : {};
  const prev = previous.experiments || [];
  const isFirst = !prev.length;

  if (!isFirst && prev.length >= 20 && experiments.length < Math.max(5, prev.length * 0.4)) {
    console.error('APEX_DEGRADED: collection too small vs previous', {
      prev: prev.length,
      now: experiments.length,
    });
    process.exit(1);
  }

  let diff = diffExperiments(prev, experiments);
"""
          if old_prev not in src:
              print('WARN: prev block miss - trying alternate')
          else:
              src = src.replace(old_prev, new_prev)
              print('degraded guard applied')

          # Find the announced-for-all-compact loop and rewrite tail
          marker = '  for (const e of compact) {\n    if (e.id && e.fingerprint) announced[e.id] = e.fingerprint;\n  }'
          idx = src.find(marker)
          if idx < 0:
              raise SystemExit('compact announced loop not found')
          end = src.find('if (require.main === module)', idx)
          if end < 0:
              raise SystemExit('module end not found')
          new_tail = '''  async function writeState(announcedMap) {
    await fs.writeJson(
      STATE_FILE,
      {
        scrapedAt: new Date().toISOString(),
        count: compact.length,
        experiments: compact,
        announced: announcedMap,
      },
      { spaces: 2 },
    );
  }

  if (isFirst) {
    const seedAnn = { ...announced };
    for (const e of compact) {
      if (e.id && e.fingerprint) seedAnn[e.id] = e.fingerprint;
    }
    await writeState(seedAnn);
    console.log('Seed', compact.length, '- no notify');
    return;
  }

  if (!(diff.added.length || diff.changed.length || diff.removed.length)) {
    await writeState(announced);
    console.log('No significant % change');
    return;
  }

  if (!WEBHOOK) {
    await writeState(announced);
    console.warn('No webhook - state saved without advancing announced');
    return;
  }

  const embeds = buildEmbeds(diff);
  const sent = await postWebhook(embeds);
  console.log('Webhook', sent.status, sent.ok ? 'OK' : sent.text);
  if (sent.ok) {
    const nextAnn = { ...announced };
    for (const e of diff.added) if (e && e.id) nextAnn[e.id] = pctKey(e);
    for (const c of diff.changed) if (c.after && c.after.id) nextAnn[c.after.id] = pctKey(c.after);
    for (const e of diff.removed) if (e && e.id) nextAnn[e.id] = 'REMOVED';
    for (const e of compact) {
      if (e.id && e.fingerprint && nextAnn[e.id] !== 'REMOVED') {
        if (!(e.id in nextAnn) || nextAnn[e.id] === e.fingerprint) nextAnn[e.id] = e.fingerprint;
      }
    }
    await writeState(nextAnn);
    console.log('Done - announced advanced after successful webhook');
  } else {
    await writeState(announced);
    console.warn('Webhook failed - announced NOT advanced (will retry next run)');
    process.exit(2);
  }
}

'''
          src = src[:idx] + new_tail + src[end:]
          Path('src/apex_rollouts.js').write_text(src)
          print('apex bytes', len(src))
          assert 'APEX_DEGRADED' in src or 'announced NOT advanced' in src
          PY
          node --check src/apex_rollouts.js
          # ensure index still good
          test $(wc -c < src/index.js) -gt 15000
          head -3 src/index.js
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f src/apex_rollouts.js
          git status
          git commit -m "fix: apex transactional announced + APEX_DEGRADED guard"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
