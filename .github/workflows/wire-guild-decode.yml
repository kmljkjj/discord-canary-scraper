name: Wire guild decode
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/lib/guild_decode.js'
      - 'scripts/patch_apex_decode.py'
      - '.github/workflows/wire-guild-decode.yml'
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wire apex
        run: |
          set -euo pipefail
          test -f src/lib/guild_decode.js
          node --check src/lib/guild_decode.js
          python3 scripts/patch_apex_decode.py
          node --check src/apex_rollouts.js
          head -5 src/apex_rollouts.js
          grep -n guild_decode src/apex_rollouts.js | head
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/apex_rollouts.js src/lib/guild_decode.js
          git commit -m "feat: wire structured guild_decode into apex rollouts v3.2" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
