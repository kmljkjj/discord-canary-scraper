name: Restore Notify Fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Decode and restore source files
        run: |
          set -euo pipefail
          restore() {
            local name="$1"
            local dest="$2"
            local n="$3"
            local tmp=$(mktemp)
            for i in $(seq 0 $((n-1))); do
              cat ".github/payloads/${name}.b64.${i}" >> "$tmp"
            done
            base64 -d "$tmp" > "$dest"
            echo "restored $dest ($(wc -c < "$dest") bytes)"
            head -c 40 "$dest"; echo
            node --check "$dest"
          }
          restore components_v2.js src/lib/components_v2.js 3
          restore notify.js src/lib/notify.js 3
          restore index.js src/index.js 6
      - name: Commit restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/components_v2.js src/lib/notify.js src/index.js
          git status
          git commit -m "fix: restore notify/components/index — V2 4000 limit + partial state advance" || exit 0
          git push
