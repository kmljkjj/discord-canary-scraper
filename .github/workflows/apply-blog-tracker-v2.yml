name: Apply Blog Tracker V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble blog_tracker.js from parts
        run: |
          set -euo pipefail
          python3 -c "
          import base64, zlib, pathlib
          parts = [pathlib.Path(f'.github/payloads/blog_v2_{i}.b64').read_text().strip() for i in range(3)]
          data = zlib.decompress(base64.b64decode(''.join(parts)))
          pathlib.Path('src/blog_tracker.js').write_bytes(data)
          text = data.decode()
          assert 'buildBlogMessageV2' in text
          assert 'IS_COMPONENTS_V2' in text
          print('wrote', len(data), 'ok')
          "
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/blog_tracker.js
          git status
          git commit -m "blog: Components V2 — image top, linked title, short excerpt, no emoji"
          git push
