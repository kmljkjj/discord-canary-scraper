name: Apply Blog Tracker V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and write blog_tracker.js
        run: |
          set -euo pipefail
          python3 << 'EOF'
          import base64, zlib, pathlib
          parts = [
          "PLACEHOLDER0",
          "PLACEHOLDER1",
          "PLACEHOLDER2",
          ]
          raw = base64.b64decode("".join(parts))
          data = zlib.decompress(raw)
          path = pathlib.Path("src/blog_tracker.js")
          path.write_bytes(data)
          print("wrote", path, "bytes", len(data))
          text = data.decode()
          assert "buildBlogMessageV2" in text
          assert "IS_COMPONENTS_V2" in text
          assert "module.exports" in text
          print("sanity ok")
          EOF
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/blog_tracker.js
          git diff --cached --stat
          git commit -m "blog: Components V2 — image top, linked title, short excerpt, no emoji"
          git push
