name: Security Priority Fixes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Decode payloads into source files
        run: |
          set -euo pipefail
          decode() {
            local stem="$1"
            local dest="$2"
            cat .github/payloads/${stem}.b64.* > /tmp/${stem}.b64
            base64 -d /tmp/${stem}.b64 > "$dest"
            echo "wrote $dest ($(wc -c < "$dest") bytes)"
          }
          decode sec_webhook.js src/lib/webhook.js
          decode sec_webhook_dedupe.js src/lib/webhook_dedupe.js
          decode sec_rollouts.js docs/rollouts.js
          decode sec_mobile.js docs/mobile.js
          decode sec_status.js docs/status.js
          node --check src/lib/webhook.js
          node --check src/lib/webhook_dedupe.js
      - name: Smoke tests
        run: |
          set -euo pipefail
          node -e '
            const { maskWebhook, sanitizeLogText } = require("./src/lib/webhook");
            const url = "https://discord.com/api/webhooks/123/SECRETTOKEN_ABCDEFGHIJKLMNOP";
            const err = "request to " + url + " failed, reason: connect ECONNREFUSED";
            const s = sanitizeLogText(err, url);
            if (s.includes("SECRETTOKEN")) { console.error("LEAK", s); process.exit(1); }
            console.log("mask smoke OK", maskWebhook(url));
          '
          node -e '
            const fs = require("fs");
            const path = require("path");
            const os = require("os");
            const dir = fs.mkdtempSync(path.join(os.tmpdir(), "dedupe-"));
            process.env.NOTIFY_DEDUPE_FILE = path.join(dir, "d.json");
            const { claimPosted } = require("./src/lib/webhook_dedupe");
            (async () => {
              const results = await Promise.all(Array.from({ length: 30 }, (_, i) => claimPosted("fp" + i)));
              const d = JSON.parse(fs.readFileSync(process.env.NOTIFY_DEDUPE_FILE, "utf8"));
              const n = Object.keys(d.fps || {}).length;
              console.log("claims", results.filter(Boolean).length, "fps", n);
              if (n < 30) process.exit(1);
              console.log("dedupe concurrent smoke OK");
            })().catch((e) => { console.error(e); process.exit(1); });
          '
      - name: Remove obsolete restore/apply workflows
        run: |
          for f in \
            .github/workflows/emergency-restore.yml \
            .github/workflows/restore-notify-fix.yml \
            .github/workflows/apply-blog-wc-main.yml \
            .github/workflows/apply-blog-wc-patch.yml \
            .github/workflows/blog-wc-fix.yml
          do
            [ -f "$f" ] && git rm -f "$f" && echo removed $f || true
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/webhook.js src/lib/webhook_dedupe.js docs/rollouts.js docs/mobile.js docs/status.js
          git add -u .github/workflows || true
          git status
          git commit -m "security: mask webhook secrets, HTML escape docs, lock dedupe; remove obsolete restore workflows" || exit 0
          git push
