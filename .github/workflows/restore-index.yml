name: Restore index.js
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/restore_index_v11_2.py'
      - 'scripts/index_v11_2.gz.b64.a'
      - 'scripts/index_v11_2.gz.b64.b'
      - '.github/workflows/restore-index.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Decode index.js
        run: |
          python3 scripts/restore_index_v11_2.py
          node --check src/index.js
          head -3 src/index.js
      - name: Commit restored index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          if git diff --staged --quiet; then
            echo "index already correct"
            exit 0
          fi
          git commit -m "fix: restore Canary Pulse v11.2 index.js (anti-double)"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
