name: Apply User Rollouts v10
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Write user_rollouts.js
        run: |
          python3 scripts/apply_user_rollouts_v10.py
          node --check src/user_rollouts.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/user_rollouts.js
          git commit -m "feat(user-rollouts): v10 filter-aware percentages + embed segments" || echo nothing
          git pull --rebase origin main || true
          git push origin HEAD:main
