name: Restore index simple

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 40

      - name: Find and restore good index.js
        run: |
          set -e
          GOOD=""
          for c in $(git log --pretty=format:%H -40 -- src/index.js); do
            sz=$(git show "$c:src/index.js" 2>/dev/null | wc -c || echo 0)
            hd=$(git show "$c:src/index.js" 2>/dev/null | head -c 80 || true)
            echo "check $c size=$sz"
            if [ "$sz" -gt 15000 ] && echo "$hd" | grep -q Canary; then
              GOOD=$c
              break
            fi
          done
          echo "GOOD=$GOOD"
          if [ -z "$GOOD" ]; then
            echo "No good commit found"
            exit 1
          fi
          git show "$GOOD:src/index.js" > src/index.js
          wc -c src/index.js
          head -5 src/index.js
          node --check src/index.js

      - name: Apply transactional notify gates
        run: |
          python3 -c '
          from pathlib import Path
          t = Path("src/index.js").read_text()
          t = t.replace("=== Canary Pulse v11.7 ===", "=== Canary Pulse v11.8 ===")
          old = """      if (isNewBuild && !alreadyBuild) {
        await markBuild(build.buildNumber);
        alreadyBuild = true;
        console.log("BUILD marked after successful extract", build.buildNumber);
      }"""
          new = """      if (isNewBuild && !alreadyBuild && okN) {
        await markBuild(build.buildNumber);
        alreadyBuild = true;
        console.log("BUILD marked after successful notifies", build.buildNumber);
      } else if (isNewBuild && !alreadyBuild && !okN) {
        console.warn("BUILD NOT marked - webhook failed");
      }"""
          if old in t:
              t = t.replace(old, new, 1)
              print("markBuild gated")
          else:
              print("markBuild miss")
          old2 = """  await Promise.all([
    saveKnownIds(KNOWN_EXP, knownExp, 8000),
    saveKnownIds(KNOWN_STR, knownStr, 50000),
    saveKnownIds(KNOWN_RT, knownRt, 10000),
    saveLastMap(LAST_EXTRACT_STR, extractedStrings, build.buildNumber),
    saveLastMap(LAST_EXTRACT_RT, nextRt, build.buildNumber),
    saveLastMap(LAST_EXTRACT_EXP, nextExpSnap, build.buildNumber),
  ]);"""
          new2 = """  const strRtOk = typeof okN === "undefined" ? true : okN;
  const tasks = [
    saveKnownIds(KNOWN_EXP, knownExp, 8000),
    saveKnownIds(KNOWN_STR, knownStr, 50000),
    saveKnownIds(KNOWN_RT, knownRt, 10000),
    saveLastMap(LAST_EXTRACT_EXP, nextExpSnap, build.buildNumber),
  ];
  if (strRtOk) {
    tasks.push(saveLastMap(LAST_EXTRACT_STR, extractedStrings, build.buildNumber));
    tasks.push(saveLastMap(LAST_EXTRACT_RT, nextRt, build.buildNumber));
  } else {
    console.warn("SKIP last_extract str/rt - notify failed");
  }
  await Promise.all(tasks);"""
          if old2 in t:
              t = t.replace(old2, new2)
              print("last_extract gated")
          else:
              print("save miss")
          if "const okN = await notifyNormal" in t:
              t = t.replace("const okN = await notifyNormal", "okN = await notifyNormal", 1)
              t = t.replace(
                  "if (process.env.DISCORD_WEBHOOK_URL) {\n    try {",
                  "let okN = true;\n  if (process.env.DISCORD_WEBHOOK_URL) {\n    try {",
                  1,
              )
              print("okN hoisted")
          Path("src/index.js").write_text(t)
          print("bytes", len(t))
          '
          node --check src/index.js
          grep -n "successful notifies\|SKIP last_extract\|BUILD NOT marked\|strRtOk" src/index.js || true

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git status
          git commit -m "fix: transactional notify gates (markBuild + last_extract)" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true
