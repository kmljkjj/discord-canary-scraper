name: Patch Strings FR
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: python3 scripts/patch_strings_fr.py
      - run: node --check src/lib/notify.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/notify.js scripts/patch_strings_fr.py
          git commit -m "fix: Strings notifs en Ajoute/Modifie/Supprime + phrase seule" || exit 0
          git pull --rebase origin main || git pull --rebase --autostash origin main
          git push
