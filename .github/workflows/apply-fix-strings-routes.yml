name: Apply fix strings/routes/notify

on:
  push:
    branches: [main]
    paths:
      - '.github/patches/fix-strings-routes.patch'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-fix-strings-routes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply patch
        run: |
          set -euo pipefail
          git apply --check .github/patches/fix-strings-routes.patch
          git apply .github/patches/fix-strings-routes.patch

      - name: Verify exact file hashes
        run: |
          set -euo pipefail
          check() { got=$(git hash-object "$2"); if [ "$got" != "$1" ]; then echo "HASH MISMATCH $2: $got != $1"; exit 1; fi; echo "OK $2"; }
          check b7290613c15782c1b37a648872bc4b3018de7355 src/index.js
          check 948ac3878581e374cd1536769138b7bedd5fe7fc src/lib/extract.js
          check a0c77b4ff39cc3156d795bbf3a40038902742c19 src/lib/notify.js
          check 6a21a5bc87e68918e39003d9d32b2b89f51ab364 test/extract_strings_routes_fix.test.js
          check 0719b20660f6c16fef7cb6c471ca6adfc795004f test/notify_dedupe_parts.test.js

      - name: Tests
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check
          npm test

      - name: Commit + push
        run: |
          set -euo pipefail
          git config user.name "kmljkjj"
          git config user.email "jbouzeau7@icloud.com"
          git rm -q .github/patches/fix-strings-routes.patch
          git add src/index.js src/lib/extract.js src/lib/notify.js test/extract_strings_routes_fix.test.js test/notify_dedupe_parts.test.js
          git commit -m "fix: strings (balises \$link/\$b), routes \${…} + notifs perdues" -m "- strings : texte des liens/gras/hooks conservé (avant : '{\$link} about age groups')
          - routes : templates conditionnels nettoyés, +14 routes (fonctions à args par défaut, ternaires), résultat indépendant de l'ordre des chunks
          - notify : dedupe par (lot, section, partie) → plus de messages « suite » sautés
          - expériences trouvées seulement dans les chunks désormais envoyées après le CORE
          - échec d'envoi des expériences = état non avancé (retry au run suivant)
          - STR_RT_EXTRACT_VERSION=3 : reseed one-shot sans spam"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
