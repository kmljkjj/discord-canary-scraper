name: Assemble Datamining avatar
on:
  workflow_dispatch:
jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Note
        run: |
          echo "Use manual asset upload or set ORBIT_AVATAR_URL secret to image URL"
          echo "Preferred: GitHub repo Settings → Secrets → ORBIT_AVATAR_URL"
