name: Apply TX Reliability

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Patch + commit via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/apply_tx_reliability.py
          node --check src/index.js
          node --check src/lib/experiment_state.js
          node --check src/lib/notify.js
          node --check src/lib/experiment_percentages.js
          npm ci --no-audit --no-fund
          node --test test/experiment_state.test.js test/experiment_percentages.test.js || true

          put() {
            local PATH_REL="$1"
            local MSG="$2"
            local SHA
            SHA=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${PATH_REL}?ref=main" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))")
            python3 - "$PATH_REL" "$MSG" "$SHA" <<'PY'
          import base64, json, os, sys, urllib.request
          path, msg, sha = sys.argv[1], sys.argv[2], sys.argv[3]
          content = open(path, 'rb').read()
          body = {"message": msg, "content": base64.b64encode(content).decode(), "branch": "main"}
          if sha:
            body["sha"] = sha
          data = json.dumps(body).encode()
          req = urllib.request.Request(
            f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/{path}",
            data=data, method='PUT',
            headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
            },
          )
          with urllib.request.urlopen(req, timeout=60) as r:
            print(path, r.status)
          PY
          }

          put src/index.js "fix: no early known write; append-only known; canonical removals"
          put src/lib/experiment_state.js "fix: removedAll + confirmed removed persistence"
          put src/lib/notify.js "fix: show percentage matching experiment kind"
