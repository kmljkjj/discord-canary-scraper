name: Fix Urgent Core

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Patch + put via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if grep -q 'SEE_FILE' src/index.js; then
            git checkout 7987da3b32a7 -- src/index.js || true
          fi
          python3 scripts/fix_urgent_core.py
          node --check src/index.js
          export SHA=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/src/index.js?ref=main" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['sha'])")
          python3 scripts/put_index_api.py
