name: X Watch DiscordNEW8r

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package.json') }}
          restore-keys: |
            nm-${{ runner.os }}-node22-

      - name: Install deps
        run: |
          if [ ! -d node_modules/node-fetch ]; then
            npm install --no-audit --no-fund --no-package-lock
          fi
          rm -f package-lock.json

      - name: Watch @DiscordNEW8r
        env:
          # Accept either secret name
          X_WEBHOOK_URL: ${{ secrets.X_WEBHOOK_URL || secrets.X_NEWS_WEBHOOK_URL }}
          X_NEWS_WEBHOOK_URL: ${{ secrets.X_NEWS_WEBHOOK_URL || secrets.X_WEBHOOK_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_USERNAME: DiscordNEW8r
          X_USER_ID: '2073982489836584960'
        # Public X sources often fail — never red the workflow
        continue-on-error: true
        run: node src/x_watch.js

      - name: Save seen ids
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f package-lock.json
          git add -f data/x_seen_ids.json data/seen_x_posts.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No seen changes"
            exit 0
          fi
          git commit -m "📌 x-watch seen $(date -u +%Y-%m-%dT%H:%MZ)" || true
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            git stash push -u -m "noise-$i" || true
            sleep 2
          done
          exit 0
