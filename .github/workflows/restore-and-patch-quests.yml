name: Restore and patch quests
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-and-patch-quests.yml'
      - 'scripts/patch_quests_layout.py'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Restore good quests.js
        run: |
          set -euo pipefail
          echo "current size $(wc -c < src/quests.js || echo 0)"
          for c in $(git log --pretty=format:%H -- src/quests.js | head -40); do
            sz=$(git cat-file -s "$c:src/quests.js" 2>/dev/null || echo 0)
            echo "try $c size=$sz"
            if [ "$sz" -gt 10000 ]; then
              git show "$c:src/quests.js" > src/quests.js
              echo "restored from $c"
              break
            fi
          done
          wc -c src/quests.js
          node --check src/quests.js
      - name: Apply layout patch
        run: |
          set -euo pipefail
          python3 scripts/patch_quests_layout.py
          node --check src/quests.js
          grep -n "videoLabel\|accent_color: 0\|0x000000\|Vidéo" src/quests.js | head -15
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/quests.js
          git commit -m "feat(quests): photo haut, une vidéo, embed noir" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
