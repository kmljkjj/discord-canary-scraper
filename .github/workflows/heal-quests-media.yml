name: Heal Quests Media
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          set -euo pipefail
          python3 scripts/patch_quests_reward_media2.py
          node --check src/quests.js
          grep -n "rewardMedia\|Aperçu récompense\|Décoration" src/quests.js | head
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/quests.js .github/workflows/quests.yml
          if git diff --staged --quiet; then echo nothing; exit 0; fi
          git commit -m "feat(quests): reward decoration images in MediaGallery"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
