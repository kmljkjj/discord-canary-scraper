name: Rollouts Watch

# Job « mesure propre » : passes d'échantillonnage anonyme de l'API Discord
# pendant ~19 min toutes les 20 min (fenêtre glissante 4 h, k/n + Wilson + bornes indicatives).
# Chaque passe enrichit la fenêtre → % à 2 décimales avec n affiché, sans
# aucune source externe (cf. src/user_rollouts.js v14).

on:
  # Cron désactivé (v2.6) : le système % user principal est désormais le gist
  # communautaire (gist-user-rollouts.yml, */30). Ce job « mesure propre »
  # reste disponible en DIAGNOSTIC MANUEL (workflow_dispatch) — il ne poste
  # plus automatiquement pour ne pas mélanger deux sémantiques de % dans
  # les mêmes webhooks.
  # schedule:
  #   - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Ne JAMAIS annuler un run en cours (sinon trou de détection entre deux jobs)
concurrency:
  group: rollouts-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Setup = Node 22 + cache npm + npm ci --omit=dev (deps runtime only)
      - uses: ./.github/actions/setup

      - name: Syntax check
        run: |
          node --check src/rollouts_watch.js
          node --check src/user_rollouts.js

      - name: Rollouts watcher (passes de mesure pendant ~19 min)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_USER_TOKENS: ${{ secrets.DISCORD_USER_TOKENS }}
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
          DISCORD_USER_TOKEN_1: ${{ secrets.DISCORD_USER_TOKEN_1 }}
          DISCORD_USER_TOKEN_2: ${{ secrets.DISCORD_USER_TOKEN_2 }}
          DISCORD_USER_TOKEN_3: ${{ secrets.DISCORD_USER_TOKEN_3 }}
          DISCORD_USER_TOKEN_4: ${{ secrets.DISCORD_USER_TOKEN_4 }}
          DISCORD_USER_TOKEN_5: ${{ secrets.DISCORD_USER_TOKEN_5 }}
          DISCORD_USER_TOKEN_6: ${{ secrets.DISCORD_USER_TOKEN_6 }}
          DISCORD_USER_TOKEN_7: ${{ secrets.DISCORD_USER_TOKEN_7 }}
          DISCORD_USER_TOKEN_8: ${{ secrets.DISCORD_USER_TOKEN_8 }}
          DISCORD_USER_TOKEN_9: ${{ secrets.DISCORD_USER_TOKEN_9 }}
          DISCORD_USER_TOKEN_10: ${{ secrets.DISCORD_USER_TOKEN_10 }}
          UR_WEBHOOK: ${{ secrets.UR_WEBHOOK }}
          USER_ROLLOUT_WEBHOOK_URL: ${{ secrets.USER_ROLLOUT_WEBHOOK_URL }}
          APEX_WEBHOOK_URL: ${{ secrets.APEX_WEBHOOK_URL }}
          ROLLOUT_WEBHOOK_URL: ${{ secrets.ROLLOUT_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APEX_MIN_PCT_DELTA: "1"
          # Sampling pour les passes périodiques : chaque passe enrichit la
          # fenêtre glissante (4 h) → n croît vers plusieurs milliers.
          # Ces valeurs sont aussi les défauts dans src/rollouts_watch.js.
          USER_ROLLOUT_SAMPLES: "120"
          USER_ROLLOUT_CONCURRENCY: "2"
          USER_ROLLOUT_DELAY_MS: "150"
          USER_ROLLOUT_MIN_OK: "30"
          USER_ROLLOUT_MAX_MS: "45000"
          USER_ROLLOUT_WINDOW_H: "4"
          USER_ROLLOUT_NOTIFY_HASH: "1"
          ORBIT_BOT_NAME: Datamining
          ORBIT_AVATAR_URL: ${{ vars.ORBIT_AVATAR_URL || format('https://cdn.jsdelivr.net/gh/{0}@main/media/datamining-avatar.png', github.repository) }}
        run: node src/rollouts_watch.js
