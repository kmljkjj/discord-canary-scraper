name: Discord Quests

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-quests]

permissions:
  contents: write

concurrency:
  group: discord-quests
  cancel-in-progress: false

jobs:
  quests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Track Discord quests
        id: quests
        env:
          QUEST_WEBHOOK_URL: ${{ secrets.QUEST_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
          DISCORD_USER_TOKEN_1: ${{ secrets.DISCORD_USER_TOKEN_1 }}
        run: node src/quests.js

      - name: Save quest state
        if: always() && steps.quests.outcome != 'cancelled'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/quests.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No quest state changes"
            exit 0
          fi
          git commit -m "quests: state"
          PUSHED=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            sleep 2
          done
          if [ "$PUSHED" -ne 1 ]; then
            echo "ERROR: could not push quests.json"
            exit 1
          fi

      - name: Fail if quests scraper failed
        if: always() && steps.quests.outcome == 'failure'
        run: |
          echo "quests step outcome=${{ steps.quests.outcome }}"
          exit 1
