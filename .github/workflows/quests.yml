name: Discord Quests

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-quests]

permissions:
  contents: write

concurrency:
  group: discord-quests
  cancel-in-progress: false

jobs:
  quests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Guard quests.js not corrupted
        run: |
          set -euo pipefail
          SZ=$(wc -c < src/quests.js)
          echo "quests.js size=$SZ"
          if [ "$SZ" -lt 15000 ] || grep -q PLACEHOLDER src/quests.js; then
            echo "FATAL: src/quests.js is corrupted on main — restore it before running"
            exit 1
          fi
          node --check src/quests.js

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Track Discord quests
        id: quests
        env:
          QUEST_WEBHOOK_URL: ${{ secrets.QUEST_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
          DISCORD_USER_TOKENS: ${{ secrets.DISCORD_USER_TOKENS }}
          DISCORD_USER_TOKEN_1: ${{ secrets.DISCORD_USER_TOKEN_1 }}
          DISCORD_USER_TOKEN_2: ${{ secrets.DISCORD_USER_TOKEN_2 }}
          DISCORD_USER_TOKEN_3: ${{ secrets.DISCORD_USER_TOKEN_3 }}
          DISCORD_USER_TOKEN_4: ${{ secrets.DISCORD_USER_TOKEN_4 }}
          DISCORD_USER_TOKEN_5: ${{ secrets.DISCORD_USER_TOKEN_5 }}
          ORBIT_BOT_NAME: Datamining
        run: node src/quests.js

      - name: Save quest state
        if: always() && steps.quests.outcome != 'cancelled'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f data/quests.json ]; then
            echo "no quests.json"
            exit 0
          fi

          python3 - << 'PY'
          import json
          from pathlib import Path
          p = Path('data/quests.json')
          d = json.loads(p.read_text())
          ids = [str(x) for x in (d.get('ids') or [])]
          d['ids'] = list(dict.fromkeys(ids))
          p.write_text(json.dumps(d, indent=2, ensure_ascii=False) + '\n')
          print('state ids', len(d['ids']))
          PY

          git add -f data/quests.json
          if git diff --staged --quiet; then
            echo "No quest state changes"
            exit 0
          fi
          git commit -m "quests: state"

          PUSHED=0
          for i in 1 2 3 4 5 6 7 8; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            sleep $((i + 1))
          done

          if [ "$PUSHED" -ne 1 ]; then
            echo "ERROR: could not push quests.json"
            exit 1
          fi
          echo "STATE_PUSH_OK"

      - name: Fail if quests scraper failed
        if: always() && steps.quests.outcome == 'failure'
        run: exit 1
