name: Apex Rollouts %

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apex-rollouts
  cancel-in-progress: true

jobs:
  rollouts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package.json') }}
          restore-keys: |
            nm-${{ runner.os }}-node22-

      - name: Install npm packages
        run: |
          if [ ! -d node_modules/node-fetch ]; then
            npm install --no-audit --no-fund --no-package-lock
          fi
          rm -f package-lock.json

      - name: Track Apex rollout percentages
        env:
          APEX_WEBHOOK_URL: ${{ secrets.APEX_WEBHOOK_URL }}
          ROLLOUT_WEBHOOK_URL: ${{ secrets.ROLLOUT_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APEX_MIN_PCT_DELTA: '0.5'
        continue-on-error: true
        run: node src/apex_rollouts.js

      - name: Save apex state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f package-lock.json
          git add data/apex_rollouts.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No apex state changes"
            exit 0
          fi
          git commit -m "📊 apex rollouts state" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true
