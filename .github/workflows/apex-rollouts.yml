name: Apex Rollouts %

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-apex-rollouts]

permissions:
  contents: write

# CRITICAL: never cancel a run mid-save — that causes same-% spam on next trigger
concurrency:
  group: apex-rollouts
  cancel-in-progress: false

jobs:
  rollouts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package.json') }}
          restore-keys: |
            nm-${{ runner.os }}-node22-

      - name: Install npm packages
        run: |
          if [ ! -d node_modules/node-fetch ] || [ ! -d node_modules/fs-extra ]; then
            npm install --no-audit --no-fund --no-package-lock
          fi
          rm -f package-lock.json

      - name: Track Apex rollout percentages
        id: apex
        env:
          DISCORD_USER_TOKENS: ${{ secrets.DISCORD_USER_TOKENS }}
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
          DISCORD_USER_TOKEN_1: ${{ secrets.DISCORD_USER_TOKEN_1 }}
          DISCORD_USER_TOKEN_2: ${{ secrets.DISCORD_USER_TOKEN_2 }}
          DISCORD_USER_TOKEN_3: ${{ secrets.DISCORD_USER_TOKEN_3 }}
          DISCORD_USER_TOKEN_4: ${{ secrets.DISCORD_USER_TOKEN_4 }}
          DISCORD_USER_TOKEN_5: ${{ secrets.DISCORD_USER_TOKEN_5 }}
          APEX_WEBHOOK_URL: ${{ secrets.APEX_WEBHOOK_URL }}
          ROLLOUT_WEBHOOK_URL: ${{ secrets.ROLLOUT_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APEX_MIN_PCT_DELTA: "2"
          APEX_RECENT_YEAR: "2024"
          ORBIT_BOT_NAME: Datamining
          ORBIT_AVATAR_URL: https://cdn.jsdelivr.net/gh/kmljkjj/discord-canary-scraper@main/assets/datamining-avatar.svg
        run: node src/apex_rollouts.js

      - name: Save apex state
        if: success()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f package-lock.json
          git add data/apex_rollouts.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No apex state changes"
            exit 0
          fi
          git commit -m "📊 apex rollouts state"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "push retry $i"
            sleep $((i * 2))
          done
          echo "WARN: could not push state — next run may re-diff"
          exit 0
