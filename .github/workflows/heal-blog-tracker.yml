name: Heal Blog Tracker
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          set -euo pipefail
          python3 scripts/restore_blog_tracker.py
          node --check src/blog_tracker.js
          test $(wc -c < src/blog_tracker.js) -gt 15000
          ! grep -q PLACEHOLDER src/blog_tracker.js
          grep -n "mergeStateAfterNotify\|NOTIFY_FAIL\|bodyPreview" src/blog_tracker.js | head
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/blog_tracker.js scripts/restore_blog_tracker.py
          if git diff --staged --quiet; then echo nothing; exit 0; fi
          git commit -m "fix(blog): restore tracker + transactional notify / less false positives"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
