name: Apply Notify Sections
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Patch notify + test + put
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, pathlib
          b64 = pathlib.Path('scripts/patch_notify_sections.b64').read_text() if pathlib.Path('scripts/patch_notify_sections.b64').exists() else ''
          if not b64:
            raise SystemExit('missing scripts/patch_notify_sections.b64')
          pathlib.Path('scripts/patch_notify_sections.py').write_bytes(base64.b64decode(b64))
          print('script', pathlib.Path('scripts/patch_notify_sections.py').stat().st_size)
          PY
          test -s src/lib/notify.js
          grep -qv PLACEHOLDER src/lib/notify.js || { echo BAD; exit 1; }
          python3 scripts/patch_notify_sections.py
          node --check src/lib/notify.js
          npm ci --no-audit --no-fund
          node --test test/webhook_dedupe.test.js test/notify_partial_batch.test.js
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));const t='node --test test/experiment_state.test.js test/experiment_percentages.test.js test/publish_data.test.js test/webhook_dedupe.test.js test/notify_partial_batch.test.js';if(p.scripts.test!==t){p.scripts.test=t;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');}"
          put() {
            local PATH_REL="$1"; local MSG="$2"; local SHA
            SHA=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${PATH_REL}?ref=main" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))")
            python3 - "$PATH_REL" "$MSG" "$SHA" <<'PY'
          import base64, json, os, sys, urllib.request
          path, msg, sha = sys.argv[1], sys.argv[2], sys.argv[3]
          content = open(path, 'rb').read()
          body = {"message": msg, "content": base64.b64encode(content).decode(), "branch": "main"}
          if sha: body["sha"] = sha
          data = json.dumps(body).encode()
          req = urllib.request.Request(
            f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/{path}",
            data=data, method="PUT",
            headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json", "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=60) as r:
            print(path, r.status, len(content))
          PY
          }
          put src/lib/notify.js "fix: per-section webhook claim (search-replace patch)"
          put package.json "test: include webhook_dedupe and partial batch suites"
