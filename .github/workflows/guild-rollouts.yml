name: Guild Rollouts %

on:
  # Schedule remplacé par rollouts-watch.yml (job « long poll » de 19 min :
  # poll du gist toutes les 15 s → % guild notifiés en ~20-30 s).
  # Ce workflow reste disponible en manuel / dispatch.
  # schedule:
  #   - cron: "*/2 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-guild-rollouts]

permissions:
  contents: write

# Ne jamais annuler un run en pleine sauvegarde (sinon spam du même % au run suivant)
concurrency:
  group: guild-rollouts
  cancel-in-progress: false

jobs:
  guild-rollouts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # Setup = Node 22 + cache npm + npm ci --omit=dev (deps runtime only)
      - uses: ./.github/actions/setup

      - name: Syntax check
        run: node --check src/guild_rollouts.js

      - name: Guild rollouts
        id: guild
        env:
          UR_WEBHOOK: ${{ secrets.UR_WEBHOOK }}
          USER_ROLLOUT_WEBHOOK_URL: ${{ secrets.USER_ROLLOUT_WEBHOOK_URL }}
          APEX_WEBHOOK_URL: ${{ secrets.APEX_WEBHOOK_URL }}
          ROLLOUT_WEBHOOK_URL: ${{ secrets.ROLLOUT_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GUILD_ROLLOUT_MIN_DELTA: "1"
        run: node src/guild_rollouts.js

      # exit 2 = webhook en échec : l'état a été écrit SANS avancer "announced" → on le sauvegarde quand même
      - name: Save guild state
        if: always() && steps.guild.outcome != 'cancelled'
        run: |
          scripts/commit-state.sh "data: guild rollouts" data/guild_rollouts.json

      - name: Fail if tracker failed
        if: always() && steps.guild.outcome == 'failure'
        run: exit 1
