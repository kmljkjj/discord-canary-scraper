name: Patch transactional notify

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Apply transactional gates
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('src/index.js')
          text = p.read_text()
          assert 'Canary Pulse' in text and len(text) > 15000

          text = text.replace(
              'Canary Pulse v11.7 \u2014 priority pipeline + integrity gates',
              'Canary Pulse v11.8 \u2014 transactional notify + integrity',
          )
          text = text.replace('=== Canary Pulse v11.7 ===', '=== Canary Pulse v11.8 ===')
          # also try literal emdash if file uses it
          text = text.replace(
              'Canary Pulse v11.7 \u2014 priority pipeline + integrity gates'.encode().decode(),
              'Canary Pulse v11.8 \u2014 transactional notify + integrity',
          )

          # Gate markBuild on okN
          a = """      if (okN) {
        for (const k of Object.keys(strDiff.added)) knownStr.add(k);
        for (const k of Object.keys(rtDiff.added)) knownRt.add(k);
      } else {
        console.warn('NORMAL webhook failed \u2014 NOT marking known str/rt');
      }
      if (isNewBuild && !alreadyBuild) {
        await markBuild(build.buildNumber);
        alreadyBuild = true;
        console.log('BUILD marked after successful extract', build.buildNumber);
      }"""
          # Use actual dashes from file
          import re
          # Find the markBuild after okN block more flexibly
          pattern = r"(if \(okN\) \{[\s\S]*?NOT marking known str/rt'\);\n      \}\n)      if \(isNewBuild && !alreadyBuild\) \{\n        await markBuild\(build\.buildNumber\);\n        alreadyBuild = true;\n        console\.log\('BUILD marked after successful extract', build\.buildNumber\);\n      }"
          repl = r"""\1      if (isNewBuild && !alreadyBuild && okN) {
        await markBuild(build.buildNumber);
        alreadyBuild = true;
        console.log('BUILD marked after successful notifies', build.buildNumber);
      } else if (isNewBuild && !alreadyBuild && !okN) {
        console.warn('BUILD NOT marked \u2014 normal webhook failed (will retry)');
      }"""
          text2, n = re.subn(pattern, repl, text, count=1)
          print('markBuild replacements', n)
          text = text2 if n else text

          # Gate saveLastMap for strings/routes on okN
          old_save = """  await Promise.all([
    saveKnownIds(KNOWN_EXP, knownExp, 8000),
    saveKnownIds(KNOWN_STR, knownStr, 50000),
    saveKnownIds(KNOWN_RT, knownRt, 10000),
    saveLastMap(LAST_EXTRACT_STR, extractedStrings, build.buildNumber),
    saveLastMap(LAST_EXTRACT_RT, nextRt, build.buildNumber),
    saveLastMap(LAST_EXTRACT_EXP, nextExpSnap, build.buildNumber),
  ]);"""
          new_save = """  // Transactional: only advance last_extract str/rt if notify succeeded
  const strRtOk = typeof okN === 'undefined' ? true : okN;
  const tasks = [
    saveKnownIds(KNOWN_EXP, knownExp, 8000),
    saveKnownIds(KNOWN_STR, knownStr, 50000),
    saveKnownIds(KNOWN_RT, knownRt, 10000),
    saveLastMap(LAST_EXTRACT_EXP, nextExpSnap, build.buildNumber),
  ];
  if (strRtOk) {
    tasks.push(saveLastMap(LAST_EXTRACT_STR, extractedStrings, build.buildNumber));
    tasks.push(saveLastMap(LAST_EXTRACT_RT, nextRt, build.buildNumber));
  } else {
    console.warn('SKIP last_extract strings/routes \u2014 notify failed (retry next run)');
  }
  await Promise.all(tasks);"""
          if old_save in text:
              text = text.replace(old_save, new_save)
              print('last_extract gated')
          else:
              print('save block not found')

          # Hoist okN
          if 'const okN = await notifyNormal' in text:
              text = text.replace('const okN = await notifyNormal', 'okN = await notifyNormal', 1)
              text = text.replace(
                  'if (process.env.DISCORD_WEBHOOK_URL) {\n    try {',
                  'let okN = true;\n  if (process.env.DISCORD_WEBHOOK_URL) {\n    try {',
                  1,
              )
              print('okN hoisted')

          p.write_text(text)
          print('done', len(text))
          PY
          node --check src/index.js
          head -3 src/index.js
          grep -n 'BUILD NOT marked\|SKIP last_extract\|successful notifies\|strRtOk' src/index.js || true

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git commit -m "fix: v11.8 transactional notify - no snapshot advance on webhook fail" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true
