name: P0 notify dedupe and cleanup

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply P0 patches
        run: |
          set -euo pipefail
          python3 scripts/p0_patch_dedupe.py
          python3 scripts/p0_patch_notify.py
          python3 scripts/p0_cleanup_workflows.py
          node --check src/lib/webhook_dedupe.js
          node --check src/lib/notify.js

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "fix(p0): per-event experiment dedupe + remove one-shot workflows" || true
          git pull --rebase origin main || true
          git push origin main
