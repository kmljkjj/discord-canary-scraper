name: Patch apex Wumpus-style
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_apex_wumpus_style.py'
      - '.github/workflows/patch-apex-wumpus.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          set -euo pipefail
          python3 scripts/patch_apex_wumpus_style.py
          node --check src/apex_rollouts.js
          grep -n "discordClientHeaders\|WUMPUS_DEFS\|v4 (Wumpus" src/apex_rollouts.js | head -15
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/apex_rollouts.js
          git commit -m "feat(apex): Wumpus-style Discord client headers + defs gist" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
