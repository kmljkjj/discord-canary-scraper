name: Restore Notify Seg
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble + put
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, pathlib, json, os, urllib.request
          b64 = "".join(pathlib.Path(f"scripts/notify_parts/p{i}.b64").read_text() for i in range(3))
          data = base64.b64decode(b64)
          pathlib.Path("src/lib/notify.js").write_bytes(data)
          print("wrote", len(data))
          PY
          node --check src/lib/notify.js
          SHA=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/src/lib/notify.js?ref=main" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))")
          python3 - "$SHA" <<'PY'
          import base64, json, os, sys, urllib.request
          sha = sys.argv[1]
          content = open("src/lib/notify.js", "rb").read()
          body = {
            "message": "fix: restore notify.js — per-section webhook recovery",
            "content": base64.b64encode(content).decode(),
            "branch": "main",
          }
          if sha:
            body["sha"] = sha
          data = json.dumps(body).encode()
          req = urllib.request.Request(
            f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/src/lib/notify.js",
            data=data, method="PUT",
            headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
            },
          )
          with urllib.request.urlopen(req, timeout=60) as r:
            print("put", r.status)
          PY
