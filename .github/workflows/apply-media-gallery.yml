name: Apply Media Gallery
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply MediaGallery patch
        run: python3 scripts/apply_media_gallery.py
      - name: Syntax check
        run: node --check src/lib/components_v2.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/components_v2.js scripts/apply_media_gallery.py
          git status
          git commit -m "fix: preserve embed images as MediaGallery in Components V2" || exit 0
          git pull --rebase origin main || git pull --rebase --autostash origin main
          git push
