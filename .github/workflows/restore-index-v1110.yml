name: Restore index v11.10
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore v11.9 then apply degraded guard
        run: |
          set -euo pipefail
          # Known-good v11.9 commit
          git show b9f73795016ef6600639cc216865207b80294cd9:src/index.js > src/index.js
          python3 << 'PY'
          from pathlib import Path
          src = Path('src/index.js').read_text()
          src = src.replace(
            ' * Canary Pulse v11.9 — full transactional notify (no state advance on webhook fail)\n',
            ' * Canary Pulse v11.10 — transactional notify + degraded extract guard\n',
          )
          src = src.replace(
            "console.log('=== Canary Pulse v11.9 ===');",
            "console.log('=== Canary Pulse v11.10 ===');",
          )
          old = '''  {
    const expN = (findings.experiments || []).length;
    const strN = Object.keys(findings.strings || {}).length;
    const rtN = Object.keys(findings.routes || {}).length;
    const ds = findings.downloadStats || {};
    console.log('Integrity check', { expN, strN, rtN, downloadStats: ds });
    if (expN === 0 && strN < 50 && Object.keys(lastExp).length > 40) {
      try {
        await fs.writeJson(LAST_RUN_META, {
          schemaVersion: 1,
          buildNumber: String(build.buildNumber),
          ts: Date.now(),
          status: 'failed',
          ok: false,
          reason: 'EXTRACTION_EMPTY',
          downloadStats: ds,
        });
      } catch {}
      console.error(
        'EXTRACTION_ERROR: empty extract vs non-empty baseline — refuse state update',
      );
      process.exit(1);
    }
  }'''
          new = '''  {
    const expN = (findings.experiments || []).length;
    const strN = Object.keys(findings.strings || {}).length;
    const rtN = Object.keys(findings.routes || {}).length;
    const ds = findings.downloadStats || {};
    const baseExp = Object.keys(lastExp).length;
    const baseStr = Object.keys(lastStr).length;
    const baseRt = Object.keys(lastRt).length;
    console.log('Integrity check', {
      expN,
      strN,
      rtN,
      baseExp,
      baseStr,
      baseRt,
      downloadStats: ds,
    });

    if (expN === 0 && strN < 50 && baseExp > 40) {
      try {
        await fs.writeJson(LAST_RUN_META, {
          schemaVersion: 1,
          buildNumber: String(build.buildNumber),
          ts: Date.now(),
          status: 'failed',
          ok: false,
          reason: 'EXTRACTION_EMPTY',
          downloadStats: ds,
        });
      } catch {}
      console.error(
        'EXTRACTION_ERROR: empty extract vs non-empty baseline — refuse state update',
      );
      process.exit(1);
    }

    const solidBaseline = baseExp >= 80 && baseStr >= 200;
    if (solidBaseline) {
      const ratioExp = expN / Math.max(baseExp, 1);
      const ratioStr = strN / Math.max(baseStr, 1);
      const ratioRt = baseRt >= 40 ? rtN / Math.max(baseRt, 1) : 1;
      const degraded =
        (ratioExp < 0.55 && ratioStr < 0.7) ||
        (ratioStr < 0.55 && ratioExp < 0.7) ||
        ratioExp < 0.45 ||
        ratioStr < 0.45;
      if (degraded) {
        try {
          await fs.writeJson(LAST_RUN_META, {
            schemaVersion: 1,
            buildNumber: String(build.buildNumber),
            ts: Date.now(),
            status: 'failed',
            ok: false,
            reason: 'EXTRACTION_DEGRADED',
            ratios: {
              exp: Math.round(ratioExp * 1000) / 1000,
              str: Math.round(ratioStr * 1000) / 1000,
              rt: Math.round(ratioRt * 1000) / 1000,
            },
            counts: { expN, strN, rtN, baseExp, baseStr, baseRt },
            downloadStats: ds,
          });
        } catch {}
        console.error(
          'EXTRACTION_ERROR: degraded extract vs solid baseline — refuse state update',
          { ratioExp, ratioStr, ratioRt, expN, strN, baseExp, baseStr },
        );
        process.exit(1);
      }
    }
  }'''
          if old not in src:
              raise SystemExit('integrity block not found')
          src = src.replace(old, new)
          src = src.replace(
          '''  if (extractedExpCount < 20 && extractedStrCount < 100) {\n    console.warn('empty extract');\n    process.exit(0);\n  }''',
          '''  if (extractedExpCount < 20 && extractedStrCount < 100) {\n    console.warn('empty extract — abort without state advance');\n    try {\n      await fs.writeJson(LAST_RUN_META, {\n        schemaVersion: 1,\n        buildNumber: String(build.buildNumber),\n        ts: Date.now(),\n        status: 'failed',\n        ok: false,\n        reason: 'EXTRACTION_TOO_SMALL',\n      });\n    } catch {}\n    process.exit(1);\n  }''',
          )
          Path('src/index.js').write_text(src)
          print('patched', len(src), 'EXTRACTION_DEGRADED' in src)
          PY
          node --check src/index.js
          grep -n "v11.10\|EXTRACTION_DEGRADED\|EXTRACTION_TOO_SMALL" src/index.js | head
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git commit -m "fix: index.js v11.10 degraded extract guard"
          git push origin HEAD:main
