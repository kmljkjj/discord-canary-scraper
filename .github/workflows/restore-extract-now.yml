name: Restore extract.js
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node scripts/_extract_b64/assemble.js
      - run: node --check src/lib/extract.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/extract.js
          git commit -m "fix(extract): restore + fewer false strings + better routes" || exit 0
          rm -rf scripts/_extract_b64 .github/workflows/restore-extract-now.yml .github/workflows/fix-extract-str-rt.yml
          git add -A scripts/_extract_b64 .github/workflows/ || true
          git commit -m "chore: remove extract restore helpers" || true
          git push
