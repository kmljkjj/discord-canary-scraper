name: Patch UR_WEBHOOK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Insert UR_WEBHOOK as first candidate
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path('src/user_rollouts.js')
          js = p.read_text()
          needle = "  ['USER_ROLLOUT_WEBHOOK_URL', process.env.USER_ROLLOUT_WEBHOOK_URL],\n"
          insert = (
              "  ['UR_WEBHOOK', process.env.UR_WEBHOOK],\n"
              + needle
          )
          if "process.env.UR_WEBHOOK" in js:
              print('already patched')
          elif needle not in js:
              raise SystemExit('needle not found')
          else:
              js = js.replace(needle, insert, 1)
              js = js.replace(
                  'la première var définie gagne (USER_ROLLOUT_WEBHOOK_URL',
                  'la première var définie gagne (UR_WEBHOOK',
                  1,
              )
              js = js.replace(
                  'USER_ROLLOUT_WEBHOOK_URL | APEX_WEBHOOK_URL | ROLLOUT_WEBHOOK_URL | DISCORD_WEBHOOK_URL',
                  'UR_WEBHOOK | USER_ROLLOUT_WEBHOOK_URL | APEX_WEBHOOK_URL | ROLLOUT_WEBHOOK_URL | DISCORD_WEBHOOK_URL',
                  1,
              )
              js = js.replace(
                  '// Ordre : salon dédié (USER_ROLLOUT_WEBHOOK_URL)',
                  '// Ordre : salon dédié (UR_WEBHOOK, puis USER_ROLLOUT_WEBHOOK_URL)',
                  1,
              )
              p.write_text(js)
              print('patched size', p.stat().st_size)
          assert "process.env.UR_WEBHOOK" in p.read_text()
          PY
          node --check src/user_rollouts.js

      - name: Commit and cleanup workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/user_rollouts.js
          git commit -m "feat(user-rollouts): short secret UR_WEBHOOK (fallback long name)" || true
          rm -f .github/workflows/patch-ur-wh.yml .github/workflows/restore-ur-webhook.yml
          git add -A .github/workflows/ || true
          git commit -m "chore: remove one-shot patch workflows" || true
          git push
