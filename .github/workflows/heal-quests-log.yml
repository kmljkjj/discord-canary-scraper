name: Heal Quests Known Log
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          set -euo pipefail
          python3 scripts/patch_quests_known_log.py
          # ensure the 6 spam IDs stay marked
          python3 - << 'PY'
          import json
          from pathlib import Path
          p = Path('data/quests.json')
          d = json.loads(p.read_text()) if p.exists() else {'ids': []}
          ids = set(map(str, d.get('ids') or []))
          for x in ['1539421708417765386','1549171029241233449','1551999809626439731','1552002448975994942','1552010656952356925','1550379237335367680']:
              ids.add(x)
          d['ids'] = list(ids)
          p.write_text(json.dumps(d, indent=2, ensure_ascii=False) + '\n')
          print(len(d['ids']))
          PY
          node --check src/quests.js
          test $(wc -c < src/quests.js) -gt 15000
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/quests.js data/quests.json .github/workflows/quests.yml scripts/patch_quests_known_log.py
          if git diff --staged --quiet; then echo nothing; exit 0; fi
          git commit -m "fix(quests): simplify workflow (no runtime rewrite) + known-ids log"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
