name: Emergency Restore SEE_LOCAL
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore three files from last good commit
        run: |
          set -euo pipefail
          GOOD=710a1aeed80d82d0fb2305977a73f545663c390d
          git show "$GOOD:src/lib/notify.js" > src/lib/notify.js
          git show "$GOOD:src/lib/components_v2.js" > src/lib/components_v2.js
          git show "$GOOD:src/index.js" > src/index.js
          node --check src/lib/notify.js
          node --check src/lib/components_v2.js
          node --check src/index.js
          echo "restored OK from $GOOD"
          head -c 60 src/lib/notify.js; echo
      - name: Commit restore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/notify.js src/lib/components_v2.js src/index.js
          git status
          git commit -m "fix: restore notify/components/index from 710a1ae (undo SEE_LOCAL)" || exit 0
          git push
