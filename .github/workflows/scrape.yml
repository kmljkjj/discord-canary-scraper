name: Scrape Discord Canary

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-scraping]

permissions:
  contents: write

concurrency:
  group: canary-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          # package-lock généré ne doit pas bloquer le push
          rm -f package-lock.json
          git checkout -- package-lock.json 2>/dev/null || true

      - name: Scrape + notify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node src/index.js

      - name: Commit baseline (anti-spam memory)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Ignorer le bruit npm / assets
          rm -f package-lock.json
          git checkout -- package.json 2>/dev/null || true
          git clean -fd package-lock.json 2>/dev/null || true

          git add -f \
            data/known_experiment_ids.json \
            data/known_string_keys.json \
            data/announced_builds.json \
            data/build.json \
            data/experiments.json \
            data/strings.json \
            data/routes.json \
            data/meta.json \
            data/ || true

          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi

          git commit -m "🔄 canary baseline $(date -u +%Y-%m-%dT%H:%MZ)" || true

          # autostash = OK même s'il reste des fichiers unstaged
          for i in 1 2 3 4 5 6 7 8; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pushed baseline OK"
              exit 0
            fi
            echo "Push retry $i..."
            # jeter le bruit local qui bloque rebase
            git stash push -u -m "noise-$i" || true
            sleep 3
          done

          echo "::warning::Could not push baseline"
          exit 0
