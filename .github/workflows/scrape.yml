name: Scrape Discord Canary

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-scraping]

permissions:
  contents: write

concurrency:
  group: canary-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Scrape + notify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node src/index.js

      - name: Commit data (baseline)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Baseline anti-spam files must be committed
          git add -f data/build.json data/experiments.json data/strings.json data/routes.json data/endpoints.json data/meta.json data/announced_builds.json data/processed_build.json data/findings.json data/asset_stats.json 2>/dev/null || true
          git add -f data/ || true
          if git diff --staged --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "🔄 canary $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          echo "Push skipped after retries (will sync next run)"
          exit 0
