name: Scrape Discord Canary

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-scraping]

permissions:
  contents: write

concurrency:
  group: canary-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Scrape + notify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCRAPE_WEB_ONLY: '1'
        run: node src/index.js

      - name: Commit baseline
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f package-lock.json

          git add -f \
            data/known_experiment_ids.json \
            data/known_string_keys.json \
            data/known_route_keys.json \
            data/last_extract_strings.json \
            data/last_extract_routes.json \
            data/announced_builds.json \
            data/build.json \
            data/experiments.json \
            data/strings.json \
            data/routes.json \
            data/meta.json \
            data/wumpus_cache/ \
            data/ || true

          if git diff --staged --quiet; then
            echo "No data changes"
            exit 0
          fi

          git commit -m "🔄 canary baseline $(date -u +%Y-%m-%dT%H:%MZ)" || true

          for i in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pushed baseline OK"
              exit 0
            fi
            git stash push -u -m "noise-$i" || true
            sleep 2
          done
          echo "::warning::push failed"
          exit 0
