name: Scrape Discord Canary

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-scraping]

permissions:
  contents: write

concurrency:
  group: canary-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Watch build (instant webhook)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node src/watch_build.js

      - name: Full scrape
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FAST_MODE: '1'
        run: node src/scrape.js

      - name: Quests
        continue-on-error: true
        env:
          QUEST_WEBHOOK_URL: ${{ secrets.QUEST_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: node src/quests.js

      - name: Commit & push state (force-add data)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # CRITICAL: these files must be tracked or every run re-spams webhooks
          git add -f data/build.json data/notify_state.json data/asset_stats.json \
            data/strings.json data/routes.json data/endpoints.json \
            data/findings.json data/quests.json data/mobile_versions.json \
            data/mobile_experiments.json 2>/dev/null || true
          git add -f data/ || true
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git status --short
          git commit -m "🔄 Canary scrape $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Push OK"
              exit 0
            fi
            echo "push retry $i"
            sleep 2
          done
          echo "Push failed after retries"
          exit 1
