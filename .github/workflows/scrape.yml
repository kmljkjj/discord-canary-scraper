name: Scrape Discord Canary

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-scraping]

permissions:
  contents: write

concurrency:
  group: canary-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Garde anti-tempête : un repository_dispatch pour un build déjà scrapé est un no-op
      # (job vert, aucune alerte, aucun commit). Le cron et workflow_dispatch passent toujours.
      # Le build visé vient de client_payload.build (trigger v2.5) ou, pour les anciens
      # déclencheurs sans payload, du BUILD_NUMBER live de canary.discord.com.
      - name: Garde — build déjà scrapé ?
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BUILD: ${{ github.event.client_payload.build }}
        run: |
          if [ "$EVENT_NAME" != "repository_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current=$(node -e "try{console.log(require('./data/build.json').buildNumber||'')}catch(e){console.log('')}")
          target="$DISPATCH_BUILD"
          if [ -z "$target" ]; then
            target=$(curl -fsSL --max-time 20 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/131.0.0.0" \
              https://canary.discord.com/app 2>/dev/null \
              | grep -oE '"BUILD_NUMBER"[[:space:]]*:[[:space:]]*"?[0-9]+' | grep -oE '[0-9]+$' | head -1 || true)
            echo "pas de client_payload.build — BUILD_NUMBER live : '${target:-?}'"
          fi
          if [ -n "$target" ] && [ -n "$current" ] && [ "$target" = "$current" ]; then
            echo "build $target déjà scrapé (data/build.json) — run ignoré"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "dispatch build='${target:-n/a}' current='${current:-n/a}' → scrape"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup
        if: steps.guard.outputs.skip != 'true'

      - name: Syntax check
        if: steps.guard.outputs.skip != 'true'
        run: npm run check

      - name: Scrape + notify + archive chunks
        if: steps.guard.outputs.skip != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCRAPE_WEB_ONLY: '1'
          SCRAPE_CSS: '0'
          DOWNLOAD_CONCURRENCY: '24'
          DOWNLOAD_RETRIES: '4'
          ARCHIVE_KEEP_BUILDS: '8'
          ORBIT_BOT_NAME: ${{ secrets.ORBIT_BOT_NAME }}
          ORBIT_AVATAR_URL: ${{ vars.ORBIT_AVATAR_URL || format('https://cdn.jsdelivr.net/gh/{0}@main/media/datamining-avatar.png', github.repository) }}
          EMOJI_ADDED: ${{ secrets.EMOJI_ADDED }}
          EMOJI_MODIFIED: ${{ secrets.EMOJI_MODIFIED }}
          EMOJI_REMOVED: ${{ secrets.EMOJI_REMOVED }}
          EMOJI_BUILD: ${{ secrets.EMOJI_BUILD }}
          EMOJI_EXP: ${{ secrets.EMOJI_EXP }}
          EMOJI_STR: ${{ secrets.EMOJI_STR }}
          EMOJI_ROUTE: ${{ secrets.EMOJI_ROUTE }}
        run: node src/index.js

      - name: Run summary
        if: always() && steps.guard.outputs.skip != 'true'
        run: node scripts/summary.js

      - name: Commit baseline + archive
        if: success() && steps.guard.outputs.skip != 'true'
        run: |
          BUILD_NUM=$(node -e "try{console.log(require('./data/build.json').buildNumber||'unknown')}catch(e){console.log('unknown')}")
          scripts/commit-state.sh "canary build: ${BUILD_NUM}" \
            data/known_experiment_ids.json \
            data/known_string_keys.json \
            data/known_route_keys.json \
            data/last_extract_strings.json \
            data/last_extract_routes.json \
            data/last_extract_experiments.json \
            data/current_experiments.json \
            data/removed_experiments.json \
            data/announced_builds.json \
            data/notify_dedupe.json \
            data/last_run_meta.json \
            data/build.json \
            data/experiments.json \
            data/apex_experiments.json \
            data/findings.json \
            data/strings.json \
            data/routes.json \
            data/meta.json \
            data/generation.json \
            data/cache \
            builds
