name: Scrape Discord Canary

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-scraping]

permissions:
  contents: write

concurrency:
  group: canary-scrape
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package.json') }}
          restore-keys: |
            nm-${{ runner.os }}-node22-

      - name: Install dependencies
        run: |
          if [ ! -d node_modules/node-fetch ]; then
            npm install --no-audit --no-fund --no-package-lock
          else
            echo "cache hit"
          fi
          rm -f package-lock.json

      - name: Scrape + notify + archive chunks
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCRAPE_FULL_CHUNKS: '1'
          SCRAPE_CSS: '0'
          DOWNLOAD_CONCURRENCY: '48'
          ARCHIVE_CHUNKS: '1'
          ARCHIVE_COPY_ALL: '1'
          ARCHIVE_KEEP_BUILDS: '6'
          ORBIT_BOT_NAME: Datamining
          EMOJI_ADDED: ${{ secrets.EMOJI_ADDED }}
          EMOJI_MODIFIED: ${{ secrets.EMOJI_MODIFIED }}
          EMOJI_REMOVED: ${{ secrets.EMOJI_REMOVED }}
          EMOJI_BUILD: ${{ secrets.EMOJI_BUILD }}
          EMOJI_EXP: ${{ secrets.EMOJI_EXP }}
          EMOJI_STR: ${{ secrets.EMOJI_STR }}
          EMOJI_ROUTE: ${{ secrets.EMOJI_ROUTE }}
        run: node src/index.js

      - name: Zip chunks for GitHub Release
        id: zip
        run: |
          set -e
          if [ ! -f builds/zip-hint.json ]; then
            echo "No zip-hint — skip release zip"
            echo "has_zip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BN=$(node -e "console.log(require('./builds/zip-hint.json').buildNumber||'')")
          if [ -z "$BN" ]; then
            echo "has_zip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DIR="builds/${BN}"
          if [ ! -d "$DIR" ]; then
            echo "has_zip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ZIP="canary-${BN}-chunks.zip"
          # Prefer files/ (all chunks); fallback to whole build folder
          if [ -d "${DIR}/files" ] && [ "$(ls -A "${DIR}/files" 2>/dev/null | head -1)" ]; then
            (cd "${DIR}/files" && zip -qr -9 "../../../${ZIP}" .)
          else
            (cd "$DIR" && zip -qr -9 "../../${ZIP}" . -x 'files/*')
          fi
          ls -lh "$ZIP" || true
          echo "has_zip=true" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP}" >> "$GITHUB_OUTPUT"
          echo "build=${BN}" >> "$GITHUB_OUTPUT"

      - name: Upload chunks Release
        if: steps.zip.outputs.has_zip == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: canary-${{ steps.zip.outputs.build }}
          name: Canary ${{ steps.zip.outputs.build }} · chunks
          body: |
            Discord Canary build **${{ steps.zip.outputs.build }}**
            Full webpack chunk archive from this scrape.
          files: ${{ steps.zip.outputs.zip_name }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Commit baseline + build archives
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f package-lock.json
          rm -f canary-*-chunks.zip 2>/dev/null || true

          # data + manifests + web bundles (NOT builds/*/files — too large for git)
          git add -f \
            data/known_experiment_ids.json \
            data/known_string_keys.json \
            data/known_route_keys.json \
            data/last_extract_strings.json \
            data/last_extract_routes.json \
            data/last_extract_experiments.json \
            data/announced_builds.json \
            data/build.json \
            data/experiments.json \
            data/strings.json \
            data/routes.json \
            data/meta.json \
            data/cache/ \
            data/ \
            builds/latest.json \
            builds/zip-hint.json \
            2>/dev/null || true

          # Per-build: manifest + web.*.js only
          if [ -d builds ]; then
            for d in builds/*/; do
              [ -d "$d" ] || continue
              git add -f "${d}manifest.json" 2>/dev/null || true
              git add -f "${d}"web.*.js 2>/dev/null || true
            done
          fi

          # Ensure heavy chunk dumps stay untracked
          git reset -q -- builds/*/files 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No data changes"
            exit 0
          fi

          BUILD_NUM=$(node -e "try{console.log(require('./data/build.json').buildNumber||'unknown')}catch(e){console.log('unknown')}")
          git commit -m "canary build : ${BUILD_NUM}" || true

          for i in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pushed baseline OK"
              exit 0
            fi
            git stash push -u -m "noise-$i" || true
            sleep 1
          done
          echo "::warning::push failed"
          exit 0
