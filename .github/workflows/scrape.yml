name: Scrape Discord Canary

on:
  schedule:
    # Backup only — real speed comes from repository_dispatch (bot / script)
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-scraping]

permissions:
  contents: write

concurrency:
  group: canary-scrape
  # New build must not wait behind an old run
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package.json') }}
          restore-keys: |
            nm-${{ runner.os }}-node22-

      - name: Install dependencies
        run: |
          if [ ! -d node_modules/node-fetch ]; then
            npm install --no-audit --no-fund --no-package-lock
          else
            echo "cache hit"
          fi
          rm -f package-lock.json

      - name: Scrape + notify (priority)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCRAPE_WEB_ONLY: '1'
          ORBIT_BOT_NAME: Datamining
        run: node src/index.js

      - name: Commit baseline
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f package-lock.json

          git add -f \
            data/known_experiment_ids.json \
            data/known_string_keys.json \
            data/known_route_keys.json \
            data/last_extract_strings.json \
            data/last_extract_routes.json \
            data/announced_builds.json \
            data/build.json \
            data/experiments.json \
            data/strings.json \
            data/routes.json \
            data/meta.json \
            data/wumpus_cache/ \
            data/ || true

          if git diff --staged --quiet; then
            echo "No data changes"
            exit 0
          fi

          git commit -m "🔄 canary baseline $(date -u +%Y-%m-%dT%H:%MZ)" || true

          for i in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pushed baseline OK"
              exit 0
            fi
            git stash push -u -m "noise-$i" || true
            sleep 1
          done
          echo "::warning::push failed"
          exit 0
