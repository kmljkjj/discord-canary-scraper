name: Scrape Discord Canary

on:
  schedule:
    # Toutes les 5 minutes (UTC). GitHub peut retarder un peu.
    - cron: '*/5 * * * *'
  workflow_dispatch: # Manuel (bouton Run workflow)
  repository_dispatch: # Trigger externe (comme Wumpus Central)
    types: [trigger-scraping]

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional user token → full assignment list (like DEH / Wumpus sampling)
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          USER_ROLLOUT_SAMPLES: '60'
          USER_ROLLOUT_DELAY_MS: '350'
        run: npm run scrape

      - name: Commit & push if changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ data/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔄 New Discord Canary build / findings"
            git push
          fi
